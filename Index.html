<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>PIXEL FORGE</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mitr:wght@300;400;500;600&family=Silkscreen:wght@400;700&display=swap">
<style>
/* Layout: phone app shell — top bar, one scrolling screen, bottom tab bar; battles open as a full-screen arcade overlay. One deliberate dark "night forge" look. */
:root{
  --ink:#0d0a18;--panel:#17122e;--panel2:#221a44;--line:#3a3068;--ember:#ff8a3d;--ember2:#ffc35a;--rune:#4fe3d6;
  --text:#f1ecff;--dim:#a79dcf;--bad:#ff5c7a;--good:#6dffa8;--shadow:#06040d;
  --f-body:'Mitr',system-ui,'Noto Sans Thai',sans-serif;--f-px:'Silkscreen','Mitr',ui-monospace,monospace;
  color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--ink);color:var(--text);font-family:var(--f-body);font-size:15px;line-height:1.55;overflow:hidden;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
#app{height:100%;display:flex;flex-direction:column}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--panel);box-shadow:0 2px 0 var(--line);position:relative;z-index:2}
.logo{font-family:var(--f-px);font-weight:700;font-size:17px;letter-spacing:.06em}
.logo span,.logo-big span{color:var(--ember)}
#scrTitle{font-weight:500;color:var(--rune);font-size:15px}
main{flex:1;overflow-y:auto;overflow-x:hidden;padding-block:16px 32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.scr{max-width:880px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.tabs{display:grid;grid-template-columns:repeat(6,1fr);background:var(--panel);box-shadow:0 -2px 0 var(--line);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.tabs button{background:none;border:0;padding:10px 2px 9px;font-size:12px;color:var(--dim);display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;min-width:0}
.tabs button::before{content:"";width:8px;height:8px;background:var(--line)}
.tabs button.on{color:var(--text)}
.tabs button.on::before{background:var(--ember);box-shadow:0 0 0 2px #ff8a3d55}
.btn{background:var(--panel2);border:0;padding:10px 16px;min-height:44px;font-weight:500;cursor:pointer;box-shadow:0 0 0 2px var(--line),inset 0 -3px 0 #0006;transition:transform .08s}
.btn:active{transform:translateY(2px)}
.btn:focus-visible,.chip:focus-visible,.opt:focus-visible,.tabs button:focus-visible{outline:2px solid var(--rune);outline-offset:3px}
.btn.pri{background:var(--ember);color:#2a1206;box-shadow:0 0 0 2px #ffb27a,inset 0 -3px 0 #a3420d}
.btn.danger{background:#5a1830;box-shadow:0 0 0 2px var(--bad),inset 0 -3px 0 #0006}
.btn.sm{min-height:38px;padding:6px 12px;font-size:14px}
.btn.big{min-height:56px;font-size:17px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.card{background:var(--panel);box-shadow:0 0 0 2px var(--line),5px 5px 0 0 var(--shadow);padding:14px}
.sec{font-size:16px;font-weight:600;margin:6px 0 0;display:flex;align-items:center;gap:8px;flex-wrap:wrap;text-wrap:balance}
.sec::before{content:"";width:8px;height:8px;background:var(--ember);flex:none}
.sec em{font-style:normal;font-weight:400;font-size:12px;color:var(--rune);padding:1px 8px;box-shadow:0 0 0 1px var(--rune)}
.muted{color:var(--dim);font-size:13px}
.toolbar{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
.fld{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--dim);min-width:0}
.fld.grow{flex:1 1 180px}
.fld input,.fld select,select,textarea{background:#0f0b22;border:0;box-shadow:0 0 0 2px var(--line);padding:9px 10px;min-height:42px;color:var(--text);font-size:15px;width:100%}
textarea{min-height:120px;font-family:ui-monospace,monospace;font-size:12px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:#0f0b22;border:0;box-shadow:0 0 0 2px var(--line);padding:7px 12px;min-height:38px;cursor:pointer;font-size:14px}
.chip.on{box-shadow:0 0 0 2px var(--rune);background:#123a44;color:#e7fffc}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.opt{text-align:left;background:#0f0b22;border:0;box-shadow:0 0 0 2px var(--line);padding:10px 12px;cursor:pointer;display:flex;flex-direction:column;gap:2px;min-width:0}
.opt b{font-weight:600}
.opt small{color:var(--dim);font-size:12px;line-height:1.4}
.opt.on{box-shadow:0 0 0 2px var(--ember);background:#2a1a2a}
.opt .dot{width:12px;height:12px;display:inline-block;margin-right:6px;vertical-align:-1px}
canvas{image-rendering:pixelated;image-rendering:crisp-edges}
/* home */
.hero{display:grid;grid-template-columns:minmax(0,1fr) min(40%,280px);align-items:center;gap:10px 14px;background:radial-gradient(120% 90% at 50% 100%,#3a1d3a 0,var(--panel) 60%);box-shadow:0 0 0 2px var(--line),5px 5px 0 var(--shadow);padding:16px}
.hero canvas{width:100%;justify-self:center;aspect-ratio:160/84;order:2}
.hero>div{order:1;min-width:0}
.logo-big{font-family:var(--f-px);font-weight:700;font-size:clamp(26px,7.5vw,52px);line-height:.95;letter-spacing:.04em;margin:4px 0 6px;text-shadow:3px 3px 0 #3a1408}
.lede{margin:0;color:var(--dim);max-width:46ch;font-size:14px}
@media (max-width:480px){.hero{padding:12px}.lede{font-size:12.5px;line-height:1.45}}
.quick{display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
.qgrp{display:grid;gap:8px;min-width:0}
.qh{margin:0;font-family:var(--f-px);font-size:13px;letter-spacing:.08em;color:var(--dim);font-weight:400}
.qplay{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.qmake{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.qb{display:grid;gap:2px;align-content:center;justify-items:start;text-align:left;padding:10px 12px;min-height:58px}
.qb b{font-size:15px;font-weight:600}.qb small{font-size:12px;color:var(--dim);font-weight:400;line-height:1.3}
.qb.pri small{color:#4a1f0c}
.qmain{grid-column:1/-1;min-height:72px}.qmain b{font-size:19px}
.qstudio{grid-column:1/-1}
@media (min-width:760px){.quick{grid-template-columns:1.1fr 1fr;align-items:start}.qplay{grid-template-columns:1fr}.qmain{min-height:88px}}
.who{display:flex;gap:14px;align-items:center}
.who img{width:72px;height:auto;image-rendering:pixelated;flex:none;background:#0f0b22;box-shadow:0 0 0 2px var(--line)}
.who>div{min-width:0}
.unl{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.unl li{display:flex;gap:10px;align-items:center;background:var(--panel);box-shadow:0 0 0 2px var(--line);padding:10px 12px}
.unl li i{width:14px;height:14px;flex:none;background:var(--line)}
.unl li.got i{background:var(--good)}
.unl li div{min-width:0}
.statg{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.stat{background:var(--panel);box-shadow:0 0 0 2px var(--line);padding:10px 12px}
.stat b{display:block;font-family:var(--f-px);font-size:22px;color:var(--ember2);font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--dim)}
/* creator */
.cgrid{display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
@media (min-width:760px){.cgrid{grid-template-columns:260px minmax(0,1fr)}.pvwrap{position:sticky;top:0;align-self:start}}
.pv{display:flex;flex-direction:column;gap:10px;align-items:center}
.pv canvas{width:200px;aspect-ratio:40/34;background:#0f0b22}
.form{display:flex;flex-direction:column;gap:12px;min-width:0}
.steps{display:grid;gap:8px}
.step{display:grid;grid-template-columns:96px 44px minmax(0,1fr) 44px;gap:8px;align-items:center}
.step span{font-size:13px;color:var(--dim)}
.step output{text-align:center;background:#0f0b22;box-shadow:0 0 0 2px var(--line);padding:8px 4px;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.step .btn{padding:0;min-height:40px}
.crow{display:grid;grid-template-columns:52px minmax(0,1fr) 44px;gap:8px;align-items:center}
.crow>span{font-size:13px;color:var(--dim)}
.sw{display:flex;flex-wrap:wrap;gap:5px}
.swb{width:22px;height:22px;border:0;background:var(--c);box-shadow:0 0 0 1px #0008;cursor:pointer;padding:0}
.swb.on{box-shadow:0 0 0 2px var(--text),0 0 0 4px var(--ink)}
input[type=color]{width:44px;height:38px;border:0;background:none;padding:0;cursor:pointer}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}
.kv div{background:#0f0b22;box-shadow:0 0 0 2px var(--line);padding:8px 10px;font-size:12px;color:var(--dim)}
.kv b{display:block;font-size:17px;color:var(--text);font-variant-numeric:tabular-nums}
.slots{display:grid;gap:8px}
.slots label{display:grid;grid-template-columns:60px minmax(0,1fr);gap:8px;align-items:center;font-size:13px;color:var(--dim)}
.savebar{position:sticky;bottom:-32px;margin:0 -4px;padding:10px 4px 14px;background:linear-gradient(transparent,var(--ink) 30%);display:flex;gap:10px;flex-wrap:wrap;align-items:center;z-index:3}
.savebar .grow{flex:1 1 100%;font-size:13px;color:var(--ember2)}.savebar .grow:empty{display:none}.savebar .btn{flex:1 1 auto}
/* skill */
.spv canvas{width:100%;aspect-ratio:256/96;background:#0f0b22;display:block}
.sline{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:13px;color:var(--dim)}
.sline b{color:var(--text);font-variant-numeric:tabular-nums}
.desc{margin:8px 0 0;font-size:13px;color:var(--rune)}
.sl{display:grid;grid-template-columns:110px minmax(0,1fr) 28px;gap:10px;align-items:center;font-size:13px;color:var(--dim)}
.sl output{font-family:var(--f-px);color:var(--text);text-align:right}
input[type=range]{width:100%;accent-color:var(--ember);min-height:32px}
.budget{display:flex;flex-direction:column;gap:6px}
.bm{height:12px;background:#0f0b22;box-shadow:0 0 0 2px var(--line);position:relative}
.bm i{position:absolute;inset:0 auto 0 0;background:var(--rune)}
.budget.over .bm i{background:var(--bad)}
.budget.over b{color:var(--bad)}
/* fight */
.seg{display:grid;grid-template-columns:1fr 1fr;gap:0;box-shadow:0 0 0 2px var(--line)}
.seg button{background:#0f0b22;border:0;padding:12px 8px;min-height:48px;cursor:pointer;font-weight:500;color:var(--dim)}
.seg button.on{background:var(--ember);color:#2a1206}
.load{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.load span{font-size:12px;padding:3px 8px;background:#0f0b22;box-shadow:0 0 0 1px var(--line)}
.help{font-size:13px;color:var(--dim);margin:0}
.help kbd{font-family:var(--f-px);font-size:11px;padding:1px 5px;box-shadow:0 0 0 1px var(--line);color:var(--text)}
.rules{display:grid;gap:8px}
.rule{display:grid;grid-template-columns:28px minmax(0,1fr) minmax(0,1fr);gap:6px;align-items:center}
.rule .ctl{grid-column:2/4;display:flex;gap:6px;justify-content:flex-end}
.rule .n{font-family:var(--f-px);color:var(--ember2);text-align:center}
.rule select{min-height:40px;font-size:13px;padding:6px}
@media (min-width:620px){.rule{grid-template-columns:28px minmax(0,1fr) minmax(0,1fr) auto}.rule .ctl{grid-column:auto}}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px;min-width:520px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap;font-variant-numeric:tabular-nums}
th{color:var(--dim);font-weight:400}
.w{color:var(--good)}.l{color:var(--bad)}
.skbar{display:grid;grid-template-columns:minmax(0,130px) minmax(0,1fr) auto;gap:8px;align-items:center;font-size:13px}
.skbar span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.skbar div{height:10px;background:#0f0b22}
.skbar div i{display:block;height:100%;background:var(--ember)}
/* sandbox */
.tools{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.tools .chip{display:flex;align-items:center;gap:6px;justify-content:flex-start}
.tools .chip i{width:12px;height:12px;flex:none;background:var(--tc)}
.edwrap{overflow-x:auto;box-shadow:0 0 0 2px var(--line);background:#120d26}
#sandCv{display:block;width:720px;max-width:none;aspect-ratio:480/192;cursor:crosshair;touch-action:pan-x pan-y}
@media (min-width:900px){#sandCv{width:100%}}
.selp{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
/* library */
.list{display:grid;gap:10px}
.item{display:grid;grid-template-columns:56px minmax(0,1fr);gap:12px;align-items:center;background:var(--panel);box-shadow:0 0 0 2px var(--line);padding:10px}
.item img,.item .ic{width:56px;height:56px;background:#0f0b22;image-rendering:pixelated;box-shadow:0 0 0 1px var(--line)}
.item .ic{display:grid;place-items:center}
.item .ic i{width:22px;height:22px;background:var(--c);box-shadow:0 0 12px var(--c)}
.item b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .acts2{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px}
.badge{font-size:11px;color:#2a1206;background:var(--ember2);padding:1px 6px;margin-left:6px}
.toggle{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:6px 0}
/* modal / toast */
#modal{position:fixed;inset:0;z-index:230;background:#07050fcc;display:grid;place-items:center;padding:16px}
.mbox{background:var(--panel);box-shadow:0 0 0 2px var(--ember),6px 6px 0 var(--shadow);padding:18px;max-width:380px;width:100%;display:flex;flex-direction:column;gap:14px}
.mbox p{margin:0}
.mrow{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;z-index:95;background:var(--panel2);box-shadow:0 0 0 2px var(--rune);padding:10px 16px;max-width:min(92vw,420px);pointer-events:none;transition:.2s;font-size:14px;z-index:240}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast.bad{box-shadow:0 0 0 2px var(--bad)}
#toast.gold{box-shadow:0 0 0 2px var(--ember2);color:var(--ember2)}
/* game */
#game{position:fixed;inset:0;z-index:50;background:#07050f;display:flex;flex-direction:column;gap:8px;padding-top:max(8px,env(safe-area-inset-top,0px));padding-bottom:max(8px,env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));user-select:none;-webkit-user-select:none}
.g-top{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.g-top .grow{flex:1;font-size:13px;color:var(--dim);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.g-body{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1.4fr;grid-template-rows:auto 1fr;grid-template-areas:"stage stage" "dpad acts";gap:12px}
.g-stage{grid-area:stage;position:relative;width:100%;max-width:min(960px,calc((100dvh - 300px) * 1.6667));min-width:min(100%,300px);justify-self:center}
.g-stage canvas{display:block;width:100%;aspect-ratio:320/192;background:#120d26}
.hud{position:absolute;left:6px;right:6px;top:6px;display:flex;justify-content:space-between;gap:8px;pointer-events:none;font-size:11px;line-height:1.2}
.bars{display:grid;gap:3px;width:min(46%,220px)}
.bar{position:relative;height:13px;background:#000a;box-shadow:0 0 0 1px #0008}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--bad)}
.bar.mp i{background:#5aa8ff}
.bar span{position:relative;padding-left:4px;font-size:10px;text-shadow:1px 1px 0 #000}
.hudr{text-align:right;text-shadow:1px 1px 0 #000;font-size:11px}
#bossBar{position:absolute;left:15%;right:15%;bottom:6px;pointer-events:none}
#bossBar .bar{height:10px}
#bossBar .bar i{background:#d36bff}
#bossBar p{margin:0 0 2px;font-size:10px;text-align:center;text-shadow:1px 1px 0 #000}
.banner{position:absolute;left:0;right:0;top:36%;text-align:center;font-weight:600;font-size:clamp(16px,4vw,26px);color:var(--ember2);text-shadow:2px 2px 0 #000;pointer-events:none;animation:ban 2.2s forwards}
@keyframes ban{0%{opacity:0;transform:scale(.8)}12%{opacity:1;transform:scale(1)}80%{opacity:1}100%{opacity:0}}
.dpad{grid-area:dpad;display:grid;grid-template-columns:1fr 1fr;gap:10px;align-content:end}
.acts{grid-area:acts;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;align-content:end}
.pb{border:0;background:#1c1638;box-shadow:0 0 0 2px var(--line),inset 0 -4px 0 #0008;min-height:64px;font-size:15px;font-weight:500;touch-action:none;cursor:pointer;color:var(--text)}
.pb.held{background:#3a2f66;transform:translateY(2px)}
.dpad .pb{min-height:80px;font-size:26px}
.pb.atk{grid-column:span 2;background:#4a1f12;box-shadow:0 0 0 2px var(--ember),inset 0 -4px 0 #0008}
.pb.jmp{background:#123a44;box-shadow:0 0 0 2px var(--rune),inset 0 -4px 0 #0008}
.pb.sk{font-size:12px;line-height:1.25;padding:4px;min-height:56px;overflow:hidden;background:linear-gradient(to top,#000b calc(var(--cd,0)*100%),transparent 0),var(--skc,#1c1638)}
.pb.sk small{display:block;font-family:var(--f-px);font-size:11px;color:var(--ember2)}
.pb.sk:disabled{opacity:.35}
.khelp{display:none;grid-column:1/-1;text-align:center}
@media (hover:hover) and (pointer:fine){.dpad,.acts{display:none}.g-body{grid-template-areas:"stage stage" "help help"}.khelp{display:block;grid-area:help}.g-stage{max-width:min(960px,calc((100dvh - 150px) * 1.6667))}}
@media (orientation:landscape) and (max-height:560px){.g-body{grid-template-columns:minmax(110px,.8fr) minmax(0,3fr) minmax(150px,1.1fr);grid-template-rows:1fr;grid-template-areas:"dpad stage acts"}.g-stage{max-width:calc((100dvh - 80px) * 1.6667);align-self:center}.dpad .pb{min-height:70px}.pb{min-height:48px}}
/* portrait phones: full-width stage, HUD under the picture, bigger controls */
@media (orientation:portrait) and (max-width:760px){
#game{gap:6px}
.g-body{grid-template-rows:minmax(0,1fr) auto;gap:10px}
.g-stage{margin:0 -16px;width:calc(100% + 32px);max-width:none;min-width:0;align-self:center}
.g-stage .hud{position:static;padding:8px 12px 0;font-size:13px;gap:10px}
.g-stage .bars{width:min(62%,300px);gap:4px}
.g-stage .bar{height:18px}.g-stage .bar span{font-size:12px;line-height:18px}
.g-stage .hudr{font-size:13px;line-height:1.35}
#bossBar{position:static;padding:6px 12px 0}#bossBar p{font-size:12px}
.dpad,.acts{align-content:end}
.dpad .pb{min-height:128px;font-size:30px}
.acts .pb{min-height:70px}.acts .pb.sk{min-height:66px;font-size:13px}.acts .pb.atk,.acts .pb.jmp{min-height:96px;font-size:17px}
#game #vsHud{position:static;padding:8px 12px 0;font-size:12px}
#game .vsS .bar{height:14px}#game .vsS .bar.mp{height:6px}#game .vsS .vsN{font-size:13px}#game .vsC b{font-size:20px}
#game.vs2 .vpad .pb{min-height:56px}#game.vs2 .vpad .pb.sk{min-height:46px}#game.vs2 .vpad .pb.atk{min-height:64px}
}
#game.auto .dpad,#game.auto .acts,#game.auto .khelp{display:none}
#game.auto .g-body{grid-template-areas:"stage stage" "info info"}
.ainfo{grid-area:info;display:none}
#game.auto .ainfo{display:block}
.g-ov{position:absolute;inset:0;z-index:5;background:#07050fe6;display:grid;place-items:center;overflow:auto;padding:16px}

 cleared wave restores 35% HP and full energy","เลือกตัวละครและสนาม":"Pick a character and arena","ตรงนี้เลือกตัวละครและสนามที่จะสู้ ใต้รายการจะเห็นสกิลทั้ง 3 ช่อง อาวุธ และเกราะของตัวละครนั้น":"Choose the character and arena to fight in here. Below the list you'll see that character's 3 skill slots, weapon and armor","การต่อสู้เริ่มทันทีเมื่อกดปุ่ม":"The battle starts as soon as you press","แตะ":"Tap","แตะปุ่มสีส้ม":"Tap the orange button","กดปุ่ม":"Hold the","ค้างไว้ หรือกด A D บนคีย์บอร์ด เพื่อเดินเข้าหาศัตรู":"button, or press A D on the keyboard, to walk toward the enemies","เดินไปทางขวาสักระยะ":"Walk to the right for a bit","ค้างไว้ หรือกดปุ่ม D ค้าง":"held, or hold the D key","กดปุ่มโจมตีค้างไว้เพื่อโจมตีต่อเนื่อง ความเสียหายขึ้นกับอาวุธของตัวละคร":"Hold the attack button to attack continuously. Damage depends on the character's weapon","โจมตีอย่างน้อย 1 ครั้ง":"Attack at least once","หรือปุ่ม J":"or the J key","ใช้สกิล":"Use a skill","ปุ่มสกิลแสดงพลังงานที่ใช้และเวลารอใช้สกิล ถ้าพลังงานไม่พอปุ่มจะเข้มลง":"Skill buttons show the energy cost and cooldown. If you don't have enough energy the button darkens","ใช้สกิลช่องใดก็ได้ 1 ครั้ง":"Use any skill once","กดปุ่มสกิลด้านบนปุ่มโจมตี หรือกด K":"Press a skill button above the attack button, or press K","อ่านหน้าจอการต่อสู้":"Reading the battle screen","เกมหยุดไว้ระหว่างอธิบาย แถบแดงคือพลังชีวิต แถบฟ้าคือพลังงาน มุมขวาบอกระลอกปัจจุบัน ถ้าบอสปรากฏจะมีแถบพลังชีวิตบอสด้านล่าง":"The game is paused while we explain. The red bar is HP, the blue bar is energy, the top right shows the current wave. When the boss appears its HP bar shows at the bottom","หยุดและกลับเมนู":"Pause and return to menu","ปุ่มหยุดชั่วคราวเปิดเมนูที่มี เล่นต่อ เริ่มใหม่ และกลับเมนู":"The pause button opens a menu with Resume, Restart and Back to menu","แล้วกด":"then press","กดปุ่มที่ไฮไลต์อยู่ตามลำดับ":"Press the highlighted buttons in order","ทำอย่างไรให้โจมตีต่อเนื่องโดยไม่ต้องกดซ้ำ":"How do you attack continuously without pressing again?","กดปุ่มโจมตีค้างไว้":"Hold the attack button","กดกระโดดพร้อมโจมตี":"Jump and attack together","ใช้สกิลช่อง 1":"Use skill slot 1","ปุ่มโจมตีและปุ่ม J กดค้างได้":"The attack button and the J key can be held","เคลียร์ระลอกแล้วได้อะไร":"What do you get for clearing a wave?","ไม่มีอะไร":"Nothing","ฟื้นพลังชีวิต 35% และพลังงานเต็ม":"35% HP and full energy restored","ได้สกิลใหม่":"A new skill","ทุกครั้งที่เคลียร์ระลอกในป้อมผลึกจะฟื้นพลังชีวิต 35% และพลังงานเต็ม":"Every wave cleared in the Crystal Fort restores 35% HP and full energy","ตัวเลขบนปุ่มสกิลหมายถึงอะไร":"What does the number on a skill button mean?","จำนวนครั้งที่ใช้แล้ว":"How many times it was used","เวลารอใช้สกิลที่เหลือ (วินาที)":"Remaining cooldown (seconds)","เมื่อเพิ่งใช้สกิล ปุ่มจะแสดงวินาทีที่ต้องรอก่อนใช้อีกครั้ง":"Right after using a skill, the button shows the seconds until you can use it again","แถบเมนูและหน้าจอทั้ง 6":"The menu bar and all 6 screens","เดินดูทุกหน้าผ่านแถบเมนูด้านล่าง และรู้ว่าแต่ละหน้าใช้ทำอะไร":"Visit every page through the bottom menu bar and learn what each one is for","แถบเมนูอยู่ด้านล่างสุดของจอเสมอ เรียงจากซ้าย: หน้าแรก ตัวละคร สกิล ต่อสู้ สนาม คลัง":"The menu bar is always at the very bottom. From the left: Home, Character, Skill, Battle, Arena, Library","หลักการของแต่ละหน้า":"How each page works","หน้าที่สร้างของ (ตัวละคร สกิล สนาม) มีปุ่มบันทึกอยู่ด้านล่างเสมอ การแก้ไขที่ยังไม่บันทึกจะมีข้อความสีเหลืองเตือน":"Pages where you build things (character, skill, arena) always have a Save button at the bottom. Unsaved changes show a yellow warning","ถ้าเห็นข้อความ":"If you see","ให้กดบันทึกก่อนออกจากหน้า":"press Save before leaving the page","ประกอบรูปลักษณ์ เลือกเกราะและอาวุธ และใส่สกิล 3 ช่อง":"Assemble the look, pick armor and weapon, and fill 3 skill slots","ผสมรูปแบบการโจมตี ธาตุ และพฤติกรรม แล้วดูตัวอย่างเอฟเฟกต์ทันที":"Mix attack type, element and behavior, and see the effect preview instantly","เลือกสู้เองหรือให้ AI สู้ พร้อมตารางเปรียบเทียบผล":"Fight yourself or let the AI fight, with a results comparison table","วางพื้น สิ่งกีดขวาง ศัตรู และหุ่นฝึกบนตาราง แล้วทดสอบได้ทันที":"Place ground, obstacles, enemies and dummies on a grid, then test right away","รวมผลงานทั้งหมด ทำสำเนา ลบ สำรองข้อมูล และตั้งค่าเกม":"All your work: duplicate, delete, back up and game settings","กลับมาที่หน้าแรกได้ทุกเมื่อ":"Return to the home page any time","หน้า":"Page","ในแถบด้านล่าง":"in the bottom bar","ถ้าต้องการทำสำเนาสกิล ต้องไปหน้าใด":"Which page do you use to duplicate a skill?","หน้าคลังผลงานมีปุ่มทำสำเนาและลบของทุกประเภท":"The Library page has Duplicate and Delete for every type of item","หน้าใดใช้วางศัตรูและหุ่นฝึก":"Which page do you use to place enemies and dummies?","หน้าสร้างสนามมีเครื่องมือวางศัตรู หุ่นฝึก และพื้น":"The arena builder has tools to place enemies, dummies and ground","รู้จักพลังชีวิต พลังงาน เวลารอใช้สกิล ระลอก และปุ่มควบคุม":"Learn about HP, energy, cooldowns, waves and the control buttons","แถบพลังชีวิตและพลังงานอยู่มุมซ้ายบนของจอเกม ข้อมูลระลอกอยู่มุมขวาบน":"The HP and energy bars are at the top left of the game screen; wave info is top right","คำศัพท์สำคัญ":"Key terms","พลังชีวิตหมดคือแพ้ พลังงานใช้ร่ายสกิลและฟื้นเองทุกวินาที เวลารอใช้สกิลคือช่วงที่ต้องรอหลังใช้สกิล":"Running out of HP means defeat. Energy is spent on skills and regenerates every second. Cooldown is the wait after using a skill","อาวุธ":"Weapon","ฟื้นพลังงานเร็วกว่าอาวุธอื่น เหมาะกับบิลด์ที่ใช้สกิลบ่อย":"regenerates energy faster than other weapons; great for skill-heavy builds","พลังชีวิตและพลังงาน":"HP and energy","เกมหยุดไว้ระหว่างอธิบาย แถบแดงคือพลังชีวิต แถบฟ้าคือพลังงาน ตัวเลขบอกค่าปัจจุบัน":"The game is paused while we explain. The red bar is HP, the blue bar is energy; the numbers show current values","ระลอกและเวลา":"Waves and time","มุมขวาบอกระลอกที่กำลังสู้ ในโหมดอัตโนมัติจะบอกเวลาด้วย ในสนามที่ไม่มีศัตรูจะบอกความเสียหายต่อวินาที":"The top right shows the current wave. In auto mode it also shows time; in arenas without enemies it shows damage per second","ปุ่มสกิลและเวลารอ":"Skill buttons and cooldowns","ปุ่มสกิลมีแถบมืดไล่จากล่างขึ้นบนตามเวลารอ ตัวเลขสีเหลืองคือพลังงานที่ใช้หรือวินาทีที่เหลือ":"A skill button darkens from bottom to top during its cooldown. The yellow number is the energy cost or the seconds left","ออกจากการต่อสู้":"Leaving a battle","ทุกครั้งที่ต้องการออก ให้หยุดชั่วคราวแล้วกดกลับเมนู":"Whenever you want to leave, pause and press Back to menu","กดปุ่มที่ไฮไลต์อยู่":"Press the highlighted button","แถบสีฟ้าบนจอเกมคืออะไร":"What is the blue bar on the game screen?","แถบฟ้าคือพลังงาน ใช้ร่ายสกิล":"The blue bar is energy, used to cast skills","ถ้าปุ่มสกิลเขียนว่า":"If a skill button says","ควรทำอย่างไร":"what should you do?","รอให้พลังงานฟื้นหรือโจมตีปกติไปก่อน":"Wait for energy to regenerate, or use basic attacks meanwhile","กดสกิลซ้ำเร็ว ๆ":"Mash the skill button","ออกจากเกม":"Quit the game","พลังงานฟื้นเองทุกวินาที ระหว่างนั้นใช้การโจมตีปกติได้":"Energy regenerates every second; you can use basic attacks in the meantime","สร้างตัวละครตัวแรก":"Create your first character","สร้างตัวละครใหม่ ปรับรูปลักษณ์ เลือกเกราะ อาวุธ สกิล และบันทึก":"Create a new character, adjust its look, pick armor, weapon and skills, then save","แท็บที่ 2":"Tab 2","ด้านบนคือตัวอย่างและท่าทาง ด้านล่างคือชิ้นส่วน สี อุปกรณ์ และช่องสกิล ปุ่มบันทึกอยู่ล่างสุด":"At the top are the preview and poses; below are parts, colors, gear and skill slots. The Save button is at the very bottom","ตกแต่งกับความสามารถแยกกัน":"Looks and stats are separate","ทรงผม ใบหน้า ชุด หมวก และเครื่องประดับเป็นของตกแต่ง ไม่มีผลต่อการต่อสู้ ส่วนเกราะและอาวุธเปลี่ยนค่าพลังจริง":"Hair, face, outfit, headgear and accessories are cosmetic and don't affect combat; armor and weapons change real stats","พลังชีวิต 150 ป้องกัน 4 แต่ความเร็วเหลือ 85%":"HP 150, defense 4, but speed drops to 85%","ตัวละครหนึ่งตัวใส่สกิลได้ 3 ช่อง ช่องเดียวกันใช้ทั้งการต่อสู้เองและการต่อสู้อัตโนมัติ":"Each character has 3 skill slots. The same slots are used in manual and auto battles","เริ่มตัวละครใหม่":"Start a new character","ปุ่มนี้สร้างร่างตัวละครใหม่จากตัวที่ใช้อยู่ ตัวเดิมจะไม่ถูกแก้":"This button makes a new character draft from the active one; the original isn't changed","ด้านบน ถ้ามีหน้าต่างถามให้กดยืนยัน":"at the top. If a dialog asks, press confirm","เปลี่ยนทรงผม":"Change hair","สลับตัวเลือก ตัวอย่างด้านบนเปลี่ยนทันที ตัวเลือกที่ยังล็อกจะถูกข้าม":"cycles options; the preview above updates instantly. Locked options are skipped","ในแถว":"in the row","เลือกสีชุด":"Pick an outfit color","แตะสีสำเร็จรูป หรือกดกล่องสีด้านขวาเพื่อเลือกสีเอง":"Tap a preset color, or the color box on the right to pick your own","เปลี่ยนสีชุด":"Change outfit color","แตะช่องสีในแถว":"Tap a color swatch in the row","เลือกเกราะ":"Choose armor","เกราะเปลี่ยนพลังชีวิต การป้องกัน และความเร็วจริง ดูตัวเลขสรุปด้านล่างหลังเลือก":"Armor really changes HP, defense and speed. See the summary numbers below after picking","เลือกเกราะแบบอื่น":"Pick a different armor","แตะการ์ดเกราะที่ยังไม่ได้เลือก":"Tap an armor card that isn't selected","เลือกอาวุธ":"Choose a weapon","ดาบฟันระยะใกล้ คทายิงลูกแก้วและฟื้นพลังงานเร็ว ปืนพลาสมายิงไกลและเร็ว":"The sword slashes up close, the staff fires orbs and regenerates energy fast, the plasma gun shoots far and fast","เลือกอาวุธแบบอื่น":"Pick a different weapon","แตะการ์ดอาวุธที่ยังไม่ได้เลือก":"Tap a weapon card that isn't selected","ใส่สกิล":"Equip skills","เลือกสกิลให้แต่ละช่อง ช่อง 1 ถึง 3 ตรงกับปุ่มสกิลในการต่อสู้":"Pick a skill for each slot. Slots 1 to 3 match the skill buttons in battle","เปลี่ยนสกิลในช่องใดก็ได้":"Change the skill in any slot","แตะรายการในช่องสกิลแล้วเลือกสกิลอื่น":"Tap a skill slot list and pick another skill","ตัวละครจะเก็บลงคลังและใช้ได้ทุกโหมด":"The character is stored in your library and works in every mode","ด้านล่าง":"at the bottom","ใช้ตัวละครนี้ (เลือกได้)":"Use this character (optional)","กดเพื่อให้ตัวละครนี้เป็นตัวหลักในการต่อสู้ ถ้าอยากใช้ตัวเดิมต่อ กดถัดไปได้เลย":"Press to make this your main fighter. To keep the current one, just press Next","หรือกดถัดไป":"or press Next","ข้อใดมีผลต่อค่าพลังในการต่อสู้":"Which of these affects combat stats?","สีชุด":"Outfit color","เกราะและอาวุธมีผลต่อค่าพลัง ส่วนอื่นเป็นของตกแต่ง":"Armor and weapons affect stats; everything else is cosmetic","ตัวละครหนึ่งตัวใส่สกิลได้กี่ช่อง":"How many skill slots does a character have?","มี 3 ช่อง ตรงกับปุ่มสกิล 3 ปุ่ม":"3 slots, matching the 3 skill buttons","หลอมสกิลของคุณเอง":"Forge your own skill","ผสมรูปแบบการโจมตี ธาตุ และพฤติกรรม ปรับค่าในแต้มหลอม แล้วบันทึก":"Mix attack type, element and behavior, tune values within forge points, then save","แท็บที่ 3":"Tab 3","ตัวอย่างเอฟเฟกต์อยู่ด้านบน ตัวเลือกและแถบปรับค่าอยู่ด้านล่าง":"The effect preview is at the top; options and sliders are below","สามส่วนประกอบ":"Three components","รูปแบบการโจมตีกำหนดวิธียิง ธาตุเพิ่มผลพิเศษ พฤติกรรมเปลี่ยนการทำงาน ทุกการผสมทำงานจริงทั้งในการต่อสู้เองและอัตโนมัติ":"Attack type sets how it fires, the element adds a special effect, behavior changes how it works. Every combination really works in both manual and auto battles","ทุกตัวเลือกและค่าที่ปรับใช้แต้มหลอม รวมได้ไม่เกิน 16 แต้ม ถ้าเกินจะบันทึกไม่ได้":"Every option and slider costs forge points. The total can't exceed 16; over the limit you can't save","ความแรง 5 + ความถี่ 5 + ระเบิดพื้นที่ (2) + โจมตีหลายครั้ง (3) = 15 แต้ม เหลือให้ระยะได้แค่ 1":"Power 5 + Use rate 5 + Area blast (2) + Multi-hit (3) = 15 points, leaving only 1 for range","เริ่มสกิลใหม่โดยไม่แตะสกิลเดิม":"Start a new skill without touching existing ones","ข้างรายการสกิล":"next to the skill list","กระสุนยิงไกล ฟันแรงที่สุด พุ่งโจมตีเป็นอมตะระหว่างพุ่ง ระเบิดพื้นที่โดนหลายตัว":"Bolt shoots far, Slash hits hardest, Dash strike is invincible while dashing, Area blast hits several","เลือกรูปแบบอื่น":"Pick another type","แตะการ์ดรูปแบบที่ยังไม่ได้เลือก":"Tap a type card that isn't selected","ไฟติดไฟต่อเนื่อง น้ำแข็งทำให้ช้า สายฟ้ากระโดดไปตัวอื่น พลังงานแรงขึ้นและไม่สนเกราะ":"Fire burns over time, ice slows, lightning arcs to others, energy hits harder and ignores armor","เลือกธาตุอื่น":"Pick another element","แตะการ์ดธาตุ":"Tap an element card","เปลี่ยนวิธีที่สกิลทำงาน เช่น แยกเป็น 3 กระสุน หรือโจมตีซ้ำ 3 ครั้ง":"Changes how the skill works, e.g. split into 3 bolts or hit 3 times","เลือกพฤติกรรมอื่น":"Pick another behavior","แตะการ์ดพฤติกรรม":"Tap a behavior card","ความแรงเพิ่มความเสียหาย ระยะเพิ่มระยะยิง ความถี่ลดเวลารอใช้สกิล ทุกค่าใช้แต้มหลอม":"Power raises damage, range raises reach, use rate lowers cooldown. Every value costs forge points","ลากแถบใดแถบหนึ่ง":"Drag any slider","ลากปุ่มกลมบนแถบ":"Drag the round handle on the slider","ไปทางซ้ายหรือขวา":"left or right","แถบนี้บอกแต้มที่ใช้ไป ถ้าเป็นสีแดงแปลว่าเกิน 16 ต้องลดค่าใดค่าหนึ่งก่อนบันทึก":"This bar shows points used. Red means over 16: lower a value before saving","ตัวอย่างเอฟเฟกต์":"Effect preview","ตัวละครที่ใช้อยู่จะลองยิงสกิลใส่หุ่นฝึก 3 ตัวซ้ำ ๆ ใช้ดูระยะและพื้นที่จริง":"Your active character repeatedly fires the skill at 3 dummies, so you can see the real range and area","สกิลที่บันทึกแล้วจะไปอยู่ในรายการช่องสกิลของหน้าตัวละคร":"Saved skills appear in the skill slot lists on the Character page","แต้มหลอมเกิน 16 อยู่ ลดค่าบนแถบใดแถบหนึ่งก่อน":"Forge points are over 16. Lower a slider first","แต้มหลอมรวมได้สูงสุดเท่าไร":"What's the maximum total of forge points?","สูงสุด 16 แต้ม ถ้าเกินปุ่มบันทึกจะกดไม่ได้":"16 points max. Over that, the Save button is disabled","ธาตุใดทำให้ศัตรูช้าลง":"Which element slows enemies?","น้ำแข็งทำให้ช้าลงครึ่งหนึ่ง 2 วินาที":"Ice slows by half for 2 seconds","ทำอะไร":"What does it do?","ทำซ้ำ 3 ครั้ง แต่ละครั้งเบาลง":"Repeats 3 times, each weaker","ยิง 3 ทิศทาง":"Fires in 3 directions","ไม่สนเกราะ":"Ignores armor","ทำซ้ำ 3 ครั้ง (พุ่ง 2 ครั้ง) แต่ละครั้งความเสียหายลดลง":"Repeats 3 times (dash 2), each dealing less damage","สร้างสนามทดลอง":"Build a test arena","วางแพลตฟอร์ม ศัตรู ย้ายวัตถุ บันทึก และทดสอบสนาม":"Place platforms and enemies, move objects, save and test the   <p class="muted" id="sandInfo">แตะช่องเพื่อวาง · ใช้ "เลือก / ย้าย" แตะวัตถุแล้วแตะช่องว่างเพื่อย้าย · ศัตรู ${nE}/16 ตัว${a.objs.some(o=>o.t==='player')?'':' · ยังไม่มีจุดเกิดผู้เล่น'}</p>
  <div id="selPanel"></div>
  <div class="savebar"><span class="grow">${ED.arenaDirty?'มีการแก้ไขที่ยังไม่บันทึก':''}</span><button class="btn danger sm" data-act="sandClear">ล้างสนาม</button><button class="btn" data-act="sandTest">ทดสอบสนาม</button><button class="btn pri" data-act="sandSave">บันทึกสนาม</button></div>`;

function renderSel(){const el=$('#selPanel');if(!el)return;const o=ED.sel;if(!o||!ED.arena.objs.includes(o)){ED.sel=null;el.innerHTML='';return}
  el.innerHTML=`<div class="card selp"><div class="grow muted" style="flex:1 1 100%">วัตถุที่เลือก: <b style="color:var(--text)">${o.t==='player'?'จุดเกิดผู้เล่น':FOES[o.t].n}</b> ที่ช่อง (${o.x+1}, ${o.y+1}) — แตะช่องว่างในตารางเพื่อย้าย</div>${o.t!=='player'?`<label class="fld"><span>เปลี่ยนเป็น</span><select id="selType">${Object.entries(FOES).map(([k,f])=>opt(k,f.n,o.t===k)).join('')}</select></label>`:''}<button class="btn sm danger" data-act="selDel">ลบวัตถุ</button><button class="btn sm" data-act="selNone">ยกเลิกการเลือก</button></div>`}
function drawEditor(){const cv=$('#sandCv');if(!cv)return;const g=cv.getContext('2d'),a=ED.arena;g.imageSmoothingEnabled=false;
  g.fillStyle='#120d26';g.fillRect(0,0,480,192);g.fillStyle='#4fe3d614';for(let x=0;x<=30;x++)g.fillRect(x*T,0,1,192);for(let y=0;y<=12;y++)g.fillRect(0,y*T,480,1);
  for(let y=0;y<12;y++)for(let x=0;x<30;x++){const t=+a.tiles[y*30+x];if(t)drawTile(g,t,x*T,y*T,y===0||+a.tiles[(y-1)*30+x]!==1)}
  for(const o of a.objs){if(o.t==='player')drawHero(g,activeChar(),o.x*T+8,(o.y+1)*T,1,'idle',0,false);else drawFoe(g,{type:o.t,x:o.x*T+8,y:(o.y+1)*T,face:-1,hurtT:0,st:0,swing:0,onGround:true,t:0,hp:1,maxhp:1,h:FOES[o.t].h,boss:o.t==='boss',dummy:o.t==='dummy'},0)}
  if(ED.sel){g.strokeStyle='#ffc35a';g.lineWidth=1;g.strokeRect(ED.sel.x*T+.5,ED.sel.y*T+.5,T-1,T-1)}}
function setTile(x,y,v){const a=ED.arena,i=y*30+x;a.tiles=a.tiles.slice(0,i)+v+a.tiles.slice(i+1)}
function applyTool(x,y){const a=ED.arena,tool=ED.tool,at=a.objs.find(o=>o.x===x&&o.y===y);
  if(tool[0]==='t'){const v=+tool[1];setTile(x,y,v);if(at&&(v===1||v===4))a.objs.splice(a.objs.indexOf(at),1)}
  else if(tool==='erase'){if(at)a.objs.splice(a.objs.indexOf(at),1);else setTile(x,y,0)}
  else if(tool==='select'){if(at)ED.sel=at;else if(ED.sel){ED.sel.x=x;ED.sel.y=y;if(a.tiles[y*30+x]==='1'||a.tiles[y*30+x]==='4')setTile(x,y,0)}else return}
  else if(tool==='player'){a.objs=a.objs.filter(o=>o.t!=='player'&&o!==at);a.objs.push({t:'player',x,y});if('14'.includes(a.tiles[y*30+x]))setTile(x,y,0)}
  else{if(at&&at.t!=='player')at.t=tool;else{if(at)return toast('ช่องนี้มีจุดเกิดผู้เล่นอยู่แล้ว');if(tool!=='dummy'&&a.objs.filter(o=>FOES[o.t]&&o.t!=='dummy').length>=16)return toast('วางศัตรูได้สูงสุด 16 ตัวต่อสนาม','bad');a.objs.push({t:tool,x,y})}if('14'.includes(a.tiles[y*30+x]))setTile(x,y,0)}
  ED.arenaDirty=true;drawEditor();renderSel();
  const nE=a.objs.filter(o=>FOES[o.t]&&o.t!=='dummy').length;$('#sandInfo').textContent='แตะช่องเพื่อวาง · ใช้ "เลือก / ย้าย" แตะวัตถุแล้วแตะช่องว่างเพื่อย้าย · ศัตรู '+nE+'/16 ตัว'+(a.objs.some(o=>o.t==='player')?'':' · ยังไม่มีจุดเกิดผู้เล่น');
  const sb=$('#s-sand .savebar .grow');if(sb)sb.textContent='มีการแก้ไขที่ยังไม่บันทึก'}
function bindEditor(){const cv=$('#sandCv');let st=null,last='';
  const cell=e=>{const r=cv.getBoundingClientRect();return[clamp(Math.floor((e.clientX-r.left)/r.width*30),0,29),clamp(Math.floor((e.clientY-r.top)/r.height*12),0,11)]};
  cv.addEventListener('pointerdown',e=>{st={x:e.clientX,y:e.clientY,mouse:e.pointerType==='mouse'};last='';if(st.mouse&&ED.tool[0]==='t'){const[x,y]=cell(e);last=x+','+y;applyTool(x,y)}});
  cv.addEventListener('pointermove',e=>{if(!st||!st.mouse||!(e.buttons&1)||(ED.tool[0]!=='t'&&ED.tool!=='erase'))return;const[x,y]=cell(e);if(x+','+y!==last){last=x+','+y;applyTool(x,y)}});
  cv.addEventListener('pointerup',e=>{if(!st)return;const moved=Math.hypot(e.clientX-st.x,e.clientY-st.y);const[x,y]=cell(e);if(moved<10&&x+','+y!==last)applyTool(x,y);st=null});
  cv.addEventListener('pointercancel',()=>{st=null})}

  else if(t==='ais')body=D.ais.map(a=>`<div class="item"><div class="ic" style="--c:#4fe3d6"><i></i></div><div><b>${esc(a.name)}</b><span class="muted">สไตล์${STYLES[a.style].n} · ${a.rules.length} กฎ</span></div>${btns('ais',a.id)}</div>`).join('');

/* =====================================================================
   SKILL STUDIO — Phase 1 editor shell
   Four separate layers, each usable without the ones below it:
   [Document]  SS schema, newLayer/newNode, sampleDoc, vDoc   (pure data)
   [Runtime]   trackVal/layerAt/drawFxLayer, dataIn, GraphRun, scene step (no DOM)
   [Store]     StudioStore — localStorage adapter; IndexedDB can replace it later
               with the same list/load/save/remove/last methods
   [Editor]    ES state, history (undo/redo), commands
   [UI]        panel renderers + pointer/keyboard binding
   The studio keeps its own storage key, so the game save is never touched.

function newLayer(kind){const p={};for(const k of[...SS.COMMON,...SS.KP[kind]])p[k]=SS.DEF[k];if(kind==='orb'||kind==='trail')p.anchor='projectile';const L={id:sid('L'),name:SS.KINDS[kind].n,kind,visible:true,locked:false,p};if(kind==='art')L.art=newArt();return L}
function newNode(type,x,y){const d=SS.NODES[type],p={};for(const k in d.p)p[k]=d.p[k].d;return{id:sid('N'),type,x:Math.round(x),y:Math.round(y),p}}

  const N=(t,x,y,p)=>{const n=newNode(t,x,y);Object.assign(n.p,p||{});doc.nodes.push(n);return n};

    e=N('damage',780,20),f=N('status',970,20,{kind:'fire',sec:3}),g=N('playfx',780,170,{layer:L4.id,at:'target'}),h=N('playfx',970,170,{layer:L5.id,at:'target'}),

function vNum(v,def,P){const n=typeof v==='number'&&isFinite(v)?v:def;return P?clamp(n,P.min,P.max):n}
function vProp(k,v,def){const P=SS.PROPS[k];if(P.t==='sel')return P.o[v]?v:def;if(P.t==='col')return isCol(v)?v.toLowerCase():def;return vNum(v,def,P)}
function vDoc(d){try{
  if(!d||d.schema!==1||!isStr(d.id,40)||!Array.isArray(d.layers)||!Array.isArray(d.nodes))return null;
  const o={schema:1,id:d.id,name:isStr(d.name,40)?d.name:TR('สกิลไร้ชื่อ'),duration:vNum(d.duration,1.2,{min:.3,max:5}),updated:vNum(d.updated,Date.now()),layers:[],tracks:[],nodes:[],edges:[],sounds:vSounds(d.sounds)};
  for(const L of d.layers.slice(0,40)){if(!L||!SS.KINDS[L.kind]||!isStr(L.id,40))continue;const n=newLayer(L.kind);n.id=L.id;n.name=isStr(L.name,30)?L.name:n.name;n.visible=L.visible!==false;n.locked=!!L.locked;const src=L.p||{};for(const k in n.p)n.p[k]=vProp(k,src[k],n.p[k]);if(n.kind==='art')n.art=vArt(L.art)||n.art;o.layers.push(n)}
  const lids=new Set(o.layers.map(l=>l.id));
  for(const tr of(Array.isArray(d.tracks)?d.tracks:[]).slice(0,200)){const P=tr&&SS.PROPS[tr.prop];if(!P||!P.anim||!lids.has(tr.layer)||!Array.isArray(tr.keys)||o.tracks.some(x=>x.layer===tr.layer&&x.prop===tr.prop))continue;
    const keys=tr.keys.filter(k=>k&&typeof k.t==='number'&&isFinite(k.t)).slice(0,100).map(k=>({id:isStr(k.id,40)?k.id:sid('K'),t:clamp(k.t,0,o.duration),v:vNum(k.v,0,P),ease:EASE[k.ease]?k.ease:'linear'})).sort((a,b)=>a.t-b.t);
    if(keys.length)o.tracks.push({id:isStr(tr.id,40)?tr.id:sid('T'),layer:tr.layer,prop:tr.prop,keys})}
  for(const n of d.nodes.slice(0,80)){if(!n||!SS.NODES[n.type]||!isStr(n.id,40))continue;const m=newNode(n.type,vNum(n.x,0,{min:-5000,max:5000}),vNum(n.y,0,{min:-5000,max:5000}));m.id=n.id;const def=SS.NODES[n.type].p;
    for(const k in def){const P=def[k],v=(n.p||{})[k];if(P.t==='sel')m.p[k]=P.o[v]?v:P.d;else if(P.t==='layer'||P.t==='sound')m.p[k]=typeof v==='string'?v.slice(0,40):'';else m.p[k]=vNum(v,P.d,P)}o.nodes.push(m)}
  const nmap=new Map(o.nodes.map(n=>[n.id,n]));
  for(const e of(Array.isArray(d.edges)?d.edges:[]).slice(0,300)){if(!e||!Array.isArray(e.from)||!Array.isArray(e.to))continue;const a=nmap.get(e.from[0]),b=nmap.get(e.to[0]);if(!a||!b||a===b)continue;
    const pa=portDef(a.type,e.from[1],'out'),pb=portDef(b.type,e.to[1],'in');if(!pa||!pb||pa[1]!==pb[1])continue;
    if(pb[1]==='num'&&o.edges.some(x=>x.to[0]===b.id&&x.to[1]===e.to[1]))continue;
    o.edges.push({id:isStr(e.id,40)?e.id:sid('E'),from:[a.id,e.from[1]],to:[b.id,e.to[1]]})}
  return o}catch(err){return null}}

function exportSkillDoc(doc){return JSON.stringify({format:'pixelforge-skill',version:1,doc})}
function importSkillDoc(txt){try{const o=JSON.parse(txt);return o&&o.format==='pixelforge-skill'?vDoc(o.doc):null}catch(e){return null}}

/* ---------- [Runtime] evaluation + drawing (no DOM) ---------- */
function trackVal(tr,t){const k=tr.keys;if(!k.length)return null;if(t<=k[0].t)return k[0].v;const last=k[k.length-1];if(t>=last.t)return last.v;
  for(let i=0;i<k.length-1;i++){const a=k[i],b=k[i+1];if(t>=a.t&&t<=b.t){const f=(t-a.t)/((b.t-a.t)||1);return a.v+(b.v-a.v)*EASE[a.ease](f)}}return last.v}
function layerAt(doc,L,t){const p={...L.p};for(const tr of doc.tracks)if(tr.layer===L.id){const v=trackVal(tr,t);if(v!=null)p[tr.prop]=v}return p}
function shapePath(g,sh,s){g.beginPath();if(sh==='diamond'){g.moveTo(0,-s);g.lineTo(s,0);g.lineTo(0,s);g.lineTo(-s,0);g.closePath()}
  else if(sh==='star'){for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,r=i%2?s*.45:s;g.lineTo(Math.cos(a)*r,Math.sin(a)*r)}g.closePath()}else g.arc(0,0,Math.max(.5,s),0,7)}
function drawFxLayer(g,L,p,t,ax,ay){const age=t-p.start;if(age<0||age>p.dur||p.opacity<=0||p.scale<=0)return;
  const A=clamp(p.opacity,0,1);g.save();g.globalAlpha=A;if(p.blend==='glow')g.globalCompositeOperation='lighter';
  g.translate(Math.round(ax+p.x),Math.round(ay+p.y));if(p.rot)g.rotate(p.rot*Math.PI/180);g.scale(p.scale,p.scale);
  if(L.kind==='burst'){const r=rng(Math.round(p.seed));for(let i=0;i<p.count;i++){const ra=r(),rs=r(),rl=r(),rd=r();const a=(p.angle+(ra-.5)*p.spread)*Math.PI/180,sp=p.speed*(.45+rs*.55),lf=p.life*(.6+rl*.4),pa=age-rd*.06;
    if(pa<0||pa>lf)continue;const f=pa/lf,x=Math.cos(a)*sp*pa,y=Math.sin(a)*sp*pa+.5*p.grav*pa*pa,s=Math.max(1,Math.round(p.size*(1-f*.7)));g.fillStyle=f<.35?p.color2:p.color;g.fillRect(Math.round(x-s/2),Math.round(y-s/2),s,s)}}
  else if(L.kind==='ring'){const R=Math.max(0,p.radius);g.strokeStyle=p.color;g.lineWidth=p.thick;g.beginPath();g.arc(0,0,R,0,7);g.stroke();if(R>p.thick){g.strokeStyle=p.color2;g.lineWidth=1;g.beginPath();g.arc(0,0,R-p.thick,0,7);g.stroke()}}
  else if(L.kind==='orb'){const s=p.size*(1+p.pulse*.25*Math.sin(age*18));g.globalAlpha=A*.35;g.fillStyle=p.color;shapePath(g,p.shape,s*1.7);g.fill();g.globalAlpha=A;shapePath(g,p.shape,s);g.fill();g.fillStyle=p.color2;shapePath(g,p.shape,s*.5);g.fill()}
  else if(L.kind==='art'){drawArt(g,L.art,Math.floor(Math.max(0,age)*p.fps)%L.art.frames.length)}
  else{const n=Math.max(2,Math.round(p.tlen/2));for(let i=0;i<n;i++){const f=i/n,w=Math.max(1,Math.round(p.width*(1-f)));g.globalAlpha=A*(1-f);g.fillStyle=f<.3?p.color2:p.color;g.fillRect(-i*2-2,Math.round(-w/2+Math.sin(age*20+i*.7)*f*2),2,w)}}
  g.restore()}
const SCN={caster:{x:46,y:112},hand:{x:58,y:100},target:{x:196,y:98},dummy:{x:196,y:112}};
function anchorPos(a,prog){if(a==='caster')return SCN.hand;if(a==='target')return SCN.target;return{x:SCN.hand.x+(SCN.target.x-SCN.hand.x)*prog,y:SCN.hand.y+(SCN.target.y-SCN.hand.y)*prog}}
function hitR(L,p){const b=L.kind==='art'?(L.art?L.art.size/2:12):L.kind==='ring'?p.radius+p.thick:L.kind==='trail'?p.tlen*.5:L.kind==='burst'?Math.min(40,p.speed*p.life*.5):p.size*1.6;return Math.max(9,b*p.scale)}
function dataOut(doc,n,depth){if(n.type==='number')return n.p.v;if(n.type==='add')return dataIn(doc,n,'a',depth)+dataIn(doc,n,'b',depth);if(n.type==='mul')return dataIn(doc,n,'a',depth)*dataIn(doc,n,'b',depth);return 0}
function dataIn(doc,n,name,depth=0){const e=doc.edges.find(e=>e.to[0]===n.id&&e.to[1]===name);if(e&&depth<24){const s=doc.nodes.find(x=>x.id===e.from[0]);if(s)return dataOut(doc,s,depth+1)}const v=n.p[name];return typeof v==='number'?v:0}
function nodeTitle(doc,n){return'#'+(doc.nodes.indexOf(n)+1)+' '+SS.NODES[n.type].n}
/* GraphRun executes the node graph: an event queue walks exec edges; number ports are pulled through data edges. */
class GraphRun{
  constructor(doc,host){this.doc=doc;this.h=host;this.t=0;this.q=[];this.steps=0;this.halted='';this.nodes=new Map(doc.nodes.map(n=>[n.id,n]))}
  out(n,port,delay){for(const e of this.doc.edges)if(e.from[0]===n.id&&e.from[1]===port)this.q.push({t:this.t+(delay||0),id:e.to[0],tg:this.cur})}
  start(){const tr=this.doc.nodes.filter(n=>n.type==='onCast');if(!tr.length){this.halted='ไม่มี Node "เมื่อใช้สกิล" กราฟจึงไม่เริ่มทำงาน';return false}
    for(const n of tr){this.h.log(0,n,'เริ่มทำงาน');this.h.pulse(n.id);this.out(n,'out')}return true}
  inp(n,name){return dataIn(this.doc,n,name)}
  exec(n){const h=this.h;if(++this.steps>400){this.halted='หยุดอัตโนมัติ: Node ทำงานเกิน 400 ครั้ง อาจมีการวนไม่รู้จบ';this.q=[];h.log(this.t,null,this.halted,1);return}
    h.pulse(n.id);
    switch(n.type){
      case 'delay':{const s=Math.max(0,this.inp(n,'sec'));h.log(this.t,n,'รอ '+s.toFixed(2)+' วิ');this.out(n,'out',s);break}
      case 'repeat':{const c=clamp(Math.round(n.p.count),1,10);for(let i=0;i<c;i++)this.out(n,'each',i*n.p.gap);this.out(n,'done',c*n.p.gap);h.log(this.t,n,'ทำซ้ำ '+c+' ครั้ง');break}
      case 'projectile':{const sp=clamp(this.inp(n,'speed'),20,600);h.log(this.t,n,'ยิงกระสุน ความเร็ว '+Math.round(sp));h.projectile(sp,tg=>{h.log(this.t,n,'กระสุนชนเป้าหมาย');const c=this.cur;this.cur=tg;this.out(n,'hit');this.cur=c});this.out(n,'out');break}

  for(const n of doc.nodes){const d=SS.NODES[n.type];
    if(n.type==='playfx'&&!doc.layers.some(l=>l.id===n.p.layer))out.push({lv:'err',node:n.id,msg:nodeTitle(doc,n)+' ยังไม่ได้เลือก Layer'});

  for(const e of doc.edges)if(e.from[0]===id){const pd=portDef(n.type,e.from[1],'out');if(pd&&pd[1]==='num')st.push(e.to[0])}}return false}

  if(doc.edges.some(e=>e.from[0]===from[0]&&e.from[1]===from[1]&&e.to[0]===to[0]&&e.to[1]===to[1]))return'มีเส้นนี้อยู่แล้ว';
  if(pa[1]==='num'&&dataReach(doc,b.id,a.id))return'เชื่อมแล้วจะเกิดวงวนของข้อมูล';return''}

  h+='<span class="grow"></span>'+(extra||'');if(!ES.adv)h+=`<button class="btn sm" data-sa="full">${ES.full?'ย่อแผง':'เต็มจอ'}</button><button class="btn sm" data-sa="dock" data-v="${k}" aria-label="ปิดแผง">ปิด</button>`;return h+'</div>'}
function selName(){const s=ES.sel,d=ES.doc;if(!s)return'เอกสาร';if(s.k==='layer')return'Layer '+(curLayer()||{}).name;
  if(s.k==='track'||s.k==='key'){const tr=d.tracks.find(t=>t.id===(s.k==='key'?s.track:s.id));const L=tr&&d.layers.find(l=>l.id===tr.layer);if(!tr||!L)return'';const k=s.k==='key'&&tr.keys.find(x=>x.id===s.id);return(k?'Keyframe '+k.t.toFixed(2)+' วิ · ':'Track · ')+L.name+' › '+SS.PROPS[tr.prop].n}
  if(s.k==='node'){const n=curNode();return n?nodeTitle(d,n):''}if(s.k==='snd'){const S=curSnd();return S?'เสียง '+S.name:''}return'เส้นเชื่อม'}
const selBar=()=>ES.adv?'':`<div class="selbar"><span class="grow">เลือกอยู่: <b>${esc(selName())}</b></span><button class="btn sm" data-sa="dock" data-v="insp">แก้คุณสมบัติ</button></div>`;

/* Re-render a panel without losing its scroll position (sliders fire re-renders while the user is scrolled down) */
function setPane(el,html,keep){const sc=keep!==false?[...el.querySelectorAll('.pane-b,.tl-bar,.g-tools')].map(x=>[x.scrollTop,x.scrollLeft]):[];el.innerHTML=html;if(sc.length)[...el.querySelectorAll('.pane-b,.tl-bar,.g-tools')].forEach((x,i)=>{if(sc[i]){x.scrollTop=sc[i][0];x.scrollLeft=sc[i][1]}})}
let inspKey='';
function renderLayersPane(){const d=ES.doc,sl=ES.sel&&ES.sel.k==='layer'?ES.sel.id:null,n=d.layers.length;
  setPane($('#paneLayers'),paneHead('layers','Layer')+`<div class="pane-b"><div class="addrow">${Object.entries(SS.KINDS).map(([k,v])=>`<button class="chip" data-sa="addLayer" data-v="${k}"><i style="background:${v.c}"></i>+ ${v.n}</button>`).join('')}</div>
  <ul class="ly-list">${d.layers.map((L,i)=>`<li class="ly${sl===L.id?' sel':''}${L.visible?'':' off'}"><button class="ly-main" data-sa="selLayer" data-id="${L.id}"><i style="background:${L.p.color}"></i><span><b>${esc(L.name)}</b><small>${SS.KINDS[L.kind].n} · ยึดกับ${SS.PROPS.anchor.o[L.p.anchor]}${L.locked?' · ล็อก':''}</small></span></button>
  <button class="ib" data-sa="lyVis" data-id="${L.id}" aria-pressed="${!L.visible}" aria-label="${L.visible?'ซ่อน':'แสดง'} ${esc(L.name)}">${L.visible?ICO.eye:ICO.eyeOff}</button><button class="ib" data-sa="lyLock" data-id="${L.id}" aria-pressed="${L.locked}" aria-label="${L.locked?'ปลดล็อก':'ล็อก'} ${esc(L.name)}">${L.locked?ICO.lock:ICO.unlock}</button>
  <button class="ib" data-sa="lyMove" data-id="${L.id}" data-d="-1"${i===0?' disabled':''} aria-label="เลื่อนขึ้น">▲</button><button class="ib" data-sa="lyMove" data-id="${L.id}" data-d="1"${i===n-1?' disabled':''} aria-label="เลื่อนลง">▼</button></li>`).join('')||'<li class="tl-empty">ยังไม่มี Layer กดปุ่มด้านบนเพื่อเพิ่ม</li>'}</ul>
  <p class="tl-empty">Layer บนสุดวาดทับ Layer ด้านล่าง · Layer ที่ล็อกจะแก้ไขและเลือกจาก Viewport ไม่ได้</p></div>`+selBar())}

function renderTimePane(){const d=ES.doc,D_=d.duration,s=ES.sel||{},selTr=s.k==='track'?s.id:s.k==='key'?s.track:null;let ticks='';
  for(let i=0;i<=Math.round(D_*10);i++){const t=i/10,big=i%5===0;ticks+=`<span class="tk${big?' big':''}" style="left:${t/D_*100}%">${big?`<b>${t.toFixed(1)}</b>`:''}</span>`}
  let rows='';for(const L of d.layers){const w0=Math.min(L.p.start,D_),w1=Math.min(L.p.start+L.p.dur,D_);
    rows+=`<div class="tl-r grp${s.k==='layer'&&s.id===L.id?' sel':''}"><button class="tl-lab" data-sa="selLayer" data-id="${L.id}">${esc(L.name)}</button><div class="tl-lane"><div class="tl-in"><span class="tl-win" style="left:${w0/D_*100}%;width:${(w1-w0)/D_*100}%;--c:${L.p.color}"></span></div></div></div>`;
    for(const tr of d.tracks.filter(t=>t.layer===L.id))rows+=`<div class="tl-r${selTr===tr.id?' sel':''}"><button class="tl-lab" data-sa="selTrack" data-id="${tr.id}">· ${SS.PROPS[tr.prop].n}</button><div class="tl-lane"><div class="tl-in">${tr.keys.map(k=>`<button class="kf${k.ease==='hold'?' hold':''}${s.k==='key'&&s.id===k.id?' sel':''}" style="left:${k.t/D_*100}%" data-sa="selKey" data-tr="${tr.id}" data-id="${k.id}" aria-label="Keyframe ${SS.PROPS[tr.prop].n} ที่ ${k.t.toFixed(2)} วินาที"></button>`).join('')}</div></div></div>`}
  setPane($('#paneTime'),paneHead('time','Timeline')+`<div class="tl-bar"><button class="btn sm" data-sa="tlPlay" id="tlPlayBtn">${ES.playing?'หยุด':'เล่น'}</button><button class="btn sm" data-sa="tlStart">ไปต้น</button><button class="btn sm${ES.loop?' pri':''}" data-sa="tlLoop" aria-pressed="${ES.loop}">เล่นวน</button><span class="tl-time" id="tlTime"></span><button class="btn sm" data-sa="kfAdd">◆ เพิ่ม Keyframe</button><button class="btn sm" data-sa="kfDel"${s.k==='key'?'':' disabled'}>ลบ Keyframe</button></div>
  <div class="pane-b" style="padding:0 0 8px"><div class="tl"><div class="tl-r tl-ruler"><span class="tl-lab">เวลา (วิ)</span><div class="tl-lane" id="tlRuler"><div class="tl-in">${ticks}</div></div></div>${rows||'<p class="tl-empty" style="padding:10px 12px">ยังไม่มี Layer</p>'}<div class="tl-ph" id="tlPh"></div></div>
  ${d.tracks.length?'':'<p class="tl-empty" style="padding:4px 12px">ยังไม่มี Keyframe: เลือก Layer แล้วกดปุ่ม ◆ ข้างค่าที่ต้องการในแผงคุณสมบัติ</p>'}<p class="tl-empty" style="padding:0 12px">แถบสีคือช่วงเวลาที่ Layer แสดง ลากบนแถบเวลาเพื่อเลื่อน Playhead</p></div>`+selBar());stTick()}

const NW=156,NHH=28,NR=26;
const nodeH=n=>{const d=SS.NODES[n.type];return NHH+Math.max(d.ins.length,d.outs.length,1)*NR+22};
function portXY(n,name,dir){const d=SS.NODES[n.type],arr=dir==='in'?d.ins:d.outs,i=arr.findIndex(p=>p[0]===name);return{x:n.x+(dir==='in'?0:NW),y:n.y+NHH+i*NR+NR/2}}
function nodeSummary(doc,n){const v=k=>fmtN(dataIn(doc,n,k));switch(n.type){case 'delay':return'รอ '+v('sec')+' วิ';case 'repeat':return n.p.count+' ครั้ง ห่าง '+n.p.gap+' วิ';case 'projectile':return'ความเร็ว '+v('speed');
  case 'playfx':{const L=doc.layers.find(l=>l.id===n.p.layer);return(L?L.name:TR('ยังไม่เลือก Layer'))+' · '+SS.NODES.playfx.p.at.o[n.p.at]}case 'damage':return'ความเสียหาย '+v('amount');
  case 'status':return SS.NODES.status.p.kind.o[n.p.kind]+' '+n.p.sec+' วิ';case 'sound':{const S=(doc.sounds||[]).find(x=>x.id===n.p.snd);return S?S.name+(n.p.pitch!==1?' · ×'+fmtN(n.p.pitch):''):'ยังไม่เลือกเสียง'}case 'number':return'ค่า '+n.p.v;case 'add':case 'mul':return'ผลลัพธ์ '+fmtN(dataOut(doc,n,0));default:return SS.NODES[n.type].d}}
function edgesSVG(){const d=ES.doc;return d.edges.map(e=>{const a=d.nodes.find(n=>n.id===e.from[0]),b=d.nodes.find(n=>n.id===e.to[0]);if(!a||!b)return'';const p1=portXY(a,e.from[1],'out'),p2=portXY(b,e.to[1],'in'),ty=portDef(a.type,e.from[1],'out')[1],dx=Math.max(40,Math.abs(p2.x-p1.x)*.5);
  const dp=`M${p1.x} ${p1.y} C${p1.x+dx} ${p1.y},${p2.x-dx} ${p2.y},${p2.x} ${p2.y}`;return`<path d="${dp}" class="ge ${ty}${ES.sel&&ES.sel.k==='edge'&&ES.sel.id===e.id?' sel':''}"/><path d="${dp}" class="ge-hit" data-edge="${e.id}"/>`}).join('')}
function renderGraphPane(){const d=ES.doc,g=ES.gv,pend=ES.pending,bad=new Set(ES.issues.filter(i=>i.lv==='err'&&i.node).map(i=>i.node));
  const linked=(id,name,dir)=>d.edges.some(e=>dir==='in'?e.to[0]===id&&e.to[1]===name:e.from[0]===id&&e.from[1]===name);
  const nodes=d.nodes.map(n=>{const def=SS.NODES[n.type],rows=Math.max(def.ins.length,def.outs.length,1);let r='';
    for(let i=0;i<rows;i++){const a=def.ins[i],b=def.outs[i];
      const okIn=a&&pend&&pend.node!==n.id&&a[1]===pend.type;
      r+=`<div class="gn-r">${a?`<span class="pt in ${a[1]}${linked(n.id,a[0],'in')?' on':''}${okIn?' ok':''}" data-port="${n.id}|${a[0]}|in">${SS.PORTN[a[0]]}</span>`:'<span class="pt" style="visibility:hidden"></span>'}${b?`<span class="pt out ${b[1]}${linked(n.id,b[0],'out')?' on':''}${pend&&pend.node===n.id&&pend.port===b[0]?' pend':''}" data-port="${n.id}|${b[0]}|out">${SS.PORTN[b[0]]}</span>`:''}</div>`}
    return`<div class="gn${ES.sel&&ES.sel.k==='node'&&ES.sel.id===n.id?' sel':''}${bad.has(n.id)?' bad':''}${ES.run&&ES.run.S.pulse[n.id]?' live':''}" data-node="${n.id}" style="left:${n.x}px;top:${n.y}px"><div class="gn-h" style="--cc:${SS.CATS[def.cat].c}">${def.n}<small>#${d.nodes.indexOf(n)+1}</small></div>${r}<div class="gn-s">${esc(nodeSummary(d,n))}</div></div>`}).join('');
  const errs=ES.issues.filter(i=>i.lv==='err'),warns=ES.issues.filter(i=>i.lv==='warn');
  let stat,cls;if(pend){stat='เลือกพอร์ตขาออก "'+SS.PORTN[pend.port]+'" แล้ว แตะพอร์ตขาเข้าที่เรืองแสงเพื่อเชื่อม หรือแตะพื้นที่ว่างเพื่อยกเลิก';cls='pend'}
  else if(errs.length){stat='ข้อผิดพลาด '+errs.length+': '+errs[0].msg;cls='err'}else if(warns.length){stat='คำเตือน '+warns.length+': '+warns[0].msg;cls='warn'}else{stat='กราฟพร้อมทำงาน · ลากจากพอร์ตไปปล่อยบนพอร์ตที่เรืองแสงเพื่อเชื่อม · กดหัว Node ค้างเพื่อย้าย';cls='ok'}
  $('#paneGraph').innerHTML=paneHead('graph','Node Graph')+`<div class="g-tools"><button class="btn sm" data-sa="menu" data-v="logic">+ เพิ่ม Node</button><button class="btn sm" data-sa="gLayout">จัดเรียง</button><button class="btn sm" data-sa="gFit">พอดีจอ</button><button class="btn sm" data-sa="gZoom" data-v="-1" aria-label="ซูมออก">−</button><button class="btn sm" data-sa="gZoom" data-v="1" aria-label="ซูมเข้า">+</button><button class="btn sm${ES.arrange?' pri':''}" data-sa="gArrange" aria-pressed="${ES.arrange}">ลาก Node: ${ES.arrange?'เปิด':'ปิด'}</button></div>
  <div class="g-stat ${cls}">${esc(stat)}</div><div class="gr-wrap" id="grWrap"><div class="gr-world" id="grWorld" style="transform:translate(${g.x}px,${g.y}px) scale(${g.z})"><svg id="grSvg">${edgesSVG()}</svg>${nodes}</div></div>
  <div class="g-log" id="gLog"></div>`+selBar();ES.logShown=-1;renderLog()}
function renderLog(){const el=$('#gLog');if(!el)return;ES.logShown=ES.log.length;const L=ES.log;
  if(!L.length){el.innerHTML='<span>บันทึกการทำงาน: กดพรีวิวเพื่อรันกราฟจริงแล้วดูลำดับเหตุการณ์ที่นี่</span>';return}
  const show=ES.logOpen?L:L.slice(-1);el.innerHTML=show.map(x=>`<div class="lg${x.bad?' bad':''}"><i>${x.t.toFixed(2)}</i><span>${esc((x.n?x.n+' · ':'')+x.msg)}</span></div>`).join('')+(L.length>1?`<button data-sa="logToggle">${ES.logOpen?'ย่อบันทึก':'ดูบันทึกทั้งหมด ('+L.length+')'}</button>`:'');if(ES.logOpen)el.scrollTop=el.scrollHeight}
function fitGraph(){const w=$('#grWrap');if(!w||!w.clientWidth||!ES.doc.nodes.length)return;let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;for(const n of ES.doc.nodes){x0=Math.min(x0,n.x);y0=Math.min(y0,n.y);x1=Math.max(x1,n.x+NW);y1=Math.max(y1,n.y+nodeH(n))}
  let z=clamp(Math.min((w.clientWidth-40)/(x1-x0),(w.clientHeight-30)/(y1-y0)),.35,1.1);if(z<.6){z=innerWidth<760?.95:.75;ES.gv={z,x:16-x0*z,y:12-y0*z}}else ES.gv={z,x:(w.clientWidth-(x1-x0)*z)/2-x0*z,y:Math.max(10,(w.clientHeight-(y1-y0)*z)/2)-y0*z};ES.gvFit=true;const wd=$('#grWorld');if(wd)wd.style.transform=`translate(${ES.gv.x}px,${ES.gv.y}px) scale(${z})`}

function numField(si,k,P,val,extra,dis,tag){const v=fmtN(+val),d=dis?' disabled':'';return`<div class="ip${tag?' anim':''}"><label for="si_${si}_${k}">${P.n}${tag?` <em>${tag}</em>`:''}</label><div class="ipr"><input type="range" min="${P.min}" max="${P.max}" step="${P.step}" value="${v}" data-si="${si}" data-k="${k}" aria-label="${P.n}"${d}><input type="number" id="si_${si}_${k}" min="${P.min}" max="${P.max}" step="${P.step}" value="${v}" data-si="${si}" data-k="${k}"${d}>${extra||''}</div></div>`}
function storeMsg(){return'เอกสารเก็บในเบราว์เซอร์นี้เท่านั้น ยังไม่มีบัญชี การบันทึกออนไลน์ หรือการซิงก์ข้ามอุปกรณ์'}
function renderInspPane(){const d=ES.doc,s=ES.sel;let b='';
  if(!s){const kc=d.tracks.reduce((a,t)=>a+t.keys.length,0);b=`<h3>เอกสารสกิล</h3><label class="fld"><span>ชื่อสกิล</span><input type="text" data-si="dname" maxlength="40" value="${esc(d.name)}"></label>${numField('ddur','duration',{n:'ความยาว Timeline (วิ)',min:.3,max:5,step:.1},d.duration)}
    <div class="kv"><div>Layer<b>${d.layers.length}</b></div><div>Keyframe<b>${kc}</b></div><div>Node<b>${d.nodes.length}</b></div><div>เส้นเชื่อม<b>${d.edges.length}</b></div></div>
    ${ES.lastRun?`<p class="note">พรีวิวล่าสุด: หุ่นฝึกเหลือ ${Math.ceil(ES.lastRun.hp)}/${ES.lastRun.max} (ใช้เวลา ${ES.lastRun.t.toFixed(2)} วิ)</p>`:''}<div class="grp"><div class="gl">ใช้ในการต่อสู้จริง</div>${(()=>{const ss=studioStats(vDoc(clone(d))||d),sk=D.skills.find(x=>x.studio&&x.studio.src===d.id);return`<p class="note">ประมาณการในเกม: ความเสียหายต่อครั้ง ${ss.dmg} · พลังงาน ${ss.mp} · เวลารอ ${ss.cd} วิ${sk?' · ส่งเข้าเกมแล้วในชื่อ "'+esc(sk.name)+'"':''}</p>`})()}<button class="btn pri" data-sa="toGame">${D.skills.some(x=>x.studio&&x.studio.src===d.id)?'อัปเดตสกิลในเกม':'ส่งเข้าเกมเป็นสกิล'}</button></div><p class="note">${storeMsg()}</p><p class="note">แตะ Layer, Keyframe หรือ Node เพื่อแก้ค่าของสิ่งนั้น</p>`}
  else if(s.k==='layer'){const L=curLayer(),p=layerAt(d,L,ES.time),lk=L.locked;
    const row=k=>{const P=SS.PROPS[k],tr=d.tracks.find(t=>t.layer===L.id&&t.prop===k),v=p[k];
      if(P.t==='sel')return`<label class="fld"><span>${P.n}</span><select data-si="lp" data-k="${k}"${lk?' disabled':''}>${Object.entries(P.o).map(([o,n])=>opt(o,n,v===o)).join('')}</select></label>`;
      if(P.t==='col')return`<div class="ip"><label>${P.n}</label><div class="ipc"><input type="color" data-si="lp" data-k="${k}" value="${v}"${lk?' disabled':''} aria-label="${P.n}"><span class="note">${v}</span></div></div>`;
      const on=tr&&tr.keys.some(x=>Math.abs(x.t-ES.time)<.015);
      return numField('lp',k,P,v,P.anim?`<button class="kfb${on?' on':''}" data-sa="kf" data-k="${k}"${lk?' disabled':''} aria-label="ใส่ Keyframe ${P.n} ที่เวลาปัจจุบัน">◆</button>`:'',lk,tr?'มี Keyframe':'')};
    b=`<h3>${esc(L.name)}</h3><p class="note">${SS.KINDS[L.kind].n} · ค่าที่แสดงคือค่า ณ ${ES.time.toFixed(2)} วิ</p><label class="fld"><span>ชื่อ Layer</span><input type="text" data-si="lname" maxlength="30" value="${esc(L.name)}"${lk?' disabled':''}></label>
    <div class="btns"><button class="btn sm" data-sa="lyVis" data-id="${L.id}">${L.visible?'ซ่อน':'แสดง'}</button><button class="btn sm" data-sa="lyLock" data-id="${L.id}">${lk?'ปลดล็อก':'ล็อก'}</button><button class="btn sm" data-sa="lyDup">ทำสำเนา</button><button class="btn sm danger" data-sa="del"${lk?' disabled':''}>ลบ</button></div>
    ${L.kind==='art'?`<div class="grp"><div class="gl">ภาพวาด · ${L.art.frames.length} เฟรม · ${L.art.shapes.length} รูปทรง · ${L.art.size}×${L.art.size}</div><button class="btn pri big" data-sa="artOpen"${lk?' disabled':''}>เปิดหน้าวาด</button></div>`:''}${lk?'<p class="warnp">Layer นี้ถูกล็อก กดปลดล็อกเพื่อแก้ไข</p>':''}<div class="grp"><div class="gl">ตำแหน่งและการแสดงผล</div>${SS.COMMON.map(row).join('')}</div><div class="grp"><div class="gl">เฉพาะ${SS.KINDS[L.kind].n}</div>${SS.KP[L.kind].map(row).join('')}</div>
    <p class="note">ปุ่ม ◆ ใส่ Keyframe ที่ตำแหน่ง Playhead เมื่อค่าใดมี Keyframe แล้ว การแก้ค่าจะแก้ Keyframe ที่เวลานั้นแทน</p>`}
  else if(s.k==='track'||s.k==='key'){const tr=d.tracks.find(t=>t.id===(s.k==='key'?s.track:s.id)),L=d.layers.find(l=>l.id===tr.layer),P=SS.PROPS[tr.prop],lk=L.locked;
    const kl=`<div class="klist">${tr.keys.map(k=>`<button class="chip${s.k==='key'&&s.id===k.id?' on':''}" data-sa="selKey" data-tr="${tr.id}" data-id="${k.id}">${k.t.toFixed(2)} วิ = ${fmtN(k.v)}</button>`).join('')}</div>`;
    if(s.k==='key'){const k=tr.keys.find(x=>x.id===s.id);b=`<h3>Keyframe</h3><p class="note">${esc(L.name)} › ${P.n}</p>${lk?'<p class="warnp">Layer นี้ถูกล็อก</p>':''}${numField('kt','t',{n:'เวลา (วิ)',min:0,max:d.duration,step:.01},k.t,'',lk)}${numField('kv','v',P,k.v,'',lk)}

/* =====================================================================
   STUDIO → GAME BRIDGE
   A Studio document becomes a game skill by snapshot: skill.studio = {src, doc, rev}.
   In battle the same GraphRun runs against the real combat world:
   projectiles are real projectiles, "damage" hurts the enemy that was hit
   (or the nearest enemy in front), "status" applies burn / slow / stun.
   Mana and cooldown come from the graph's estimated damage, so stronger
   graphs cost more. Damage per hit is capped at 150.
   ===================================================================== */
function studioNominal(doc){const st=doc.nodes.find(n=>n.type==='status');return{type:doc.nodes.some(n=>n.type==='projectile')?'bolt':'burst',elem:st?{fire:'fire',ice:'ice',shock:'shock'}[st.p.kind]:'energy',beh:'pierce'}}
const STUDIO_ST=new WeakMap();
function studioStats(doc){const c=STUDIO_ST.get(doc);if(c)return c;const times={};let guard=0;
  const walk=(id,m,depth)=>{if(depth>24||guard++>3000)return;times[id]=(times[id]||0)+m;const n=doc.nodes.find(x=>x.id===id);if(!n)return;
    for(const e of doc.edges)if(e.from[0]===id){const pd=portDef(n.type,e.from[1],'out');if(!pd||pd[1]!=='exec')continue;const k=n.type==='repeat'&&e.from[1]==='each'?clamp(Math.round(n.p.count),1,10):1;walk(e.to[0],Math.min(60,m*k),depth+1)}};
  doc.nodes.filter(n=>n.type==='onCast').forEach(n=>walk(n.id,1,0));
  let dmg=0,extra=0;for(const n of doc.nodes){const t=times[n.id]||0;if(!t)continue;if(n.type==='damage')dmg+=t*Math.min(150,Math.max(0,Math.round(dataIn(doc,n,'amount'))));if(n.type==='status')extra+=t*n.p.sec*(n.p.kind==='fire'?4:3)}
  const proj=doc.nodes.find(n=>n.type==='projectile'&&times[n.id]),sp=proj?clamp(dataIn(doc,proj,'speed'),20,600):0,range=proj?Math.round(Math.min(320,sp*1.6)):70,score=dmg+extra;
  const r={dmg:Math.round(dmg),score:Math.round(score),cd:Math.round(clamp(.8+score/30,.8,10)*10)/10,mp:Math.round(clamp(8+score*.5,8,90)),range,rad:0,reach:range,pts:0,proj:!!proj,hasDmg:doc.nodes.some(n=>n.type==='damage'&&times[n.id])};
  STUDIO_ST.set(doc,r);return r}
function vStudioSkill(s){if(!isStr(s.id,60)||!s.studio)return null;const doc=vDoc(s.studio.doc);if(!doc)return null;
  return{id:s.id,name:isStr(s.name,30)?s.name:doc.name.slice(0,30),...studioNominal(doc),pow:1,rng:1,cd:1,studio:{src:isStr(s.studio.src,40)?s.studio.src:'',doc,rev:typeof s.studio.rev==='number'?s.studio.rev:0}}}
const skillTag=s=>s.studio?'จาก Skill Studio':TYPES[s.type].n+' · '+ELEMS[s.elem].n;
/* run a Studio skill inside the battle world */
function runStudioSkill(w,p,s,st){const doc=s.studio.doc,face=p.face,R={run:null,live:0};
  const foeNear=()=>aimTarget(w,p,st.reach+12)||(()=>{let b=null,bd=st.reach+40;for(const e of w.ents){if(e.dead||e.team===p.team)continue;const d=Math.abs(e.x-p.x);if(d<bd){bd=d;b=e}}return b})();
  const tgt=()=>{const c=R.run.cur;return c&&!c.dead?c:foeNear()};
  const host={log(){},pulse(){},sound(sn,v,pt,r){const t=tgt();sndEv(w,'doc',t?t.x:p.x,{snd:sn,vol:v,pitch:pt,rnd:r})},
    fx(L,at){if(w.headless)return;const t=at==='caster'?p:tgt();w.sfx.push({L,doc,t0:w.t,at,ent:t||null,x:t?t.x:p.x+face*48,y:t?t.y-t.h/2:p.y-10,dir:at==='caster'?face:1})},
    projectile(sp,hit){const range=Math.min(320,sp*1.6);const pr=shoot(w,p,{spd:sp,life:range/sp,dmg:0,r:4,team:p.team,kind:'studio',ang:aimAng(w,p,range),c:ELEMS[s.elem].c,c2:'#ffffff'});
      pr.sv={doc,t0:w.t};R.live++;pr.hitFn=e=>hit(e);pr.onDie=()=>{R.live--}},
    damage(a){const t=tgt();if(t)hurt(w,t,Math.min(150,Math.max(0,a)),{team:p.team,sk:s.id,dir:Math.sign(t.x-p.x)||face,kb:70})},
    status(k,sec){const t=tgt();if(!t||t.dead)return;if(k==='fire'){t.burnTeam=p.team;t.burn=sec;t.burnD=3;t.burnSk=s.id;t.burnT=.5}else if(k==='ice')t.slow=sec;else if(!t.boss)t.stun=Math.min(sec,1.5);
      if(!w.headless)w.nums.push({x:t.x,y:t.y-t.h-8,v:SS.NODES.status.p.kind.o[k],t:.8,c:ELEMS[{fire:'fire',ice:'ice',shock:'shock'}[k]].c2,txt:1})}};
  if(!doc.nodes.some(n=>n.type==='sound'))sndEv(w,'studio',p.x);
  R.run=new GraphRun(doc,host);if(R.run.start())w.sruns.push(R)}
function studioSkillStep(w,dt){for(const R of w.sruns)R.run.update(dt);w.sruns=w.sruns.filter(R=>!R.run.idle||R.live>0);
  if(!w.headless)w.sfx=w.sfx.filter(f=>w.t-f.t0<=f.L.p.start+f.L.p.dur)}
function drawStudioFx(g,w){for(const f of w.sfx){if(!f.L.visible)continue;const lt=w.t-f.t0;let x=f.x,y=f.y;
    if(f.ent&&!f.ent.dead){if(f.at==='caster'){x=f.ent.x+f.dir*8;y=f.ent.y-10}else{x=f.ent.x;y=f.ent.y-f.ent.h/2}}
    g.save();g.translate(Math.round(x),Math.round(y));if(f.dir<0)g.scale(-1,1);drawFxLayer(g,f.L,layerAt(f.doc,f.L,lt),lt,0,0);g.restore()}
  g.globalCompositeOperation='source-over';g.globalAlpha=1}
function drawStudioProj(g,w,pr){const doc=pr.sv.doc,lt=(w.t-pr.sv.t0)%doc.duration;let any=false;g.save();g.translate(Math.round(pr.x),Math.round(pr.y));if(pr.vx<0)g.scale(-1,1);
  for(let i=doc.layers.length-1;i>=0;i--){const L=doc.layers[i];if(!L.visible||L.p.anchor!=='projectile')continue;any=true;drawFxLayer(g,L,layerAt(doc,L,lt),lt,0,0)}
  g.restore();g.globalCompositeOperation='source-over';g.globalAlpha=1;if(!any){g.fillStyle=pr.c;pxCircle(g,Math.round(pr.x),Math.round(pr.y),3);g.fillStyle='#fff';pxCircle(g,Math.round(pr.x),Math.round(pr.y),1)}}

/* =====================================================================
   TEMPLATES + SHARE CODES
   Share code = "PF1z:" + base64url(deflate(JSON)) (or "PF1:" without compression).
   Payload {f:'pfs', v:1, k:'skill'|'studio'|'char'|'arena'|'ai', d, deps?}
   Every import (paste or template) goes through validateShare() → acceptShare(),
   which re-validates with the game's own validators and gives fresh ids.
   Nothing here needs a server; codes travel by copy and paste.
   ===================================================================== */
const SHK={skill:'สกิล',studio:'เอกสาร Studio',char:'ตัวละคร',arena:'สนาม',ai:'การตั้งค่า AI'};
const b64u=u8=>{let s='';for(let i=0;i<u8.length;i+=0x8000)s+=String.fromCharCode.apply(null,u8.subarray(i,i+0x8000));return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')};
const unb64u=str=>{str=str.replace(/-/g,'+').replace(/_/g,'/');while(str.length%4)str+='=';const bin=atob(str),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return u};
async function packShare(obj){const bytes=new TextEncoder().encode(JSON.stringify(obj));
  if(window.CompressionStream){try{const buf=await new Response(new Blob([bytes]).stream().pipeThrough(new CompressionStream('deflate-raw'))).arrayBuffer();return'PF1z:'+b64u(new Uint8Array(buf))}catch(e){}}return'PF1:'+b64u(bytes)}
async function unpackShare(code){code=(code||'').replace(/\s+/g,'');if(code.length>3e6)throw new Error('รหัสยาวเกินไป');const m=code.match(/^PF1(z?):([A-Za-z0-9_-]+)$/);if(!m)throw new Error('รูปแบบรหัสไม่ถูกต้อง ต้องขึ้นต้นด้วย PF1');
  let u;try{u=unb64u(m[2])}catch(e){throw new Error('รหัสไม่ครบหรือมีตัวอักษรแปลกปน')}
  if(m[1]){if(!window.DecompressionStream)throw new Error('เบราว์เซอร์นี้เปิดรหัสแบบบีบอัดไม่ได้ ลองเบราว์เซอร์รุ่นใหม่');try{u=new Uint8Array(await new Response(new Blob([u]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer())}catch(e){throw new Error('รหัสไม่ครบ คัดลอกมาไม่หมด')}}
  try{return JSON.parse(new TextDecoder().decode(u))}catch(e){throw new Error('อ่านข้อมูลในรหัสไม่ได้')}}
function validateShare(o){if(!o||o.f!=='pfs'||o.v!==1||!SHK[o.k]||!o.d||typeof o.d!=='object')return null;const d={...o.d,id:isStr(o.d.id,60)?o.d.id:'x_'+o.k};let v=null,deps=[];

/* =====================================================================
   CLOUD: accounts, cloud save and community gallery
   Two interchangeable backends behind one gallery UI:
   - Supabase (when PF_SUPABASE / server settings hold a project URL + anon key):
     email+password or guest (anonymous) sign-in, cloud save in table `saves`,
     gallery in `gallery_items` (+ likes/uses). Schema + RLS: supabase.sql.
   - Claude artifact db (when opened from the Claude link): shelf docs per person.
   Everything read from the server is untrusted: rows are sanitized for display
   and payloads pass validateShare() before anything is imported.
   ===================================================================== */
const SUPA_CDN='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.10/dist/umd/supabase.js';
const CFG_KEY='pixelforge.server.v1',CS_KEY='pixelforge.cloud.v1';
const CLOUD={st:'off',sb:null,user:null,name:'',admin:false,sync:'idle',syncAt:0,err:'',timer:0,busy:false,asking:false};
function srvCfg(){let o=null;try{if(!(PF_SUPABASE&&PF_SUPABASE.url))o=JSON.parse(localStorage.getItem(CFG_KEY)||'null')}catch(e){}
  const base=(typeof PF_SUPABASE==='object'&&PF_SUPABASE)||{};const url=(o&&o.url)||base.url||'',key=(o&&o.anonKey)||base.anonKey||'';
  return{url:String(url).trim().replace(/\/+$/,''),anonKey:String(key).trim(),local:!!(o&&o.url)}}
const supaOn=()=>{const c=srvCfg();return(/^https:\/\/[^\s/]+$/.test(c.url)||/^http:\/\/(localhost|127\.0\.0\.1)(:\d+)?$/.test(c.url))&&c.anonKey.length>=20};
function loadSupaLib(){if(window.supabase&&window.supabase.createClient)return Promise.resolve(window.supabase);
  return new Promise((ok,no)=>{const s=document.createElement('script');s.src=SUPA_CDN;s.async=true;s.onload=()=>window.supabase?ok(window.supabase):no(new Error('lib'));s.onerror=()=>no(new Error('lib'));document.head.appendChild(s)})}
const authTH=e=>{const m=String(e&&(e.message||e.msg||e.error_description)||e||'');
  if(/Invalid login credentials/i.test(m))return'อีเมลหรือรหัสผ่านไม่ถูกต้อง';if(/already registered|already been registered|already exists/i.test(m))return'อีเมลนี้สมัครไว้แล้ว ลองกดเข้าสู่ระบบ';
  if(/Anonymous sign-ins are disabled/i.test(m))return'เซิร์ฟเวอร์ยังไม่เปิดโหมดผู้เยี่ยมชม (เจ้าของเกมต้องเปิด Anonymous sign-ins ใน Supabase)';
  if(/Email not confirmed/i.test(m))return'ยังไม่ได้ยืนยันอีเมล เปิดลิงก์ในอีเมลก่อน แล้วกลับมาเข้าสู่ระบบ';if(/at least 6|Password should/i.test(m))return'รหัสผ่านต้องยาวอย่างน้อย 6 ตัวอักษร';
  if(/valid email|invalid format|Unable to validate email/i.test(m))return'รูปแบบอีเมลไม่ถูกต้อง';if(/Signups not allowed|signups are disabled/i.test(m))return'เซิร์ฟเวอร์ปิดการสมัครสมาชิกอยู่';
  if(/rate limit|too many/i.test(m))return'ลองถี่เกินไป รอสักครู่แล้วลองใหม่';if(/Invalid API key|No API key/i.test(m))return'anon key ไม่ถูกต้อง ตรวจการตั้งค่าเซิร์ฟเวอร์';
  if(/relation .* does not exist|Could not find the table/i.test(m))return'ฐานข้อมูลยังไม่มีตารางของเกม (ต้องรันไฟล์ supabase.sql ก่อน)';
  if(/fetch|network|Failed to|load failed/i.test(m))return'เชื่อมต่อเซิร์ฟเวอร์ไม่ได้ ตรวจอินเทอร์เน็ตหรือการตั้งค่าเซิร์ฟเวอร์';return'ทำรายการไม่สำเร็จ: '+m.slice(0,80)};
async function cloudInit(){if(!supaOn()){CLOUD.st='off';return}if(CLOUD.st==='loading'||CLOUD.st==='ready')return;CLOUD.st='loading';CLOUD.err='';cloudRefreshUI();
  try{const lib=await loadSupaLib();const c=srvCfg();CLOUD.sb=lib.createClient(c.url,c.anonKey,{auth:{persistSession:true,autoRefreshToken:true,storageKey:'pixelforge.auth',detectSessionInUrl:false}});
    const{data}=await CLOUD.sb.auth.getSession();CLOUD.st='ready';await cloudSetUser(data&&data.session?data.session.user:null);
    CLOUD.sb.auth.onAuthStateChange((ev,ses)=>{const u=ses?ses.user:null;if((u&&u.id)!==(CLOUD.user&&CLOUD.user.id))setTimeout(()=>cloudSetUser(u),0)})}
  catch(e){CLOUD.st='err';CLOUD.err=e&&e.message==='lib'?'โหลดระบบเชื่อมต่อไม่ได้ (ตรวจอินเทอร์เน็ต)':authTH(e)}
  if(GAL.backend==='supa'&&GAL.st==='loading'){GAL.st=CLOUD.st==='ready'?'ready':'err';if(GAL.st==='ready')galLoad()}cloudRefreshUI()}
async function cloudSetUser(u){CLOUD.user=u;CLOUD.name='';CLOUD.admin=false;
  if(u){try{const sb=CLOUD.sb;const[p,a]=await Promise.all([sb.from('profiles').select('name').eq('id',u.id).maybeSingle(),sb.from('admins').select('user_id').eq('user_id',u.id).maybeSingle()]);
      CLOUD.name=p.data&&typeof p.data.name==='string'?p.data.name.slice(0,24):'';CLOUD.admin=!!(a.data)}catch(e){}
    cloudSync('login')}else{CLOUD.sync='idle'}
  if(GAL.backend==='supa'){GAL.me=u?u.id:null;GAL.owner=CLOUD.admin;GAL.canWrite=!!u;if(!u)GAL.mine=false;if(GAL.st==='ready')galLoad()}cloudRefreshUI()}
function cloudRefreshUI(){if(ED.scr!=='lib')return;if(ED.libTab==='set'){const a=document.activeElement;if(a&&/^(cEmail|cPass|cName|cfgUrl|cfgKey)$/.test(a.id)){const s=$('#cloudSyncTxt');if(s)s.textContent=syncText();return}renderLib()}
  else if(ED.libTab==='gal'&&!$('#galList'))renderLib()}
