function hstr(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return(h>>>0).toString(36)+':'+s.length}
function csRead(){try{const o=JSON.parse(localStorage.getItem(CS_KEY)||'null');if(o&&typeof o==='object')return o}catch(e){}return{}}
function csWrite(o){try{localStorage.setItem(CS_KEY,JSON.stringify(o))}catch(e){}}
function localPayload(){return{v:1,game:clone(D),studio:StudioStore._read(),learn:clone(LP)}}
function payloadHash(p){return hstr(JSON.stringify([p.game,p.studio,p.learn]))}
function localEmpty(){const s=starter(),pick=d=>JSON.stringify([d.chars,d.skills,d.ais,d.arenas]);return pick(D)===pick(s)&&!Object.keys(StudioStore._read().docs).length&&!Object.values(D.stats).some(Boolean)}
function applyPayload(p){const g=p&&vData(p.game);if(g){delete g.bad;D=g;try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){}}
  const s=p&&p.studio;if(s&&s.schema===1&&s.docs&&typeof s.docs==='object'){const docs={};for(const id in s.docs){const d=vDoc(s.docs[id]);if(d)docs[d.id]=d}try{localStorage.setItem(StudioStore.KEY,JSON.stringify({schema:1,docs,last:docs[s.last]?s.last:null}))}catch(e){}}
  if(p&&p.learn&&typeof p.learn==='object'){try{localStorage.setItem(LKEY,JSON.stringify(p.learn))}catch(e){}lpLoad()}
  if(!G.run&&!ES.open)rerender()}
function mergePayload(loc,rem){const out=clone(loc),r=rem&&vData(rem.game);
  if(r){for(const k of['chars','skills','ais','arenas']){const ids=new Set(out.game[k].map(o=>o.id));for(const o of r[k])if(!ids.has(o.id))out.game[k].push(o)}
    out.game.unlocks=[...new Set([...out.game.unlocks,...r.unlocks])];for(const k in out.game.stats)out.game.stats[k]=Math.max(out.game.stats[k]||0,r.stats[k]||0)}
  const rs=rem&&rem.studio;if(rs&&rs.docs&&typeof rs.docs==='object')for(const id in rs.docs){const d=vDoc(rs.docs[id]);if(!d)continue;const l=out.studio.docs[d.id];if(!l||(+d.updated||0)>(+l.updated||0))out.studio.docs[d.id]=d}
  const rl=rem&&rem.learn;if(rl&&rl.les&&typeof rl.les==='object'){for(const id in rl.les){const a=out.learn.les[id],b=rl.les[id];if(!a||(b&&b.st==='done'&&a.st!=='done'))out.learn.les[id]=b}
    if(Array.isArray(rl.ach))out.learn.ach=[...new Set([...(out.learn.ach||[]),...rl.ach])]}
  return out}
function cloudAsk(msg,a,b){return new Promise(res=>{CLOUD.asking=true;$('#cloudMsg').textContent=msg;$('#cloudA').textContent=a;$('#cloudB').textContent=b;$('#cloudBox').hidden=false;
  const done=v=>{$('#cloudBox').hidden=true;CLOUD.asking=false;res(v)};$('#cloudA').onclick=()=>done('a');$('#cloudB').onclick=()=>done('b')})}
async function cloudPush(force){const sb=CLOUD.sb,u=CLOUD.user;if(!sb||!u)return;const cs=csRead();const p=localPayload(),h=payloadHash(p);
  if(!force&&cs.uid===u.id&&cs.hash===h)return;p.at=Date.now();CLOUD.sync='saving';cloudRefreshUI();
  let r;if(cs.uid===u.id&&cs.rev)r=await sb.from('saves').update({data:p,rev:cs.rev+1}).eq('user_id',u.id).eq('rev',cs.rev).select('rev');
  else r=await sb.from('saves').insert({data:p,rev:1}).select('rev');
  if(r.error){if(r.error.code==='23505'){CLOUD.busy=false;return cloudSync('conflict')}throw r.error}
  if(!r.data||!r.data.length){CLOUD.busy=false;return cloudSync('conflict')}
  csWrite({uid:u.id,rev:r.data[0].rev,hash:h});CLOUD.sync='ok';CLOUD.syncAt=Date.now()}
async function cloudSync(why){const sb=CLOUD.sb,u=CLOUD.user;if(!sb||!u||CLOUD.busy||CLOUD.asking)return;CLOUD.busy=true;CLOUD.sync='syncing';cloudRefreshUI();
  try{const r=await sb.from('saves').select('rev,data').eq('user_id',u.id).maybeSingle();if(r.error)throw r.error;const cs=csRead(),loc=localPayload(),lh=payloadHash(loc);
    if(!r.data){csWrite({uid:u.id});await cloudPush(true)}
    else if(cs.uid===u.id&&cs.rev===r.data.rev){if(lh!==cs.hash)await cloudPush();else{CLOUD.sync='ok';CLOUD.syncAt=Date.now()}}
    else{const rem=r.data.data||{},rh=payloadHash({game:rem.game,studio:rem.studio,learn:rem.learn});
      if(rh===lh){csWrite({uid:u.id,rev:r.data.rev,hash:lh});CLOUD.sync='ok';CLOUD.syncAt=Date.now()}
      else if((cs.uid===u.id&&lh===cs.hash)||localEmpty()){applyPayload(rem);csWrite({uid:u.id,rev:r.data.rev,hash:payloadHash(localPayload())});CLOUD.sync='ok';CLOUD.syncAt=Date.now();toast('โหลดเซฟจากคลาวด์แล้ว','gold')}
      else{CLOUD.busy=false;const v=await cloudAsk('เซฟในเครื่องนี้กับเซฟบนคลาวด์ไม่ตรงกัน จะทำอย่างไร?','รวมกัน (เก็บผลงานทั้งสองฝั่ง)','ใช้เซฟบนคลาวด์แทนของเครื่องนี้');CLOUD.busy=true;
        if(v==='a'){const m=mergePayload(loc,rem);applyPayload(m);csWrite({uid:u.id,rev:r.data.rev,hash:''});await cloudPush(true);toast('รวมเซฟแล้ว','gold')}
        else{applyPayload(rem);csWrite({uid:u.id,rev:r.data.rev,hash:payloadHash(localPayload())});CLOUD.sync='ok';CLOUD.syncAt=Date.now();toast('ใช้เซฟบนคลาวด์แล้ว','gold')}}}}
  catch(e){CLOUD.sync='err';CLOUD.err=authTH(e)}finally{CLOUD.busy=false;cloudRefreshUI()}}
function cloudDirty(){if(!CLOUD.user)return;clearTimeout(CLOUD.timer);CLOUD.timer=setTimeout(()=>{CLOUD.timer=0;if(CLOUD.busy||CLOUD.asking)return cloudDirty();CLOUD.busy=true;cloudPush().catch(e=>{CLOUD.sync='err';CLOUD.err=authTH(e)}).finally(()=>{CLOUD.busy=false;cloudRefreshUI()})},3000)}
{const s0=save;save=function(){s0();cloudDirty()};const w0=StudioStore._write;StudioStore._write=function(db){w0.call(this,db);cloudDirty()};const l0=lpSave;lpSave=function(){l0();cloudDirty()}}

const GAL={backend:null,st:'idle',db:null,user:null,me:null,owner:false,canWrite:null,shelves:[],fans:[],timer:0,q:'',k:'all',sort:'new',mine:false,names:{},writing:Promise.resolve(),open:null,stale:false,items:[],myL:new Set(),myU:new Set(),limit:30,more:false,seq:0,qT:0,loading:false,err:''};
const GAL_MAX_ITEMS=12,GAL_MAX_BYTES=230000;
const okThumb=t=>typeof t==='string'&&/^data:image\/png;base64,[A-Za-z0-9+/=]+$/.test(t)&&t.length<90000?t:'';
function galSan(uid,it){if(!it||typeof it!=='object'||!SHK[it.k]||typeof it.id!=='string'||it.id.length>40)return null;
  return{key:uid+'~'+it.id,uid,id:it.id,src:typeof it.src==='string'?it.src.slice(0,60):'',k:it.k,name:String(it.name||'ไม่มีชื่อ').slice(0,40),desc:String(it.desc||'').slice(0,140),thumb:okThumb(it.thumb),pl:it.pl===undefined?null:it.pl,at:typeof it.at==='number'?it.at:0}}
function rowSan(r){if(!r||typeof r.id!=='string'||!SHK[r.kind])return null;return{key:r.id,uid:String(r.user_id||''),id:r.id,k:r.kind,name:String(r.name||'ไม่มีชื่อ').slice(0,40),desc:String(r.descr||'').slice(0,140),thumb:okThumb(r.thumb),author:String(r.author||'').slice(0,24),likes:Math.max(0,+r.likes||0),uses:Math.max(0,+r.uses||0),at:Date.parse(r.created_at)||0,pl:r.payload}}
/* --- claude backend data --- */
function galShelfItems(){const out=[];for(const s of GAL.shelves){const its=Array.isArray(s.data.items)?s.data.items:[];for(const it of its.slice(0,GAL_MAX_ITEMS)){const x=galSan(s.uid,it);if(x)out.push(x)}}return out}
function galFanCounts(){const likes={},uses={},myL=new Set(),myU=new Set();for(const f of GAL.fans){const d=f.data||{};for(const k of(Array.isArray(d.likes)?d.likes:[]).slice(0,600)){if(typeof k!=='string')continue;likes[k]=(likes[k]||0)+1;if(f.uid===GAL.me)myL.add(k)}for(const k of(Array.isArray(d.uses)?d.uses:[]).slice(0,600)){if(typeof k!=='string')continue;uses[k]=(uses[k]||0)+1;if(f.uid===GAL.me)myU.add(k)}}return{likes,uses,myL,myU}}
function galClaudeRebuild(){const{likes,uses,myL,myU}=galFanCounts();GAL.items=galShelfItems().map(x=>({...x,likes:likes[x.key]||0,uses:uses[x.key]||0}));GAL.myL=myL;GAL.myU=myU}
/* --- init --- */
async function galInit(){if(GAL.st!=='idle')return;GAL.st='loading';
  if(supaOn()){GAL.backend='supa';if(CLOUD.st==='ready'){GAL.me=CLOUD.user?CLOUD.user.id:null;GAL.owner=CLOUD.admin;GAL.canWrite=!!CLOUD.user;GAL.st='ready';galLoad()}else if(CLOUD.st==='err'){GAL.st='err'}else cloudInit();return}
  GAL.backend='claude';
  try{if(typeof claude==='undefined'||!claude||typeof claude.use!=='function'){GAL.st='off';return galRefresh()}
    const[db,user]=await Promise.all([claude.use('db'),claude.use('user')]);if(!db){GAL.st='off';return galRefresh()}
    GAL.db=db;GAL.user=user;if(user){GAL.me=await user.id();GAL.owner=await user.isOwner();GAL.canWrite=await user.can('data.write')}
    GAL.timer=setTimeout(()=>{if(GAL.st==='loading'){GAL.st='slow';galRefresh()}},10000);
    db.collection('gallery').onSnapshot(s=>{GAL.shelves=s.docs.filter(d=>d.exists).map(d=>({uid:d.id,data:d.data()||{}}));clearTimeout(GAL.timer);GAL.st='ready';GAL.stale=s.metadata.fromCache;galClaudeRebuild();galRefresh()},e=>{clearTimeout(GAL.timer);GAL.st='err';galRefresh()});
    db.collection('fans').onSnapshot(s=>{GAL.fans=s.docs.filter(d=>d.exists).map(d=>({uid:d.id,data:d.data()||{}}));galClaudeRebuild();galRefresh()},()=>{})}
  catch(e){GAL.st='err';galRefresh()}}
const qClean=s=>String(s||'').replace(/[,()*%:"'\\.]/g,' ').replace(/\s+/g,' ').trim().slice(0,40);
async function galLoad(){if(GAL.backend!=='supa'||!CLOUD.sb)return;const sb=CLOUD.sb,seq=++GAL.seq;GAL.loading=true;galRefresh();
  try{let q=sb.from('gallery_items').select('id,user_id,kind,name,descr,thumb,author,likes,uses,created_at');if(GAL.k!=='all')q=q.eq('kind',GAL.k);if(GAL.mine&&GAL.me)q=q.eq('user_id',GAL.me);
    const s=qClean(GAL.q);if(s)q=q.or(`name.ilike.*${s}*,descr.ilike.*${s}*,author.ilike.*${s}*`);
    q=GAL.sort==='like'?q.order('likes',{ascending:false}).order('created_at',{ascending:false}):GAL.sort==='use'?q.order('uses',{ascending:false}).order('created_at',{ascending:false}):q.order('created_at',{ascending:false});
    const r=await q.range(0,GAL.limit);if(seq!==GAL.seq)return;if(r.error)throw r.error;const rows=(r.data||[]).map(rowSan).filter(Boolean);GAL.more=rows.length>GAL.limit;GAL.items=rows.slice(0,GAL.limit);
    if(GAL.me&&GAL.items.length){const ids=GAL.items.map(x=>x.id);const[a,b]=await Promise.all([sb.from('gallery_likes').select('item_id').in('item_id',ids),sb.from('gallery_uses').select('item_id').in('item_id',ids)]);if(seq!==GAL.seq)return;
      GAL.myL=new Set((a.data||[]).map(x=>x.item_id));GAL.myU=new Set((b.data||[]).map(x=>x.item_id))}else{GAL.myL=new Set();GAL.myU=new Set()}GAL.err=''}
  catch(e){if(seq!==GAL.seq)return;GAL.err=authTH(e)}GAL.loading=false;galRefresh()}
function galRefresh(){if(ED.scr==='lib'&&ED.libTab==='gal'){if($('#galList')&&GAL.st==='ready')galRenderList();else renderLib()}if(GAL.open&&!$('#galBox').hidden)galDetail(GAL.open)}
const galWrite=(fn)=>{GAL.writing=GAL.writing.then(fn,fn);return GAL.writing};
function galShelf(){const s=GAL.shelves.find(x=>x.uid===GAL.me);return s?clone(s.data):{items:[]}}
function galFans(){const f=GAL.fans.find(x=>x.uid===GAL.me);const d=f?clone(f.data):{};return{likes:Array.isArray(d.likes)?d.likes.filter(k=>typeof k==='string'):[],uses:Array.isArray(d.uses)?d.uses.filter(k=>typeof k==='string'):[]}}
function galErr(e){const c=e&&e.code,m=String(e&&e.message||'');
  if(GAL.backend==='supa'){toast(/PF_LIMIT/.test(m)?'ชั้นวางของคุณเต็ม 12 ชิ้น ลบผลงานเก่าในแกลเลอรีก่อน':c==='23514'?'ผลงานนี้ใหญ่เกินไปสำหรับแกลเลอรี':c==='42501'?'บัญชีนี้ไม่มีสิทธิ์ทำรายการนี้':authTH(e),'bad');return}
  toast(c==='quota_exceeded'?'พื้นที่แกลเลอรีเต็ม ลบผลงานเก่าก่อน':c==='invalid_argument'?'บัญชีนี้เขียนแกลเลอรีไม่ได้ (ต้องมีสิทธิ์ Contributor ขึ้นไป)':'บันทึกไม่สำเร็จ ลองอีกครั้ง','bad');if(c==='invalid_argument')GAL.canWrite=false}
const needLogin=()=>{toast(GAL.backend==='supa'?'เข้าสู่ระบบก่อน ที่ คลัง → ตั้งค่าและสำรองข้อมูล':'บัญชีนี้ดูแกลเลอรีได้อย่างเดียว','bad')};
/* --- thumbnails rendered from the real content --- */
function brightScore(g,w,h){const d=g.getImageData(0,0,w,h).data;let n=0;for(let i=0;i<d.length;i+=16){const m=Math.max(d[i],d[i+1],d[i+2]),mn=Math.min(d[i],d[i+1],d[i+2]);if(m>170&&m-mn>60)n++}return n}
function thumbSkill(s){const w=makeWorld({arena:PREV_ARENA,char:clone(activeChar()),skills:[clone(s)],mode:'preview'});const c=document.createElement('canvas');c.width=256;c.height=96;const g=c.getContext('2d');let best='',bs=-1;
  for(let i=0;i<110;i++){step(w,1/60);if(i>=8&&i%5===0){render(g,w,256,96);const sc=brightScore(g,256,96);if(sc>bs){bs=sc;best=c.toDataURL('image/png')}}}return best}
function thumbStudio(doc){const c=document.createElement('canvas');c.width=256;c.height=144;const g=c.getContext('2d');let best='',bs=-1;
  for(const f of[.15,.3,.45,.6,.8]){const t=doc.duration*f;g.setTransform(1,0,0,1,0,0);g.globalAlpha=1;g.globalCompositeOperation='source-over';g.fillStyle='#100b22';g.fillRect(0,0,256,144);g.fillStyle='#2b2450';g.fillRect(0,SCN.caster.y,256,32);g.fillStyle='#4fe3d6';g.fillRect(0,SCN.caster.y,256,1);
    drawHero(g,activeChar(),SCN.caster.x,SCN.caster.y,1,'attack',0,false);drawFoe(g,{type:'dummy',x:SCN.dummy.x,y:SCN.dummy.y,face:-1,hurtT:0,h:22,hp:1,maxhp:1,dummy:true},0);
    for(let i=doc.layers.length-1;i>=0;i--){const L=doc.layers[i];if(!L.visible)continue;const a=anchorPos(L.p.anchor,f);drawFxLayer(g,L,layerAt(doc,L,t),t,a.x,a.y)}g.globalCompositeOperation='source-over';g.globalAlpha=1;
    const sc=brightScore(g,256,144);if(sc>bs){bs=sc;best=c.toDataURL('image/png')}}return best}
function thumbChar(ch){const c=document.createElement('canvas');c.width=96;c.height=80;const g=c.getContext('2d');g.fillStyle='#17122e';g.fillRect(0,0,96,80);g.fillStyle='#2b2450';g.fillRect(16,66,64,14);g.fillStyle='#4fe3d6';g.fillRect(16,66,64,2);drawHero(g,ch,48,66,1,'idle',0,false,sprOn(ch)&&ch.sprite.size==='l'?2:3);return c.toDataURL('image/png')}
function thumbArena(a){const big=document.createElement('canvas');big.width=480;big.height=192;const g=big.getContext('2d');g.fillStyle='#120d26';g.fillRect(0,0,480,192);
  for(let y=0;y<12;y++)for(let x=0;x<30;x++){const t=+a.tiles[y*30+x];if(t)drawTile(g,t,x*T,y*T,y===0||+a.tiles[(y-1)*30+x]!==1)}
  for(const o of a.objs){if(o.t==='player')drawHero(g,activeChar(),o.x*T+8,(o.y+1)*T,1,'idle',0,false);else drawFoe(g,{type:o.t,x:o.x*T+8,y:(o.y+1)*T,face:-1,hurtT:0,st:0,swing:0,onGround:true,t:0,hp:1,maxhp:1,h:FOES[o.t].h,boss:o.t==='boss',dummy:o.t==='dummy'},0)}
  const c=document.createElement('canvas');c.width=240;c.height=96;const h=c.getContext('2d');h.imageSmoothingEnabled=false;h.drawImage(big,0,0,240,96);return c.toDataURL('image/png')}
function thumbAI(ai){const c=document.createElement('canvas');c.width=160;c.height=72;const g=c.getContext('2d');g.fillStyle='#123a44';g.fillRect(0,0,160,72);g.fillStyle='#4fe3d6';g.font='700 22px Silkscreen, monospace';g.fillText('AI',12,32);g.font='500 13px Mitr, sans-serif';g.fillStyle='#e6fffb';g.fillText(STYLES[ai.style].n,12,56);
  ai.rules.slice(0,6).forEach((r,i)=>{g.fillStyle=['#ff8a3d','#d36bff','#ffd34d','#4fe3d6','#6dffa8','#ff5c7a'][r.slot];g.fillRect(96,10+i*9,40+r.slot*8,6)});return c.toDataURL('image/png')}
function galThumbFor(k,d){try{if(k==='skill')return d.studio?thumbStudio(d.studio.doc):thumbSkill(d);if(k==='studio')return thumbStudio(d);if(k==='char')return thumbChar(d);if(k==='arena')return thumbArena(d);return thumbAI(d)}catch(e){return''}}

async function galPrepare(kind,obj,deps,src){galInit();if(GAL.st==='loading'||GAL.st==='idle')return toast('กำลังเชื่อมต่อแกลเลอรี ลองอีกครั้งในไม่กี่วินาที','bad');
  if(GAL.st!=='ready'&&GAL.st!=='slow')return toast(GAL.st==='off'?'แกลเลอรียังไม่เปิด เกมนี้ยังไม่ได้เชื่อมเซิร์ฟเวอร์':'เชื่อมต่อแกลเลอรีไม่ได้','bad');
  if(GAL.backend==='supa'?!CLOUD.user:(!GAL.me||GAL.canWrite===false))return needLogin();
  const pl={f:'pfs',v:1,k:kind,d:clone(obj),...(deps&&deps.length?{deps:clone(deps)}:{})};const p=validateShare(pl);if(!p)return toast('ผลงานนี้มีข้อมูลไม่ถูกต้อง','bad');
  let exist=null;if(GAL.backend==='supa'){const r=await CLOUD.sb.from('gallery_items').select('id,name,descr').eq('user_id',CLOUD.user.id).eq('src',src).maybeSingle();if(r.error)return galErr(r.error);if(r.data)exist={id:r.data.id,name:r.data.name,desc:r.data.descr}}

const GAME_SFX={jump:'jump',swing:'swing',shot:'shot',laser:'laser',hurt:'hurt',hit:'hit',kill:'kill',boss:'roar',bossdie:'boom',wave:'coin',heal:'heal',deny:'deny',win:'win',lose:'lose',

const sndOn=()=>!D||!D.settings||D.settings.snd!==false;
function audVol(){if(AUD.master)AUD.master.gain.value=sndOn()?(D&&D.settings&&typeof D.settings.vol==='number'?D.settings.vol:.8):0}
['pointerdown','keydown','touchend'].forEach(ev=>addEventListener(ev,()=>{const c=audCtx();if(c&&c.state==='suspended')c.resume().catch(()=>{})},{capture:true,passive:true}));
function audBuf(key,make){let b=AUD.bufs.get(key);if(b)return b;const c=audCtx();if(!c)return null;const data=make();if(!data||!data.length)return null;
  b=c.createBuffer(1,data.length,SR);b.getChannelData(0).set(data);if(AUD.bufs.size>80)AUD.bufs.delete(AUD.bufs.keys().next().value);AUD.bufs.set(key,b);return b}
function audPlayBuf(b,o){const c=audCtx();if(!c||!b||!sndOn())return;if(c.state==='suspended')c.resume().catch(()=>{});if(AUD.voices>=24)return;
  const src=c.createBufferSource();src.buffer=b;src.playbackRate.value=clamp(o.pitch||1,.25,4);const g=c.createGain();g.gain.value=clamp(o.vol==null?1:o.vol,0,2);src.connect(g);
  if(o.pan&&c.createStereoPanner){const p=c.createStereoPanner();p.pan.value=clamp(o.pan,-1,1);g.connect(p);p.connect(AUD.master)}else g.connect(AUD.master);

/* a sound object from a Studio document: {kind:'synth',s} | {kind:'clip',c} */
const sndKey=S=>S.kind==='clip'?'c'+S.id+':'+S.c.data.length+':'+[S.c.start,S.c.end,S.c.fade,S.c.rev,S.c.rate].join(','):'s'+JSON.stringify(S.s);
function sndData(S){return S.kind==='clip'?clipRender(S.c):synthRender(S.s)}
function playSnd(S,o={}){if(!S)return;const b=audBuf(sndKey(S),()=>sndData(S));const r=o.rnd?1+(Math.random()*2-1)*o.rnd:1;audPlayBuf(b,{vol:(o.vol==null?1:o.vol)*(S.vol==null?1:S.vol),pitch:(o.pitch||1)*r,pan:o.pan})}
function playPreset(k,o={}){const P=SFX_PRE[k];if(!P)return;const b=audBuf('p'+k,()=>synthRender(P.s));audPlayBuf(b,o)}
function playGame(ev,o={}){const k=GAME_SFX[ev];if(!k)return;const now=performance.now();if(now-(AUD.last[ev]||0)<(ev==='hit'?55:35))return;AUD.last[ev]=now;playPreset(k,o)}
/* play every queued event of a world: x positions become stereo pan */
function audDrain(w,camX,vw){const q=w.snd;if(!q||!q.length)return;w.snd=[];if(!sndOn()||!AUD.ctx&&!audCtx())return;
  for(const e of q){const pan=e.x!=null&&vw?clamp((e.x-camX-vw/2)/(vw/2),-1,1)*.55:0;if(e.snd)playSnd(e.snd,{vol:e.vol,pitch:e.pitch,rnd:e.rnd,pan});else playGame(e.k,{pan,pitch:e.pitch||(.94+Math.random()*.12),vol:e.vol})}}
/* engine side: queue only (keeps the simulation deterministic and silent when headless) */
function sndEv(w,k,x,o){if(w.headless)return;const q=w.snd||(w.snd=[]);if(q.length<48)q.push(o?{k,x,...o}:{k,x})}
/* ---------- synth ---------- */
function synthRender(s){const len=Math.min(3,s.att+s.sus+s.dec),N=Math.max(1,Math.floor(len*SR)),out=new Float32Array(N),R=rng((s.seed|0)||7);
  const per=s.rep>0?1/s.rep:0,H=1+Math.round(s.crush*14),Q=s.crush>0?Math.pow(2,8-Math.round(s.crush*5)):0,hpa=1-(.002+s.hpf*.35);
  let ph=0,nz=R()*2-1,lastSeg=-1,lp=0,hx=0,hy=0,hv=0,f1=Math.max(1,s.f1),f0=Math.max(1,s.f0);
  for(let i=0;i<N;i++){const t=i/SR,tt=per?t%per:t,k=Math.min(1,tt/Math.max(.001,per||len));
    let env;if(tt<s.att)env=tt/Math.max(.001,s.att);else if(tt<s.att+s.sus)env=1+s.punch*2*(1-(tt-s.att)/Math.max(.001,s.sus));else env=Math.max(0,1-(tt-s.att-s.sus)/s.dec);
    let f=f0*Math.pow(f1/f0,k);if(s.vib>0)f*=Math.pow(2,s.vib*Math.sin(6.2832*s.vibS*t)/6);if(s.arp!==1&&tt>=s.arpT)f*=s.arp;
    ph+=f/SR;if(ph>=1)ph-=Math.floor(ph);let v;
    switch(s.wave){case 'square':v=ph<clamp(s.duty+s.dutyS*k*.45,.05,.95)?1:-1;break;case 'saw':v=2*ph-1;break;case 'tri':v=ph<.5?4*ph-1:3-4*ph;break;case 'sine':v=Math.sin(6.2832*ph);break;
      default:{const seg=Math.floor(ph*16);if(seg!==lastSeg){lastSeg=seg;nz=R()*2-1}v=nz}}
    const c=clamp(s.lpf+s.lpfS*k,.01,1);lp+=(v-lp)*c*c;v=lp;hy=hpa*(hy+v-hx);hx=v;v=hy;
    if(H>1){if(i%H===0)hv=v;v=hv}if(Q)v=Math.round(v*Q)/Q;
    out[i]=Math.tanh(v*env*s.vol*.85)}
  const fN=Math.min(N,Math.floor(SR*.006));for(let i=0;i<fN;i++)out[N-1-i]*=i/fN;return out}
function synthRand(base){const R=Math.random,P=k=>{const d=SYN[k];return d.min+R()*(d.max-d.min)};const w=Object.keys(SWAVES)[Math.floor(R()*5)];
  const s=syn({wave:w,f0:Math.round(P('f0')/10)*10,f1:Math.round(P('f1')/10)*10,att:R()*.08,sus:R()*.3,dec:.05+R()*.6,punch:R()<.4?R():0,vib:R()<.3?R()*.6:0,vibS:Math.round(4+R()*20),
    arp:R()<.3?[.75,1.25,1.5,2][Math.floor(R()*4)]:1,arpT:R()*.3,duty:.1+R()*.4,dutyS:R()<.3?R()*2-1:0,lpf:R()<.5?.3+R()*.7:1,lpfS:R()<.3?R()-.5:0,hpf:R()<.3?R()*.4:0,crush:R()<.25?R()*.6:0,rep:R()<.15?Math.round(4+R()*12):0,vol:.6,seed:Math.ceil(R()*999)});
  return base?s:s}
function synthMutate(s){const o={...s};for(const k in SYN){if(k==='vol'||Math.random()<.55)continue;const d=SYN[k],r=(d.max-d.min)*.08;o[k]=clamp(+(o[k]+(Math.random()*2-1)*r).toFixed(3),d.min,d.max)}return o}
/* ---------- µ-law clips ---------- */
const MU_DEC=(()=>{const t=new Float32Array(256);for(let u=0;u<256;u++){const x=~u&255,sg=x&128,e=(x>>4)&7,m=x&15;let v=((m<<3)+132)<<e;v-=132;t[u]=(sg?-v:v)/32768}return t})();
function muEnc(x){let v=Math.round(clamp(x,-1,1)*32767);const sg=v<0?128:0;if(sg)v=-v;if(v>32635)v=32635;v+=132;let e=7;for(let m=16384;(v&m)===0&&e>0;e--,m>>=1);return(~(sg|(e<<4)|((v>>(e+3))&15)))&255}
function b64enc(u8){let s='';for(let i=0;i<u8.length;i+=8192)s+=String.fromCharCode.apply(null,u8.subarray(i,i+8192));return btoa(s)}
function b64dec(b){const s=atob(b),u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u}
const b64len=b=>Math.floor(b.length*3/4)-(b.endsWith('==')?2:b.endsWith('=')?1:0);
function clipRender(c){const u=b64dec(c.data),n=u.length,a=Math.floor(c.start*n),z=Math.max(a+1,Math.floor(c.end*n)),seg=z-a,outN=Math.max(1,Math.floor(seg*SR/c.rate)),out=new Float32Array(outN);
  for(let i=0;i<outN;i++){const p=a+i*c.rate/SR,j=Math.floor(p),f=p-j,x0=MU_DEC[u[Math.min(z-1,j)]],x1=MU_DEC[u[Math.min(z-1,j+1)]];out[i]=x0+(x1-x0)*f}
  if(c.rev)out.reverse();const fl=Math.floor(outN*c.fade);for(let i=0;i<fl;i++)out[outN-1-i]*=i/fl;const fi=Math.min(outN,64);for(let i=0;i<fi;i++)out[i]*=i/fi;return out}
function decodeAudio(ab){const c=audCtx();if(!c)return Promise.reject(new Error('noaudio'));return new Promise((ok,no)=>{try{const p=c.decodeAudioData(ab,ok,no);if(p&&p.then)p.then(ok,no)}catch(e){no(e)}})}
async function importClip(file,rate){if(!file)throw new Error('nofile');if(file.size>20e6)throw new Error('big');const buf=await decodeAudio(await file.arrayBuffer());
  const n=buf.length,ch=buf.numberOfChannels,mono=new Float32Array(n);for(let k=0;k<ch;k++){const d=buf.getChannelData(k);for(let i=0;i<n;i++)mono[i]+=d[i]/ch}
  let pk=0;for(let i=0;i<n;i++)pk=Math.max(pk,Math.abs(mono[i]));if(pk<.003)throw new Error('silent');const th=pk*.02;
  let a=0,b=n-1;while(a<n&&Math.abs(mono[a])<th)a++;while(b>a&&Math.abs(mono[b])<th)b--;
  const sr=buf.sampleRate,maxIn=Math.floor(CLIP_MAX_S*sr),cut=b-a+1>maxIn,orig=(b-a+1)/sr;if(cut)b=a+maxIn-1;
  const ratio=sr/rate,outN=Math.max(1,Math.floor((b-a+1)/ratio)),out=new Float32Array(outN);
  for(let i=0;i<outN;i++){const j0=a+Math.floor(i*ratio),j1=Math.min(b,a+Math.floor((i+1)*ratio)-1);let s=0,c=0;for(let j=j0;j<=Math.max(j0,j1);j++){s+=mono[j];c++}out[i]=s/c}
  let p2=0;for(let i=0;i<outN;i++)p2=Math.max(p2,Math.abs(out[i]));const g=p2>0?.95/p2:1,u=new Uint8Array(outN);for(let i=0;i<outN;i++)u[i]=muEnc(out[i]*g);

function vSound(x){if(!x||typeof x!=='object'||!isStr(x.id,40))return null;const o={id:x.id,name:isStr(x.name,30)?x.name:TR('เสียง'),kind:x.kind==='clip'?'clip':'synth',vol:vNum(x.vol,1,{min:0,max:1.5})};
  if(o.kind==='synth'){const s=x.s||{};o.s={wave:SWAVES[s.wave]?s.wave:'square'};for(const k in SYN)o.s[k]=vNum(s[k],SYN[k].d,SYN[k]);if(o.s.att+o.s.sus+o.s.dec>3)o.s.sus=Math.max(0,3-o.s.att-o.s.dec);return o}
  const c=x.c||{};if(!CLIP_RATES.includes(c.rate)||typeof c.data!=='string'||!c.data||c.data.length>CLIP_BUDGET||c.data.length%4||!/^[A-Za-z0-9+/]+={0,2}$/.test(c.data))return null;

function drawWave(cv,data){if(!cv||!data)return;const g=cv.getContext('2d'),W=cv.width,Hh=cv.height,mid=Hh/2;g.fillStyle='#0f0b22';g.fillRect(0,0,W,Hh);g.fillStyle='#2b2450';g.fillRect(0,mid,W,1);

  const k=t.dataset.k,P=si==='sp'?SYN[k]:si==='svol'?{min:0,max:1.5}:{min:k==='end'?1:0,max:k==='start'?99:100};const v=num(P);if(v==null)return true;sync(v);
  mut('ปรับเสียง',d=>{const x=d.sounds.find(y=>y.id===S.id);if(si==='svol'){x.vol=v;return}
    if(si==='sp'){x.s[k]=v;const tot=x.s.att+x.s.sus+x.s.dec;if(tot>3)x.s.sus=Math.max(0,3-x.s.att-x.s.dec);return}

  drawSndWave();return true}

/* =====================================================================
   CHARACTER SPRITES — hand-drawn characters with 6 animated poses
   char.sprite={on,size:'s'|'l',pal:[hex…≤32],poses:{idle|walk|jump|attack|cast|hurt:{fps,frames:[str]}}}
   A frame is one string, one char per pixel ('.'=empty, ART_CH index into pal).
   Purely cosmetic: hitbox, HP and speed come from the character's equipment,
   so a drawn character is never stronger or weaker than a built one.
   ===================================================================== */
const SPR_SIZES={s:{w:24,h:24,ax:8,bw:16,bh:24,n:'เล็ก',d:'ตัวละคร 16×24 · พื้นที่วาด 24×24 เผื่ออาวุธ'},l:{w:36,h:36,ax:12,bw:24,bh:32,n:'ใหญ่',d:'ตัวละคร 24×32 · พื้นที่วาด 36×36 เผื่ออาวุธ'}};
const SPR_POSES={idle:{n:'ยืน',fps:3,loop:1},walk:{n:'เดิน',fps:9,loop:1},jump:{n:'กระโดด',fps:6,loop:1},attack:{n:'โจมตี',fps:12,loop:0},cast:{n:'ร่ายสกิล',fps:8,loop:0},hurt:{n:'โดนตี',fps:8,loop:0}};
const SPR_MAXF=8,SPR_MAXPAL=32;
const hexRgb=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
const rgbHex=(r,g,b)=>'#'+[r,g,b].map(v=>v.toString(16).padStart(2,'0')).join('');
function vSprite(x){if(!x||typeof x!=='object'||!SPR_SIZES[x.size]||!Array.isArray(x.pal)||!x.poses||typeof x.poses!=='object')return null;
  const Z=SPR_SIZES[x.size],N=Z.w*Z.h,pal=x.pal.slice(0,SPR_MAXPAL).map(c=>isCol(c)?c.toLowerCase():'#000000');if(!pal.length)return null;
  const okc=new Set(['.',...ART_CH.slice(0,pal.length)]),fix=f=>{if(/^[.0-9a-v]*$/.test(f)&&pal.length===32)return f;let o='';for(const ch of f)o+=okc.has(ch)?ch:'.';return o};
  const o={on:x.on!==false,size:x.size,pal,poses:{}};
  for(const k in SPR_POSES){const p=x.poses[k]||{};let fr=(Array.isArray(p.frames)?p.frames:[]).slice(0,SPR_MAXF).filter(f=>typeof f==='string'&&f.length===N).map(fix);
    if(!fr.length)fr=['.'.repeat(N)];o.poses[k]={fps:vNum(p.fps,SPR_POSES[k].fps,{min:1,max:24}),frames:fr}}
  return o}
const sprOn=c=>!!(c&&c.sprite&&c.sprite.on);
/* ---------- rendering ---------- */
const SPR_CACHE=new Map();
function sprFrameCv(sp,str,white){const key=(white?'w':'')+sp.size+sp.pal.join('')+str;let c=SPR_CACHE.get(key);if(c)return c;
  const Z=SPR_SIZES[sp.size];c=document.createElement('canvas');c.width=Z.w;c.height=Z.h;const g=c.getContext('2d'),im=g.createImageData(Z.w,Z.h),rgb=sp.pal.map(hexRgb);
  for(let i=0;i<str.length;i++){const ch=str[i];if(ch==='.')continue;const col=white?[255,255,255]:rgb[ART_CH.indexOf(ch)];if(!col)continue;const j=i*4;im.data[j]=col[0];im.data[j+1]=col[1];im.data[j+2]=col[2];im.data[j+3]=255}
  g.putImageData(im,0,0);if(SPR_CACHE.size>500)SPR_CACHE.delete(SPR_CACHE.keys().next().value);SPR_CACHE.set(key,c);return c}
function sprFrameIdx(sp,pose,t,pt){const P=sp.poses[pose],n=P.frames.length,loop=SPR_POSES[pose].loop;
  if(loop||pt==null)return Math.floor(Math.max(0,pt!=null?pt:t)*P.fps)%n;return Math.min(n-1,Math.floor(Math.max(0,pt)*P.fps))}

  const cv=sprFrameCv(sp,sp.poses[P].frames[sprFrameIdx(sp,P,t,pt)],flash),w=Z.w*sc,h=Z.h*sc,ax=(face<0?Z.w-Z.ax:Z.ax)*sc,x=Math.round(X-ax),y=Math.round(Y-h);

function spriteFromParts(c,size){const Z=SPR_SIZES[size],big=size==='l',m=big?2:1,sc=big?3:1,base={...c,sprite:null};
  const shots={idle:[0,.47],walk:[0,.12],jump:[0],attack:[0],cast:[0],hurt:[0]},raw={},cols=new Map();
  const cv=document.createElement('canvas');cv.width=Z.w*m;cv.height=Z.h*m;const g=cv.getContext('2d');
  for(const pose in shots){raw[pose]=shots[pose].map(t=>{g.clearRect(0,0,cv.width,cv.height);drawHero(g,base,Z.ax*m,Z.h*m,1,pose==='cast'?'attack':pose,t,false,sc);
    const d=g.getImageData(0,0,cv.width,cv.height).data,px=[];for(let y=0;y<Z.h;y++)for(let x=0;x<Z.w;x++){const j=((y*m)*cv.width+x*m)*4;if(d[j+3]<128){px.push(null);continue}const h=rgbHex(d[j],d[j+1],d[j+2]);cols.set(h,(cols.get(h)||0)+1);px.push(h)}return px})}

  if(!sp.pal.length)sp.pal=['#1a1030'];return sp}
function blankSprite(size){const Z=SPR_SIZES[size],sp={on:true,size,pal:['#1a1030','#f2c49b','#3a47b8','#9aa5cc','#ff8a3d','#e9e4ff','#4fe3d6','#ffffff'],poses:{}};
  for(const k in SPR_POSES)sp.poses[k]={fps:SPR_POSES[k].fps,frames:['.'.repeat(Z.w*Z.h)]};return sp}
/* resize between small and large (nearest neighbour around the feet anchor) */
function spriteResize(sp,size){if(sp.size===size)return sp;const A=SPR_SIZES[sp.size],B=SPR_SIZES[size],r=A.bh/B.bh,o={...clone(sp),size,poses:{}};

  const p1=vsPlayer(w,A.c,A.sk,0,x1,y1),p2=vsPlayer(w,B.c,B.sk,1,x2,y2);

/* ---------- simulation hooks (called from step / hurt / render) ---------- */
function vsStep(w,dt){const V=w.vs,[a,b]=w.ps;
  if(V.freeze>0){V.freeze-=dt;for(const p of w.ps){p.vx=0;p.inp.atk=0;physics(w,p,dt)}return false}
  V.t+=dt;
  for(const p of w.ps){const op=p===a?b:a;
    if(p.ai){aiThink(w,p,dt);vsAI(w,p,op,dt)}
    else if(V.style==='fight'&&p.dashT<=0)p.aim=Math.sign(op.x-p.x)||p.face;
    p.guard=V.style==='fight'&&p.onGround&&p.dashT<=0&&p.atkT<=0&&p.castT<=0&&p.stun<=0&&((p.inp.l&&op.x>p.x)||(p.inp.r&&op.x<p.x))}
  updPlayer(w,a,dt);updPlayer(w,b,dt);
  if(V.style==='fight')vsPush(w,a,b);
  return true}
function vsAI(w,p,op,dt){const L=VS_LV[p.aiLv]||VS_LV.normal;if(w.vs.style!=='fight'||!L.guard)return;
  p.gT-=dt;
  const near=Math.abs(op.x-p.x)<72,threat=(near&&(op.atkT>0||op.castT>0||op.dashT>0))||w.projs.some(pr=>pr.team!==p.team&&Math.abs(pr.x-p.x)<54&&Math.sign(p.x-pr.x)===Math.sign(pr.vx));
  if(threat&&p.gT<=0&&p.gHold<=0){p.gT=.3;if(w.R()<L.guard)p.gHold=.4}
  if(p.gHold>0){p.gHold-=dt;const d=Math.sign(op.x-p.x)||1;p.inp.l=d>0?1:0;p.inp.r=d<0?1:0;p.inp.atk=0;p.aim=d}}
function vsPush(w,a,b){const lo=T+6,hi=(w.W-1)*T-6;
  const dx=b.x-a.x,min=(a.w+b.w)/2;
  if(Math.abs(dx)<min&&a.y-a.h<b.y&&b.y-b.h<a.y&&a.dashT<=0&&b.dashT<=0){const s=Math.sign(dx)||(a.face>0?1:-1),o=(min-Math.abs(dx))/2;a.x-=s*o;b.x+=s*o}
  const mx=VW-28,d2=b.x-a.x;if(Math.abs(d2)>mx){const s=Math.sign(d2),o=(Math.abs(d2)-mx)/2;a.x+=s*o;b.x-=s*o}
  for(const p of[a,b])p.x=clamp(p.x,lo,hi)}
function vsGuard(w,tg,amt,src){tg.guarded=false;if(src.dot||src.team===2||!tg.guard)return amt;
  if(src.dir&&src.dir!==-tg.face)return amt;
  tg.guarded=true;sndEv(w,'deny',tg.x);addFx(w,{k:'ring',x:tg.x+tg.face*7,y:tg.y-10,r:9,c:'#7fdcff',c2:'#e8fbff',t:.16,T:.16});note(w,tg,'กันได้!');
  return amt*VS_GUARD}
function vsDealt(w,tg,d,src){const V=w.vs;V.taken[tg.team]+=d;if(src.team===0||src.team===1)V.dmg[src.team]+=d}
function vsCheckEnd(w){const[a,b]=w.ps,V=w.vs,ka=a.hp<=0,kb=b.hp<=0;let winner=null,why='';
  if(ka||kb){winner=ka&&kb?-1:ka?1:0;why='ko'}
  else if(V.t>=V.time){const ra=a.hp/a.maxhp,rb=b.hp/b.maxhp;winner=Math.abs(ra-rb)<.005?-1:ra>rb?0:1;why='time'}
  if(winner===null)return;
  const ctl=G.vs&&G.vs.w===w?G.vs.ctl:'2p';
  w.over={vs:1,winner,why,win:ctl==='cpu'?winner===0:winner!==-1}}
function vsCamX(w){const[a,b]=w.ps;return(a.x+b.x)/2}
function vsDrawWorld(g,w,cx,vw){g.font='8px Silkscreen, monospace';g.textAlign='center';
  w.ps.forEach((p,i)=>{const lab=p.ai?'CPU':(i+1)+'P',col=VS_COL[i],x=Math.round(p.x),top=Math.round(p.y-p.h-(p.c.sprite&&p.c.sprite.on&&p.c.sprite.size==='l'?16:8));

    if(p.guard){g.globalAlpha=.55+.25*Math.sin(w.t*20);g.strokeStyle='#7fdcff';g.lineWidth=1;g.beginPath();g.arc(x+p.face*4,p.y-10,10,p.face>0?-1.1:Math.PI-1.1,p.face>0?1.1:Math.PI+1.1);g.stroke();g.globalAlpha=1}

function tModeItems(){const sh=$('#stSheet');return sh&&!sh.hidden?$$('#stSheet .mi').filter(e=>/^(อัตโนมัติตามขนาดจอ|โหมดมือถือ|โหมดขั้นสูง|Auto by screen size|Mobile mode|Advanced mode)/.test(e.textContent)):[]}
function tScreen(s){closeHelp();if(G.run)stopGame();tHideStudio();if(ED.scr!==s)go(s)}
function tFight(tab){tScreen('fight');if(ED.fightTab!==tab){ED.fightTab=tab;renderFight()}}
function tLearn(){tScreen('learn');renderLearn();$('#main').scrollTop=0}
function tStudio(){closeHelp();if(G.run)stopGame();if(!ES.open)openStudio()}
function tGame(){closeHelp();tHideStudio();if(!G.run){if(ED.scr!=='fight')go('fight');startGame({mode:'action',charId:D.settings.active,arena:'fort',from:'fight'})}else if(!G.w.over){$('#gMenu').hidden=true;G.paused=false;G.last=0}}
function tPanel(k){if(!ES.open)tStudio();if(ES.adv){if(k==='time'||k==='graph'||k==='snd'){if(ES.bottom!==k){ES.bottom=k;stRender('all')}}}else if(ES.panel!==k){ES.panel=k;ES.full=false;stRender('all')}}
const vis=s=>{const e=typeof s==='string'?$(s):s;if(!e)return false;const r=e.getBoundingClientRect();return r.width>0&&r.height>0};
const padSel=(touch,key)=>vis('.'+touch)?'.'+touch:'.khelp';
const pnl=k=>ES.adv?(k==='time'||k==='graph'?'#paneTime .ptabs, #paneGraph .ptabs':'#pane'+{layers:'Layers',insp:'Insp'}[k]):'#stDock [data-v="'+k+'"]';
const pnlOpen=k=>ES.adv?(k==='time'||k==='graph'?ES.bottom===k:true):ES.panel===k;
const keyCount=()=>ES.doc.tracks.reduce((a,t)=>a+t.keys.length,0);

const LMAP=Object.fromEntries(LESSONS.map(l=>[l.id,l]));
const ACH=[{id:'first',n:'ก้าวแรก',d:'เรียนจบบทเรียนแรก',ok:()=>lpDone()>=1},{id:'explorer',n:'นักสำรวจ',d:'จบหมวดเริ่มต้นและส่วนประกอบ',ok:()=>catDone('start')&&catDone('ui')},
  {id:'smith',n:'ช่างหลอม',d:'จบหมวดวิธีใช้งานเครื่องมือ',ok:()=>catDone('tools')},{id:'creator',n:'นักสร้างสรรค์',d:'จบหมวดการสร้างและแก้ไขผลงาน',ok:()=>catDone('create')},
  {id:'keeper',n:'ผู้ดูแลคลัง',d:'จบหมวดการจัดการโปรเจกต์',ok:()=>catDone('project')},{id:'sharp',n:'ตอบแม่น',d:'ผ่านแบบทดสอบในครั้งแรก 5 บท',ok:()=>Object.values(LP.les).filter(x=>x.first).length>=5},
  {id:'helper',n:'รู้จักขอความช่วยเหลือ',d:'เปิดปุ่มช่วยเหลือครั้งแรก',ok:()=>LP.help>0},{id:'master',n:'ปรมาจารย์ PIXEL FORGE',d:'เรียนจบทุกบทเรียน',ok:()=>lpDone()===LESSONS.length}];

/* --- progress store --- */
let LP;
function lpLoad(){let r=null;try{r=JSON.parse(localStorage.getItem(LKEY)||'null')}catch(e){}
  LP={schema:1,les:{},cur:null,ach:[],help:0,intro:0};if(!r||r.schema!==1)return;
  if(r.les&&typeof r.les==='object')for(const id in r.les){const x=r.les[id],L=LMAP[id];if(!L||!x)continue;LP.les[id]={st:x.st==='done'?'done':'doing',step:int(x.step,0,L.steps.length-1,0),tour:!!x.tour,quiz:!!x.quiz,first:!!x.first,tries:int(x.tries,0,999,0),skipped:int(x.skipped,0,99,0)}}
  LP.cur=LMAP[r.cur]?r.cur:null;LP.ach=Array.isArray(r.ach)?r.ach.filter(a=>ACH.some(x=>x.id===a)):[];LP.help=int(r.help,0,1e6,0);LP.intro=r.intro?1:0}
function lpSave(){try{localStorage.setItem(LKEY,JSON.stringify(LP))}catch(e){}}
const lpGet=id=>LP.les[id]||(LP.les[id]={st:'doing',step:0,tour:false,quiz:false,first:false,tries:0,skipped:0});
const lpDone=()=>Object.values(LP.les).filter(x=>x.st==='done').length;
const catDone=c=>LESSONS.filter(l=>l.cat===c).every(l=>LP.les[l.id]&&LP.les[l.id].st==='done');
function lpCheck(id){const x=LP.les[id];if(x&&x.tour&&x.quiz&&x.st!=='done'){x.st='done';if(LP.cur===id)LP.cur=null;toast('เรียนจบ "'+LMAP[id].t+'" แล้ว','gold')}
  for(const a of ACH)if(!LP.ach.includes(a.id)&&a.ok()){LP.ach.push(a.id);setTimeout(()=>toast('ได้รับเครื่องหมาย: '+a.n,'gold'),1300)}lpSave()}

/* --- tutorial engine --- */
const TUT={on:false,les:null,steps:[],i:0,ok:false,base:null,t0:0,hintShown:false,scrolled:false,bound:false,raf:0,lastBox:''};
function tutStart(lesId,from){const L=lesId?LMAP[lesId]:null;tutStartSteps(L?L.steps:[],L,from||0)}
function tutStartSteps(steps,L,from){if(!steps.length)return;tutBind();closeHelp();TUT.on=true;TUT.les=L;TUT.steps=steps;$('#tut').hidden=false;
  if(L){const x=lpGet(L.id);LP.cur=L.id;lpSave()}tutGo(clamp(from,0,steps.length-1));if(!TUT.raf)TUT.raf=requestAnimationFrame(tutLoop)}
function tutGo(i){const st=TUT.steps[i];TUT.i=i;TUT.ok=false;TUT.hintShown=false;TUT.scrolled=false;TUT.t0=performance.now();
  try{st.pre&&st.pre()}catch(e){}try{TUT.base=st.base?st.base():null}catch(e){TUT.base=null}
  if(TUT.les){lpGet(TUT.les.id).step=i;lpSave()}tutCard()}
function tutEnd(finished){const L=TUT.les;TUT.on=false;$('#tut').hidden=true;cancelAnimationFrame(TUT.raf);TUT.raf=0;
  if(L){if(finished){const x=lpGet(L.id);x.tour=true;x.step=0;lpCheck(L.id);ED.learnSel=L.id;if(!x.quiz){toast('ฝึกครบแล้ว ทำแบบทดสอบเพื่อจบบทเรียน');ED.learnQuiz=1}ED.quizState=null;tLearn()}
    else{lpSave();toast('บันทึกตำแหน่งไว้แล้ว เรียนต่อได้จากห้องเรียน')}}}
const stepHas=st=>!!st.done;
function tutCard(){const st=TUT.steps[TUT.i],n=TUT.steps.length,L=TUT.les,act=stepHas(st);
  $('#tutLes').textContent=L?L.t:'พาไปดูเครื่องมือ';$('#tutCount').textContent=(TUT.i+1)+'/'+n;$('#tutBarI').style.width=((TUT.i+(TUT.ok?1:0))/n*100)+'%';
  $('#tutTitle').textContent=st.t;$('#tutBody').textContent=st.b||'';$('#tutBody').hidden=!st.b;
  const tk=$('#tutTask');tk.hidden=!act;tk.querySelector('span').textContent=TUT.ok?'ทำสำเร็จ!':st.task||'';
  $('#tutHint').hidden=true;$('#tutCardEl').classList.toggle('ok',TUT.ok);
  const last=TUT.i===n-1;$('#tutPrev').disabled=TUT.i===0;$('#tutSkip').hidden=!act||TUT.ok||!!st.optional;
  const nx=$('#tutNext');nx.disabled=act&&!TUT.ok&&!st.optional;nx.textContent=last?(L?'จบบทเรียน':'เสร็จ'):'ถัดไป'}
function tutHint(msg){const h=$('#tutHint'),st=TUT.steps[TUT.i];if(!h||!st)return;let m=msg||(typeof st.hint==='function'?st.hint():st.hint)||'แตะเฉพาะส่วนที่มีกรอบเรืองแสง หรือกดถัดไป';h.textContent=m;h.hidden=false;h.style.animation='none';void h.offsetWidth;h.style.animation=''}
function tutTarget(st){let s;try{s=typeof st.sel==='function'?st.sel():st.sel}catch(e){s=null}if(!s)return null;if(typeof s==='string'){for(const one of s.split(',')){const e=document.querySelector(one.trim());if(e&&vis(e))return e}return null}return vis(s)?s:null}
