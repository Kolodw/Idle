/* =====================================================================
   STUDIO → GAME BRIDGE
   A Studio document becomes a game skill by snapshot: skill.studio = {src, doc, rev}.
   In battle the same GraphRun runs against the real combat world:
   projectiles are real projectiles, "damage" hurts the enemy that was hit
   (or the nearest enemy in front), "status" applies burn / slow / stun.
   Mana and cooldown come from the graph's estimated damage, so stronger
   graphs cost more. Damage per hit is capped at 150.
   ===================================================================== */
function studioNominal(doc){const st=doc.nodes.find(n=>n.type==='status');return{type:doc.nodes.some(n=>n.type==='projectile')?'bolt':'burst',elem:st?{fire:'fire',ice:'ice',shock:'shock'}[st.p.kind]:'energy',beh:'pierce'}}
const STUDIO_ST=new WeakMap();
function studioStats(doc){const c=STUDIO_ST.get(doc);if(c)return c;const times={};let guard=0;
  const walk=(id,m,depth)=>{if(depth>24||guard++>3000)return;times[id]=(times[id]||0)+m;const n=doc.nodes.find(x=>x.id===id);if(!n)return;
    for(const e of doc.edges)if(e.from[0]===id){const pd=portDef(n.type,e.from[1],'out');if(!pd||pd[1]!=='exec')continue;const k=n.type==='repeat'&&e.from[1]==='each'?clamp(Math.round(n.p.count),1,10):1;walk(e.to[0],Math.min(60,m*k),depth+1)}};
  doc.nodes.filter(n=>n.type==='onCast').forEach(n=>walk(n.id,1,0));
  let dmg=0,extra=0;for(const n of doc.nodes){const t=times[n.id]||0;if(!t)continue;if(n.type==='damage')dmg+=t*Math.min(150,Math.max(0,Math.round(dataIn(doc,n,'amount'))));if(n.type==='status')extra+=t*n.p.sec*(n.p.kind==='fire'?4:3)}
  const proj=doc.nodes.find(n=>n.type==='projectile'&&times[n.id]),sp=proj?clamp(dataIn(doc,proj,'speed'),20,600):0,range=proj?Math.round(Math.min(320,sp*1.6)):70,score=dmg+extra;
  const r={dmg:Math.round(dmg),score:Math.round(score),cd:Math.round(clamp(.8+score/30,.8,10)*10)/10,mp:Math.round(clamp(8+score*.5,8,90)),range,rad:0,reach:range,pts:0,proj:!!proj,hasDmg:doc.nodes.some(n=>n.type==='damage'&&times[n.id])};
  STUDIO_ST.set(doc,r);return r}
function vStudioSkill(s){if(!isStr(s.id,60)||!s.studio)return null;const doc=vDoc(s.studio.doc);if(!doc)return null;
  return{id:s.id,name:isStr(s.name,30)?s.name:doc.name.slice(0,30),...studioNominal(doc),pow:1,rng:1,cd:1,studio:{src:isStr(s.studio.src,40)?s.studio.src:'',doc,rev:typeof s.studio.rev==='number'?s.studio.rev:0}}}
const skillTag=s=>s.studio?'จาก Skill Studio':TYPES[s.type].n+' · '+ELEMS[s.elem].n;
/* run a Studio skill inside the battle world */
function runStudioSkill(w,p,s,st){const doc=s.studio.doc,face=p.face,R={run:null,live:0};
  const foeNear=()=>aimTarget(w,p,st.reach+12)||(()=>{let b=null,bd=st.reach+40;for(const e of w.ents){if(e.dead||e.team===p.team)continue;const d=Math.abs(e.x-p.x);if(d<bd){bd=d;b=e}}return b})();
  const tgt=()=>{const c=R.run.cur;return c&&!c.dead?c:foeNear()};
  const host={log(){},pulse(){},
    fx(L,at){if(w.headless)return;const t=at==='caster'?p:tgt();w.sfx.push({L,doc,t0:w.t,at,ent:t||null,x:t?t.x:p.x+face*48,y:t?t.y-t.h/2:p.y-10,dir:at==='caster'?face:1})},
    projectile(sp,hit){const range=Math.min(320,sp*1.6);const pr=shoot(w,p,{spd:sp,life:range/sp,dmg:0,r:4,team:p.team,kind:'studio',ang:aimAng(w,p,range),c:ELEMS[s.elem].c,c2:'#ffffff'});
      pr.sv={doc,t0:w.t};R.live++;pr.hitFn=e=>hit(e);pr.onDie=()=>{R.live--}},
    damage(a){const t=tgt();if(t)hurt(w,t,Math.min(150,Math.max(0,a)),{team:p.team,sk:s.id,dir:Math.sign(t.x-p.x)||face,kb:70})},
    status(k,sec){const t=tgt();if(!t||t.dead)return;if(k==='fire'){t.burn=sec;t.burnD=3;t.burnSk=s.id;t.burnT=.5}else if(k==='ice')t.slow=sec;else if(!t.boss)t.stun=Math.min(sec,1.5);
      if(!w.headless)w.nums.push({x:t.x,y:t.y-t.h-8,v:SS.NODES.status.p.kind.o[k],t:.8,c:ELEMS[{fire:'fire',ice:'ice',shock:'shock'}[k]].c2,txt:1})}};
  R.run=new GraphRun(doc,host);if(R.run.start())w.sruns.push(R)}
function studioSkillStep(w,dt){for(const R of w.sruns)R.run.update(dt);w.sruns=w.sruns.filter(R=>!R.run.idle||R.live>0);
  if(!w.headless)w.sfx=w.sfx.filter(f=>w.t-f.t0<=f.L.p.start+f.L.p.dur)}
function drawStudioFx(g,w){for(const f of w.sfx){if(!f.L.visible)continue;const lt=w.t-f.t0;let x=f.x,y=f.y;
    if(f.ent&&!f.ent.dead){if(f.at==='caster'){x=f.ent.x+f.dir*8;y=f.ent.y-10}else{x=f.ent.x;y=f.ent.y-f.ent.h/2}}
    g.save();g.translate(Math.round(x),Math.round(y));if(f.dir<0)g.scale(-1,1);drawFxLayer(g,f.L,layerAt(f.doc,f.L,lt),lt,0,0);g.restore()}
  g.globalCompositeOperation='source-over';g.globalAlpha=1}
function drawStudioProj(g,w,pr){const doc=pr.sv.doc,lt=(w.t-pr.sv.t0)%doc.duration;let any=false;g.save();g.translate(Math.round(pr.x),Math.round(pr.y));if(pr.vx<0)g.scale(-1,1);
  for(let i=doc.layers.length-1;i>=0;i--){const L=doc.layers[i];if(!L.visible||L.p.anchor!=='projectile')continue;any=true;drawFxLayer(g,L,layerAt(doc,L,lt),lt,0,0)}
  g.restore();g.globalCompositeOperation='source-over';g.globalAlpha=1;if(!any){g.fillStyle=pr.c;pxCircle(g,Math.round(pr.x),Math.round(pr.y),3);g.fillStyle='#fff';pxCircle(g,Math.round(pr.x),Math.round(pr.y),1)}}

/* --- Studio side: send the open document into the game --- */
function studioToGame(){const d=ES.doc,errs=validateGraph(d).filter(i=>i.lv==='err');if(errs.length){toast('แก้ข้อผิดพลาดในกราฟก่อน: '+errs[0].msg,'bad');openPane('graph');return}
  const snap=vDoc(clone(d));if(!snap)return toast('ส่งไม่สำเร็จ ข้อมูลเอกสารไม่ถูกต้อง','bad');const ss=studioStats(snap);

  else{sk={id:uid('sk'),name:(d.name||'สกิลจาก Studio').slice(0,30),...studioNominal(snap),pow:1,rng:1,cd:1,studio:{src:d.id,doc:snap,rev:Date.now()}};D.skills.push(sk)}
  save();if(ED.skill&&ED.skill.id===sk.id){ED.skill=clone(sk);ED.skillDirty=false}if(ED.char)ED.char.skills=ED.char.skills.map(id=>id);
  const c=activeChar(),info='ความเสียหายต่อครั้งประมาณ '+ss.dmg+' · พลังงาน '+ss.mp+' · เวลารอ '+ss.cd+' วิ'+(ss.hasDmg?'':' (กราฟนี้ยังไม่มี Node ทำความเสียหาย)');

  const slot=c.skills.findIndex(x=>!x||!getSkill(x)),si=slot<0?2:slot;
  ask((isNew?'ส่ง':'อัปเดต')+' "'+sk.name+'" เข้าเกมแล้ว ('+info+') ใส่ในช่องสกิล '+(si+1)+' ของ '+c.name+' เลยไหม'+(slot<0?' (แทนสกิลเดิมในช่องนั้น)':'')+'?','ใส่ในช่อง '+(si+1),()=>{c.skills[si]=sk.id;if(ED.char&&ED.char.id===c.id)ED.char.skills[si]=sk.id;save();toast('ใส่แล้ว ลองใช้ในการต่อสู้ได้เลย','gold')},false)}
SA.toGame=()=>studioToGame();

/* =====================================================================
   TEMPLATES + SHARE CODES
   Share code = "PF1z:" + base64url(deflate(JSON)) (or "PF1:" without compression).
   Payload {f:'pfs', v:1, k:'skill'|'studio'|'char'|'arena'|'ai', d, deps?}
   Every import (paste or template) goes through validateShare() → acceptShare(),
   which re-validates with the game's own validators and gives fresh ids.
   Nothing here needs a server; codes travel by copy and paste.
   ===================================================================== */
const SHK={skill:'สกิล',studio:'เอกสาร Studio',char:'ตัวละคร',arena:'สนาม',ai:'การตั้งค่า AI'};
const b64u=u8=>{let s='';for(let i=0;i<u8.length;i+=0x8000)s+=String.fromCharCode.apply(null,u8.subarray(i,i+0x8000));return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')};
const unb64u=str=>{str=str.replace(/-/g,'+').replace(/_/g,'/');while(str.length%4)str+='=';const bin=atob(str),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return u};
async function packShare(obj){const bytes=new TextEncoder().encode(JSON.stringify(obj));
  if(window.CompressionStream){try{const buf=await new Response(new Blob([bytes]).stream().pipeThrough(new CompressionStream('deflate-raw'))).arrayBuffer();return'PF1z:'+b64u(new Uint8Array(buf))}catch(e){}}return'PF1:'+b64u(bytes)}
async function unpackShare(code){code=(code||'').replace(/\s+/g,'');if(code.length>3e6)throw new Error('รหัสยาวเกินไป');const m=code.match(/^PF1(z?):([A-Za-z0-9_-]+)$/);if(!m)throw new Error('รูปแบบรหัสไม่ถูกต้อง ต้องขึ้นต้นด้วย PF1');
  let u;try{u=unb64u(m[2])}catch(e){throw new Error('รหัสไม่ครบหรือมีตัวอักษรแปลกปน')}
  if(m[1]){if(!window.DecompressionStream)throw new Error('เบราว์เซอร์นี้เปิดรหัสแบบบีบอัดไม่ได้ ลองเบราว์เซอร์รุ่นใหม่');try{u=new Uint8Array(await new Response(new Blob([u]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer())}catch(e){throw new Error('รหัสไม่ครบ คัดลอกมาไม่หมด')}}
  try{return JSON.parse(new TextDecoder().decode(u))}catch(e){throw new Error('อ่านข้อมูลในรหัสไม่ได้')}}
function validateShare(o){if(!o||o.f!=='pfs'||o.v!==1||!SHK[o.k]||!o.d||typeof o.d!=='object')return null;const d={...o.d,id:isStr(o.d.id,60)?o.d.id:'x_'+o.k};let v=null,deps=[];
  if(o.k==='skill')v=vSkill(d);else if(o.k==='char'){v=vChar(d);deps=(Array.isArray(o.deps)?o.deps:[]).slice(0,3).map(s=>vSkill(s&&{...s,id:isStr(s.id,60)?s.id:'x'})).filter(Boolean)}
  else if(o.k==='arena')v=vArena(d);else if(o.k==='ai')v=vAI(d);else v=vDoc(d);return v?{k:o.k,d:v,deps}:null}
function shareSummary(p){const d=p.d;if(p.k==='skill'){const st=sStats(d);return skillTag(d)+' · ความเสียหาย '+st.dmg+' · พลังงาน '+st.mp+' · เวลารอ '+st.cd+' วิ'}
  if(p.k==='char'){const st=charStats(d);return ARMORS[d.parts.armor].n+' · '+WEAPONS[d.parts.weapon].n+' · พลังชีวิต '+st.hp+(p.deps.length?' · มีสกิลมาด้วย '+p.deps.length+' สกิล':'')}
  if(p.k==='arena')return'ศัตรู '+d.objs.filter(o=>FOES[o.t]&&o.t!=='dummy').length+' ตัว · หุ่นฝึก '+d.objs.filter(o=>o.t==='dummy').length+' ตัว';
  if(p.k==='ai')return'สไตล์'+STYLES[d.style].n+' · '+d.rules.length+' กฎ';return d.layers.length+' Layer · '+d.nodes.length+' Node'}
function freshSkill(s){const n=clone(s);n.id=uid('sk');if(n.studio){const doc=n.studio.doc;doc.id=sid('D');n.studio={src:doc.id,doc,rev:Date.now()};try{StudioStore.save(clone(doc))}catch(e){}}return n}
function acceptShare(p){const d=clone(p.d);
  if(p.k==='skill'){const s=freshSkill(d);D.skills.push(s);save();return{msg:'เพิ่มสกิล "'+s.name+'" แล้ว ใส่ในช่องสกิลได้ที่หน้าตัวละคร',kind:'skill',id:s.id}}
  if(p.k==='char'){const map={};for(const s of p.deps){const n=freshSkill(s);map[s.id]=n.id;D.skills.push(n)}d.id=uid('ch');d.skills=d.skills.map(x=>x&&map[x]?map[x]:x&&getSkill(x)?x:null);D.chars.push(d);save();return{msg:'เพิ่มตัวละคร "'+d.name+'"'+(p.deps.length?' พร้อมสกิล '+p.deps.length+' สกิล':'')+' แล้ว',kind:'char',id:d.id}}
  if(p.k==='arena'){d.id=uid('ar');D.arenas.push(d);save();return{msg:'เพิ่มสนาม "'+d.name+'" แล้ว',kind:'arena',id:d.id}}
  if(p.k==='ai'){d.id=uid('ai');D.ais.push(d);save();return{msg:'เพิ่มการตั้งค่า AI "'+d.name+'" แล้ว',kind:'ai',id:d.id}}
  d.id=sid('D');d.updated=Date.now();try{StudioStore.save(d)}catch(e){return{msg:'บันทึกเอกสาร Studio ไม่สำเร็จ',bad:1}}return{msg:'เพิ่มเอกสาร "'+d.name+'" ใน Skill Studio แล้ว',kind:'studio',id:d.id}}
/* --- share dialog --- */
async function showShare(kind,obj,deps){const pl={f:'pfs',v:1,k:kind,d:obj,...(deps&&deps.length?{deps}:{})};let code;try{code=await packShare(pl)}catch(e){return toast('สร้างรหัสไม่สำเร็จ','bad')}
  ED.lastShare=code;$('#shTitle').textContent='แชร์'+SHK[kind]+': '+(obj.name||'');$('#shInfo').textContent='รหัสยาว '+code.length.toLocaleString('th-TH')+' ตัวอักษร ส่งให้เพื่อนทางแชตได้ เพื่อนวางรหัสที่ คลัง → แม่แบบและแชร์ → รับผลงานจากรหัส';$('#shCode').value=code;$('#shareBox').hidden=false}
function shareItem(k,id){if(k==='skills'){const s=getSkill(id);if(s)showShare('skill',s)}else if(k==='chars'){const c=getChar(id);if(c)showShare('char',c,c.skills.map(x=>x&&getSkill(x)).filter(Boolean))}

SA.shareDoc=()=>{const d=vDoc(clone(ES.doc));if(d)showShare('studio',d)};
/* =====================================================================
   COMMUNITY GALLERY — shared artifact database (capability "db" + "user")
   gallery/<userId>  one "shelf" document per person: {items:[...], at}
                     everyone reads, each person writes only their own shelf,
                     the artifact owner can remove anything (moderation)
   fans/<userId>     {likes:[key], uses:[key]} per person, counted by everyone
   Item: {id, src, k, name, desc, thumb (PNG data URL), pl (share payload), at}
   Everything read from the store is untrusted: items are sanitized for display
   and payloads go through validateShare() before anything is imported.
   Without the capability (file copy, signed out) the tab explains and stays off.
   ===================================================================== */
const GAL={st:'idle',db:null,user:null,me:null,owner:false,canWrite:null,shelves:[],fans:[],timer:0,q:'',k:'all',sort:'new',mine:false,names:{},writing:Promise.resolve(),open:null,stale:false};
const GAL_MAX_ITEMS=12,GAL_MAX_BYTES=230000;
function galSan(uid,it){if(!it||typeof it!=='object'||!SHK[it.k]||typeof it.id!=='string'||it.id.length>40)return null;
  const thumb=typeof it.thumb==='string'&&/^data:image\/png;base64,[A-Za-z0-9+/=]+$/.test(it.thumb)&&it.thumb.length<90000?it.thumb:'';
  return{key:uid+'~'+it.id,uid,id:it.id,src:typeof it.src==='string'?it.src.slice(0,60):'',k:it.k,name:String(it.name||'ไม่มีชื่อ').slice(0,40),desc:String(it.desc||'').slice(0,140),thumb,pl:it.pl,at:typeof it.at==='number'?it.at:0}}
function galItems(){const out=[];for(const s of GAL.shelves){const its=Array.isArray(s.data.items)?s.data.items:[];for(const it of its.slice(0,GAL_MAX_ITEMS)){const x=galSan(s.uid,it);if(x)out.push(x)}}return out}
function galCounts(){const likes={},uses={},myL=new Set(),myU=new Set();for(const f of GAL.fans){const d=f.data||{};for(const k of(Array.isArray(d.likes)?d.likes:[]).slice(0,600)){if(typeof k!=='string')continue;likes[k]=(likes[k]||0)+1;if(f.uid===GAL.me)myL.add(k)}for(const k of(Array.isArray(d.uses)?d.uses:[]).slice(0,600)){if(typeof k!=='string')continue;uses[k]=(uses[k]||0)+1;if(f.uid===GAL.me)myU.add(k)}}return{likes,uses,myL,myU}}
async function galInit(){if(GAL.st!=='idle')return;GAL.st='loading';galRefresh();
  try{if(typeof claude==='undefined'||!claude||typeof claude.use!=='function'){GAL.st='off';return galRefresh()}
    const[db,user]=await Promise.all([claude.use('db'),claude.use('user')]);if(!db){GAL.st='off';return galRefresh()}
    GAL.db=db;GAL.user=user;if(user){GAL.me=await user.id();GAL.owner=await user.isOwner();GAL.canWrite=await user.can('data.write')}
    GAL.timer=setTimeout(()=>{if(GAL.st==='loading'){GAL.st='slow';galRefresh()}},10000);
    db.collection('gallery').onSnapshot(s=>{GAL.shelves=s.docs.filter(d=>d.exists).map(d=>({uid:d.id,data:d.data()||{}}));if(!s.metadata.fromCache){clearTimeout(GAL.timer);GAL.st='ready'}else if(GAL.st==='loading')GAL.st='ready';GAL.stale=s.metadata.fromCache;galRefresh()},e=>{clearTimeout(GAL.timer);GAL.st='err';GAL.err=e&&e.code;galRefresh()});
    db.collection('fans').onSnapshot(s=>{GAL.fans=s.docs.filter(d=>d.exists).map(d=>({uid:d.id,data:d.data()||{}}));galRefresh()},()=>{})}
  catch(e){GAL.st='err';galRefresh()}}
function galRefresh(){if(ED.scr==='lib'&&ED.libTab==='gal'){const l=$('#galList');if(l&&GAL.st==='ready')galRenderList();else renderLib()}if(GAL.open&&!$('#galBox').hidden)galDetail(GAL.open)}
const galWrite=(fn)=>{GAL.writing=GAL.writing.then(fn,fn);return GAL.writing};
function galShelf(){const s=GAL.shelves.find(x=>x.uid===GAL.me);return s?clone(s.data):{items:[]}}
function galFans(){const f=GAL.fans.find(x=>x.uid===GAL.me);const d=f?clone(f.data):{};return{likes:Array.isArray(d.likes)?d.likes.filter(k=>typeof k==='string'):[],uses:Array.isArray(d.uses)?d.uses.filter(k=>typeof k==='string'):[]}}
function galErr(e){const c=e&&e.code;toast(c==='quota_exceeded'?'พื้นที่แกลเลอรีเต็ม ลบผลงานเก่าก่อน':c==='invalid_argument'?'บัญชีนี้เขียนแกลเลอรีไม่ได้ (ต้องมีสิทธิ์ Contributor ขึ้นไป)':'บันทึกไม่สำเร็จ ลองอีกครั้ง','bad');if(c==='invalid_argument')GAL.canWrite=false}
/* --- thumbnails rendered from the real content --- */
function brightScore(g,w,h){const d=g.getImageData(0,0,w,h).data;let n=0;for(let i=0;i<d.length;i+=16){const m=Math.max(d[i],d[i+1],d[i+2]),mn=Math.min(d[i],d[i+1],d[i+2]);if(m>170&&m-mn>60)n++}return n}
function thumbSkill(s){const w=makeWorld({arena:PREV_ARENA,char:clone(activeChar()),skills:[clone(s)],mode:'preview'});const c=document.createElement('canvas');c.width=256;c.height=96;const g=c.getContext('2d');let best='',bs=-1;
  for(let i=0;i<110;i++){step(w,1/60);if(i>=8&&i%5===0){render(g,w,256,96);const sc=brightScore(g,256,96);if(sc>bs){bs=sc;best=c.toDataURL('image/png')}}}return best}
function thumbStudio(doc){const c=document.createElement('canvas');c.width=256;c.height=144;const g=c.getContext('2d');let best='',bs=-1;
  for(const f of[.15,.3,.45,.6,.8]){const t=doc.duration*f;g.setTransform(1,0,0,1,0,0);g.globalAlpha=1;g.globalCompositeOperation='source-over';g.fillStyle='#100b22';g.fillRect(0,0,256,144);g.fillStyle='#2b2450';g.fillRect(0,SCN.caster.y,256,32);g.fillStyle='#4fe3d6';g.fillRect(0,SCN.caster.y,256,1);
    drawHero(g,activeChar(),SCN.caster.x,SCN.caster.y,1,'attack',0,false);drawFoe(g,{type:'dummy',x:SCN.dummy.x,y:SCN.dummy.y,face:-1,hurtT:0,h:22,hp:1,maxhp:1,dummy:true},0);
    for(let i=doc.layers.length-1;i>=0;i--){const L=doc.layers[i];if(!L.visible)continue;const a=anchorPos(L.p.anchor,f);drawFxLayer(g,L,layerAt(doc,L,t),t,a.x,a.y)}g.globalCompositeOperation='source-over';g.globalAlpha=1;
    const sc=brightScore(g,256,144);if(sc>bs){bs=sc;best=c.toDataURL('image/png')}}return best}
function thumbChar(ch){const c=document.createElement('canvas');c.width=96;c.height=80;const g=c.getContext('2d');g.fillStyle='#17122e';g.fillRect(0,0,96,80);g.fillStyle='#2b2450';g.fillRect(16,66,64,14);g.fillStyle='#4fe3d6';g.fillRect(16,66,64,2);drawHero(g,ch,48,66,1,'idle',0,false,3);return c.toDataURL('image/png')}
function thumbArena(a){const big=document.createElement('canvas');big.width=480;big.height=192;const g=big.getContext('2d');g.fillStyle='#120d26';g.fillRect(0,0,480,192);
  for(let y=0;y<12;y++)for(let x=0;x<30;x++){const t=+a.tiles[y*30+x];if(t)drawTile(g,t,x*T,y*T,y===0||+a.tiles[(y-1)*30+x]!==1)}
  for(const o of a.objs){if(o.t==='player')drawHero(g,activeChar(),o.x*T+8,(o.y+1)*T,1,'idle',0,false);else drawFoe(g,{type:o.t,x:o.x*T+8,y:(o.y+1)*T,face:-1,hurtT:0,st:0,swing:0,onGround:true,t:0,hp:1,maxhp:1,h:FOES[o.t].h,boss:o.t==='boss',dummy:o.t==='dummy'},0)}
  const c=document.createElement('canvas');c.width=240;c.height=96;const h=c.getContext('2d');h.imageSmoothingEnabled=false;h.drawImage(big,0,0,240,96);return c.toDataURL('image/png')}
function thumbAI(ai){const c=document.createElement('canvas');c.width=160;c.height=72;const g=c.getContext('2d');g.fillStyle='#123a44';g.fillRect(0,0,160,72);g.fillStyle='#4fe3d6';g.font='700 22px Silkscreen, monospace';g.fillText('AI',12,32);g.font='500 13px Mitr, sans-serif';g.fillStyle='#e6fffb';g.fillText(STYLES[ai.style].n,12,56);
  ai.rules.slice(0,6).forEach((r,i)=>{g.fillStyle=['#ff8a3d','#d36bff','#ffd34d'][r.slot];g.fillRect(96,10+i*9,40+r.slot*8,6)});return c.toDataURL('image/png')}
function galThumbFor(k,d){try{if(k==='skill')return d.studio?thumbStudio(d.studio.doc):thumbSkill(d);if(k==='studio')return thumbStudio(d);if(k==='char')return thumbChar(d);if(k==='arena')return thumbArena(d);return thumbAI(d)}catch(e){return''}}
/* --- publish --- */
function galPrepare(kind,obj,deps,src){if(GAL.st!=='ready')return toast(GAL.st==='off'?'แกลเลอรีใช้ได้เมื่อเปิดเกมผ่านลิงก์ของ Claude และเข้าสู่ระบบ':'แกลเลอรียังโหลดไม่เสร็จ','bad');
  if(!GAL.me||GAL.canWrite===false)return toast('บัญชีนี้ดูแกลเลอรีได้อย่างเดียว ขอสิทธิ์ Contributor จากเจ้าของเกมเพื่อเผยแพร่','bad');
  const pl={f:'pfs',v:1,k:kind,d:clone(obj),...(deps&&deps.length?{deps:clone(deps)}:{})};const p=validateShare(pl);if(!p)return toast('ผลงานนี้มีข้อมูลไม่ถูกต้อง','bad');

  $('#pubName').value=(exist&&exist.name)||obj.name||'';$('#pubDesc').value=(exist&&exist.desc)||'';$('#pubGo').textContent=exist?'อัปเดตในแกลเลอรี':'เผยแพร่';$('#pubBox').hidden=false}
async function galPublish(){const P=GAL.pub;if(!P)return;const name=$('#pubName').value.trim().slice(0,40)||P.name||'ไม่มีชื่อ',desc=$('#pubDesc').value.trim().slice(0,140);
  const shelf=galShelf();shelf.items=(Array.isArray(shelf.items)?shelf.items:[]).filter(x=>x&&typeof x.id==='string');const old=shelf.items.find(x=>x.src===P.src);
  const it={id:old?old.id:sid('g'),src:P.src,k:P.kind,name,desc,thumb:P.thumb,pl:P.pl,at:Date.now()};
  if(old)shelf.items=shelf.items.map(x=>x===old?it:x);else{if(shelf.items.length>=GAL_MAX_ITEMS)return toast('ชั้นวางของคุณเต็ม '+GAL_MAX_ITEMS+' ชิ้น ลบผลงานเก่าในแกลเลอรีก่อน','bad');shelf.items.unshift(it)}
  shelf.at=Date.now();const size=JSON.stringify(shelf).length;if(size>GAL_MAX_BYTES)return toast('ชั้นวางของคุณเต็มพื้นที่แล้ว ('+Math.round(size/1024)+' KB) ลบผลงานเก่าก่อน','bad');
  $('#pubGo').disabled=true;try{await galWrite(()=>GAL.db.doc('gallery/'+GAL.me).set(shelf));$('#pubBox').hidden=true;toast(old?'อัปเดตในแกลเลอรีแล้ว':'เผยแพร่แล้ว ทุกคนที่เปิดเกมนี้เห็นผลงานของคุณ','gold')}catch(e){galErr(e)}finally{$('#pubGo').disabled=false}}
function galPublishItem(k,id){if(k==='skills'){const s=getSkill(id);if(s)galPrepare('skill',s,null,'skill:'+id)}else if(k==='chars'){const c=getChar(id);if(c)galPrepare('char',c,c.skills.map(x=>x&&getSkill(x)).filter(Boolean),'char:'+id)}
  else if(k==='arenas'){const a=getArena(id);if(a)galPrepare('arena',a,null,'arena:'+id)}else{const a=getAI(id);if(a)galPrepare('ai',a,null,'ai:'+id)}}

async function galDelete(it){const mine=it.uid===GAL.me;if(!mine&&!GAL.owner)return;$('#galBox').hidden=true;GAL.open=null;

/* --- UI --- */
function galFiltered(){const{likes,uses}=galCounts(),q=GAL.q.trim().toLowerCase();let its=galItems();
  if(GAL.k!=='all')its=its.filter(x=>x.k===GAL.k);if(GAL.mine)its=its.filter(x=>x.uid===GAL.me);if(q)its=its.filter(x=>(x.name+' '+x.desc+' '+SHK[x.k]+' '+(GAL.names[x.uid]||'')).toLowerCase().includes(q));

async function galNames(ids){if(!GAL.user||!ids.length)return;const need=ids.filter(id=>!(id in GAL.names));if(!need.length)return;try{const ps=await GAL.user.profiles(ids);let ch=false;for(const id of ids){const n=ps[id]&&ps[id].name||'';if(GAL.names[id]!==n){GAL.names[id]=n;ch=true}}

/* --- progress store --- */
let LP;
function lpLoad(){let r=null;try{r=JSON.parse(localStorage.getItem(LKEY)||'null')}catch(e){}

function closeHelp(){const h=$('#help');if(h)h.hidden=true}

  return q?(list.length?list.map(t=>`<div class="hli"><span>${esc(t.n)}<small>${esc(t.w)} · ${esc(t.b)}</small></span><div class="btns"><button class="btn sm pri" data-act="helpShow" data-i="${TOOLIDX.indexOf(t)}">พาไปดู</button></div></div>`).join(''):'<p class="muted">ไม่พบเครื่องมือนี้ ลองคำอื่น เช่น "สกิล" "สำรอง" "ศัตรู"</p>'):'<p class="muted">พิมพ์ชื่อเครื่องมือหรือสิ่งที่อยากทำ เช่น "เปลี่ยนสี" "ย้าย" "จำลอง"</p>'}

  $('#help').innerHTML=`<div class="hp" role="dialog" aria-modal="true" aria-label="ความช่วยเหลือ"><div class="hp-h"><b>ช่วยเหลือ · ${CTXN[c]||''}</b><button class="btn sm" data-act="helpClose">ปิด</button></div><div class="hp-b">
