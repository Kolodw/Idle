<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>[hidden]{display:none!important}body{margin:0}</style></head><body><title>PIXEL FORGE</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mitr:wght@300;400;500;600&family=Silkscreen:wght@400;700&display=swap">
<style>
/* Layout: phone app shell — top bar, one scrolling screen, bottom tab bar; battles open as a full-screen arcade overlay. One deliberate dark "night forge" look. */
:root{
  --ink:#0d0a18;--panel:#17122e;--panel2:#221a44;--line:#3a3068;--ember:#ff8a3d;--ember2:#ffc35a;--rune:#4fe3d6;
  --text:#f1ecff;--dim:#a79dcf;--bad:#ff5c7a;--good:#6dffa8;--shadow:#06040d;
  --f-body:'Mitr',system-ui,'Noto Sans Thai',sans-serif;--f-px:'Silkscreen','Mitr',ui-monospace,monospace;
  color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--ink);color:var(--text);font-family:var(--f-body);font-size:15px;line-height:1.55;overflow:hidden;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
#app{height:100%;display:flex;flex-direction:column}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--panel);box-shadow:0 2px 0 var(--line);position:relative;z-index:2}
.logo{font-family:var(--f-px);font-weight:700;font-size:17px;letter-spacing:.06em}
.logo span,.logo-big span{color:var(--ember)}
#scrTitle{font-weight:500;color:var(--rune);font-size:15px}
main{flex:1;overflow-y:auto;overflow-x:hidden;padding-block:16px 32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.scr{max-width:880px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.tabs{display:grid;grid-template-columns:repeat(6,1fr);background:var(--panel);box-shadow:0 -2px 0 var(--line);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.tabs button{background:none;border:0;padding:10px 2px 9px;font-size:12px;color:var(--dim);display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;min-width:0}
.tabs button::before{content:"";width:8px;height:8px;background:var(--line)}
.tabs button.on{color:var(--text)}
.tabs button.on::before{background:var(--ember);box-shadow:0 0 0 2px #ff8a3d55}
.btn{background:var(--panel2);border:0;padding:10px 16px;min-height:44px;font-weight:500;cursor:pointer;box-shadow:0 0 0 2px var(--line),inset 0 -3px 0 #0006;transition:transform .08s}
.btn:active{transform:translateY(2px)}
.btn:focus-visible,.chip:focus-visible,.opt:focus-visible,.tabs button:focus-visible{outline:2px solid var(--rune);outline-offset:3px}
.btn.pri{background:var(--ember);color:#2a1206;box-shadow:0 0 0 2px #ffb27a,inset 0 -3px 0 #a3420d}
.btn.danger{background:#5a1830;box-shadow:0 0 0 2px var(--bad),inset 0 -3px 0 #0006}
.btn.sm{min-height:38px;padding:6px 12px;font-size:14px}
.btn.big{min-height:56px;font-size:17px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.card{background:var(--panel);box-shadow:0 0 0 2px var(--line),5px 5px 0 0 var(--shadow);padding:14px}
.sec{font-size:16px;font-weight:600;margin:6px 0 0;display:flex;align-items:center;gap:8px;flex-wrap:wrap;text-wrap:balance}
.sec::before{content:"";width:8px;height:8px;background:var(--ember);flex:none}
.sec em{font-style:normal;font-weight:400;font-size:12px;color:var(--rune);padding:1px 8px;box-shadow:0 0 0 1px var(--rune)}
.muted{color:var(--dim);font-size:13px}
.toolbar{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
.fld{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--dim);min-width:0}
.fld.grow{flex:1 1 180px}
.fld input,.fld select,select,textarea{background:#0f0b22;border:0;box-shadow:0 0 0 2px var(--line);padding:9px 10px;min-height:42px;color:var(--text);font-size:15px;width:100%}
textarea{min-height:120px;font-family:ui-monospace,monospace;font-size:12px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:#0f0b22;border:0;box-shadow:0 0 0 2px var(--line);padding:7px 12px;min-height:38px;cursor:pointer;font-size:14px}
.chip.on{box-shadow:0 0 0 2px var(--rune);background:#123a44;color:#e7fffc}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.opt{text-align:left;background:#0f0b22;border:0;box-shadow:0 0 0 2px var(--line);padding:10px 12px;cursor:pointer;display:flex;flex-direction:column;gap:2px;min-width:0}
.opt b{font-weight:600}
.opt small{color:var(--dim);font-size:12px;line-height:1.4}
.opt.on{box-shadow:0 0 0 2px var(--ember);background:#2a1a2a}
.opt .dot{width:12px;height:12px;display:inline-block;margin-right:6px;vertical-align:-1px}
canvas{image-rendering:pixelated;image-rendering:crisp-edges}
/* home */
.hero{display:grid;grid-template-columns:minmax(0,1fr);gap:8px;background:radial-gradient(120% 90% at 50% 100%,#3a1d3a 0,var(--panel) 60%);box-shadow:0 0 0 2px var(--line),5px 5px 0 var(--shadow);padding:16px}
.hero canvas{width:100%;max-width:420px;justify-self:center;aspect-ratio:160/84}
.logo-big{font-family:var(--f-px);font-weight:700;font-size:clamp(34px,10vw,58px);line-height:.95;letter-spacing:.04em;margin:4px 0 6px;text-shadow:3px 3px 0 #3a1408}
.lede{margin:0;color:var(--dim);max-width:46ch}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.quick .big{grid-column:span 1}
.who{display:flex;gap:14px;align-items:center}
.who img{width:72px;height:auto;image-rendering:pixelated;flex:none;background:#0f0b22;box-shadow:0 0 0 2px var(--line)}
.who>div{min-width:0}
.unl{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.unl li{display:flex;gap:10px;align-items:center;background:var(--panel);box-shadow:0 0 0 2px var(--line);padding:10px 12px}
.unl li i{width:14px;height:14px;flex:none;background:var(--line)}
.unl li.got i{background:var(--good)}
.unl li div{min-width:0}
.statg{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.stat{background:var(--panel);box-shadow:0 0 0 2px var(--line);padding:10px 12px}
.stat b{display:block;font-family:var(--f-px);font-size:22px;color:var(--ember2);font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--dim)}
/* creator */
.cgrid{display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
@media (min-width:760px){.cgrid{grid-template-columns:260px minmax(0,1fr)}.pvwrap{position:sticky;top:0;align-self:start}}
.pv{display:flex;flex-direction:column;gap:10px;align-items:center}
.pv canvas{width:200px;aspect-ratio:40/34;background:#0f0b22}
.form{display:flex;flex-direction:column;gap:12px;min-width:0}
.steps{display:grid;gap:8px}
.step{display:grid;grid-template-columns:96px 44px minmax(0,1fr) 44px;gap:8px;align-items:center}
.step span{font-size:13px;color:var(--dim)}
.step output{text-align:center;background:#0f0b22;box-shadow:0 0 0 2px var(--line);padding:8px 4px;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.step .btn{padding:0;min-height:40px}
.crow{display:grid;grid-template-columns:52px minmax(0,1fr) 44px;gap:8px;align-items:center}
.crow>span{font-size:13px;color:var(--dim)}
.sw{display:flex;flex-wrap:wrap;gap:5px}
.swb{width:22px;height:22px;border:0;background:var(--c);box-shadow:0 0 0 1px #0008;cursor:pointer;padding:0}
.swb.on{box-shadow:0 0 0 2px var(--text),0 0 0 4px var(--ink)}
input[type=color]{width:44px;height:38px;border:0;background:none;padding:0;cursor:pointer}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}
.kv div{background:#0f0b22;box-shadow:0 0 0 2px var(--line);padding:8px 10px;font-size:12px;color:var(--dim)}
.kv b{display:block;font-size:17px;color:var(--text);font-variant-numeric:tabular-nums}
.slots{display:grid;gap:8px}
.slots label{display:grid;grid-template-columns:60px minmax(0,1fr);gap:8px;align-items:center;font-size:13px;color:var(--dim)}
.savebar{position:sticky;bottom:-32px;margin:0 -4px;padding:10px 4px 14px;background:linear-gradient(transparent,var(--ink) 30%);display:flex;gap:10px;flex-wrap:wrap;align-items:center;z-index:3}
.savebar .grow{flex:1 1 100%;font-size:13px;color:var(--ember2)}.savebar .grow:empty{display:none}.savebar .btn{flex:1 1 auto}
/* skill */
.spv canvas{width:100%;aspect-ratio:256/96;background:#0f0b22;display:block}
.sline{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:13px;color:var(--dim)}
.sline b{color:var(--text);font-variant-numeric:tabular-nums}
.desc{margin:8px 0 0;font-size:13px;color:var(--rune)}
.sl{display:grid;grid-template-columns:110px minmax(0,1fr) 28px;gap:10px;align-items:center;font-size:13px;color:var(--dim)}
.sl output{font-family:var(--f-px);color:var(--text);text-align:right}
input[type=range]{width:100%;accent-color:var(--ember);min-height:32px}
.budget{display:flex;flex-direction:column;gap:6px}
.bm{height:12px;background:#0f0b22;box-shadow:0 0 0 2px var(--line);position:relative}
.bm i{position:absolute;inset:0 auto 0 0;background:var(--rune)}
.budget.over .bm i{background:var(--bad)}
.budget.over b{color:var(--bad)}
/* fight */
.seg{display:grid;grid-template-columns:1fr 1fr;gap:0;box-shadow:0 0 0 2px var(--line)}
.seg button{background:#0f0b22;border:0;padding:12px 8px;min-height:48px;cursor:pointer;font-weight:500;color:var(--dim)}
.seg button.on{background:var(--ember);color:#2a1206}
.load{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.load span{font-size:12px;padding:3px 8px;background:#0f0b22;box-shadow:0 0 0 1px var(--line)}
.help{font-size:13px;color:var(--dim);margin:0}
.help kbd{font-family:var(--f-px);font-size:11px;padding:1px 5px;box-shadow:0 0 0 1px var(--line);color:var(--text)}
.rules{display:grid;gap:8px}
.rule{display:grid;grid-template-columns:28px minmax(0,1fr) minmax(0,1fr);gap:6px;align-items:center}
.rule .ctl{grid-column:2/4;display:flex;gap:6px;justify-content:flex-end}
.rule .n{font-family:var(--f-px);color:var(--ember2);text-align:center}
.rule select{min-height:40px;font-size:13px;padding:6px}
@media (min-width:620px){.rule{grid-template-columns:28px minmax(0,1fr) minmax(0,1fr) auto}.rule .ctl{grid-column:auto}}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px;min-width:520px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap;font-variant-numeric:tabular-nums}
th{color:var(--dim);font-weight:400}
.w{color:var(--good)}.l{color:var(--bad)}
.skbar{display:grid;grid-template-columns:minmax(0,130px) minmax(0,1fr) auto;gap:8px;align-items:center;font-size:13px}
.skbar span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.skbar div{height:10px;background:#0f0b22}
.skbar div i{display:block;height:100%;background:var(--ember)}
/* sandbox */
.tools{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.tools .chip{display:flex;align-items:center;gap:6px;justify-content:flex-start}
.tools .chip i{width:12px;height:12px;flex:none;background:var(--tc)}
.edwrap{overflow-x:auto;box-shadow:0 0 0 2px var(--line);background:#120d26}
#sandCv{display:block;width:720px;max-width:none;aspect-ratio:480/192;cursor:crosshair;touch-action:pan-x pan-y}
@media (min-width:900px){#sandCv{width:100%}}
.selp{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
/* library */
.list{display:grid;gap:10px}
.item{display:grid;grid-template-columns:56px minmax(0,1fr);gap:12px;align-items:center;background:var(--panel);box-shadow:0 0 0 2px var(--line);padding:10px}
.item img,.item .ic{width:56px;height:56px;background:#0f0b22;image-rendering:pixelated;box-shadow:0 0 0 1px var(--line)}
.item .ic{display:grid;place-items:center}
.item .ic i{width:22px;height:22px;background:var(--c);box-shadow:0 0 12px var(--c)}
.item b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .acts2{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px}
.badge{font-size:11px;color:#2a1206;background:var(--ember2);padding:1px 6px;margin-left:6px}
.toggle{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:6px 0}
/* modal / toast */
#modal{position:fixed;inset:0;z-index:230;background:#07050fcc;display:grid;place-items:center;padding:16px}
.mbox{background:var(--panel);box-shadow:0 0 0 2px var(--ember),6px 6px 0 var(--shadow);padding:18px;max-width:380px;width:100%;display:flex;flex-direction:column;gap:14px}
.mbox p{margin:0}
.mrow{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;z-index:95;background:var(--panel2);box-shadow:0 0 0 2px var(--rune);padding:10px 16px;max-width:min(92vw,420px);pointer-events:none;transition:.2s;font-size:14px;z-index:240}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast.bad{box-shadow:0 0 0 2px var(--bad)}
#toast.gold{box-shadow:0 0 0 2px var(--ember2);color:var(--ember2)}
/* game */
#game{position:fixed;inset:0;z-index:50;background:#07050f;display:flex;flex-direction:column;gap:8px;padding-top:max(8px,env(safe-area-inset-top,0px));padding-bottom:max(8px,env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));user-select:none;-webkit-user-select:none}
.g-top{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.g-top .grow{flex:1;font-size:13px;color:var(--dim);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.g-body{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1.4fr;grid-template-rows:auto 1fr;grid-template-areas:"stage stage" "dpad acts";gap:12px}
.g-stage{grid-area:stage;position:relative;width:100%;max-width:min(960px,calc((100dvh - 300px) * 1.6667));min-width:min(100%,300px);justify-self:center}
.g-stage canvas{display:block;width:100%;aspect-ratio:320/192;background:#120d26}
.hud{position:absolute;left:6px;right:6px;top:6px;display:flex;justify-content:space-between;gap:8px;pointer-events:none;font-size:11px;line-height:1.2}
.bars{display:grid;gap:3px;width:min(46%,220px)}
.bar{position:relative;height:13px;background:#000a;box-shadow:0 0 0 1px #0008}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--bad)}
.bar.mp i{background:#5aa8ff}
.bar span{position:relative;padding-left:4px;font-size:10px;text-shadow:1px 1px 0 #000}
.hudr{text-align:right;text-shadow:1px 1px 0 #000;font-size:11px}
#bossBar{position:absolute;left:15%;right:15%;bottom:6px;pointer-events:none}
#bossBar .bar{height:10px}
#bossBar .bar i{background:#d36bff}
#bossBar p{margin:0 0 2px;font-size:10px;text-align:center;text-shadow:1px 1px 0 #000}
.banner{position:absolute;left:0;right:0;top:36%;text-align:center;font-weight:600;font-size:clamp(16px,4vw,26px);color:var(--ember2);text-shadow:2px 2px 0 #000;pointer-events:none;animation:ban 2.2s forwards}
@keyframes ban{0%{opacity:0;transform:scale(.8)}12%{opacity:1;transform:scale(1)}80%{opacity:1}100%{opacity:0}}
.dpad{grid-area:dpad;display:grid;grid-template-columns:1fr 1fr;gap:10px;align-content:end}
.acts{grid-area:acts;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;align-content:end}
.pb{border:0;background:#1c1638;box-shadow:0 0 0 2px var(--line),inset 0 -4px 0 #0008;min-height:64px;font-size:15px;font-weight:500;touch-action:none;cursor:pointer;color:var(--text)}
.pb.held{background:#3a2f66;transform:translateY(2px)}
.dpad .pb{min-height:80px;font-size:26px}
.pb.atk{grid-column:span 2;background:#4a1f12;box-shadow:0 0 0 2px var(--ember),inset 0 -4px 0 #0008}
.pb.jmp{background:#123a44;box-shadow:0 0 0 2px var(--rune),inset 0 -4px 0 #0008}
.pb.sk{font-size:12px;line-height:1.25;padding:4px;min-height:56px;overflow:hidden;background:linear-gradient(to top,#000b calc(var(--cd,0)*100%),transparent 0),var(--skc,#1c1638)}
.pb.sk small{display:block;font-family:var(--f-px);font-size:11px;color:var(--ember2)}
.pb.sk:disabled{opacity:.35}
.khelp{display:none;grid-column:1/-1;text-align:center}
@media (hover:hover) and (pointer:fine){.dpad,.acts{display:none}.g-body{grid-template-areas:"stage stage" "help help"}.khelp{display:block;grid-area:help}.g-stage{max-width:min(960px,calc((100dvh - 150px) * 1.6667))}}
@media (orientation:landscape) and (max-height:560px){.g-body{grid-template-columns:minmax(110px,.8fr) minmax(0,3fr) minmax(150px,1.1fr);grid-template-rows:1fr;grid-template-areas:"dpad stage acts"}.g-stage{max-width:calc((100dvh - 80px) * 1.6667);align-self:center}.dpad .pb{min-height:70px}.pb{min-height:48px}}
#game.auto .dpad,#game.auto .acts,#game.auto .khelp{display:none}
#game.auto .g-body{grid-template-areas:"stage stage" "info info"}
.ainfo{grid-area:info;display:none}
#game.auto .ainfo{display:block}
.g-ov{position:absolute;inset:0;z-index:5;background:#07050fe6;display:grid;place-items:center;overflow:auto;padding:16px}
.endbox{width:min(460px,100%);background:var(--panel);box-shadow:0 0 0 2px var(--line),6px 6px 0 var(--shadow);padding:18px;display:flex;flex-direction:column;gap:12px}
.endbox h2{margin:0;font-size:30px;font-weight:600}
.endbox h2.win{color:var(--good)}.endbox h2.lose{color:var(--bad)}
.endbox p{margin:0;color:var(--dim)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.spd{display:flex;gap:6px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}.banner{animation-duration:.01s}}
/* ---------- Skill Studio (editor shell) ---------- */
#studio{position:fixed;inset:0;z-index:60;background:var(--ink);display:flex;flex-direction:column;gap:8px;padding-top:max(8px,env(safe-area-inset-top,0px));padding-bottom:max(8px,env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.st-bar{display:flex;gap:10px;align-items:center;min-width:0}
.st-t{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.3}
.st-t b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.st-t span{font-size:12px;color:var(--good)}
.st-t span.warn{color:var(--ember2)}.st-t span.err{color:var(--bad)}
.st-tag{font-family:var(--f-px);font-size:11px;color:var(--rune);box-shadow:0 0 0 1px var(--rune);padding:2px 6px;white-space:nowrap}
.st-acts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.st-acts .btn{min-height:40px;padding:4px 6px;font-size:14px}
.st-menu{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));box-shadow:0 0 0 2px var(--line)}
.st-menu button{background:#0f0b22;border:0;min-height:40px;font-size:13px;color:var(--dim);cursor:pointer;padding:0 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st-menu button.on{background:var(--panel2);color:var(--text);box-shadow:inset 0 -3px 0 var(--ember)}
.st-main{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px;position:relative}
.st-view{position:relative;flex:1;min-height:150px;background:#07050f;box-shadow:0 0 0 2px var(--line);display:grid;place-items:center;overflow:hidden}
#studio.mob.haspanel .st-view{flex:0 0 auto;width:100%;aspect-ratio:16/9;max-height:31vh;min-height:140px}
#studio.mob.full .st-view{display:none}
#stCv{display:block;touch-action:none;image-rendering:pixelated;cursor:grab;background:#100b22}
.vp-hud{position:absolute;left:8px;top:6px;right:8px;font-size:11px;color:var(--dim);pointer-events:none;text-shadow:1px 1px 0 #000;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vp-tools{position:absolute;right:6px;bottom:6px;display:flex;gap:6px}
.vp-tools button{min-width:42px;min-height:38px;background:#0f0b22d9;border:0;box-shadow:0 0 0 1px var(--line);font-size:13px;cursor:pointer;color:var(--text)}
.st-pane{display:none;flex-direction:column;min-height:0;min-width:0;overflow:hidden;background:var(--panel);box-shadow:0 0 0 2px var(--line)}
#studio.mob[data-panel="layers"] [data-pane="layers"],#studio.mob[data-panel="time"] [data-pane="time"],#studio.mob[data-panel="graph"] [data-pane="graph"],#studio.mob[data-panel="insp"] [data-pane="insp"]{display:flex;flex:1}
.pane-h{display:flex;align-items:center;gap:8px;padding:6px 8px 6px 12px;border-bottom:1px solid var(--line);min-height:46px}
.pane-h b{font-size:14px;font-weight:600}
.pane-h .grow{flex:1}
.pane-b{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:10px 12px;overscroll-behavior:contain}
.ptabs{display:flex;gap:0;box-shadow:0 0 0 1px var(--line)}
.ptabs button{background:#0f0b22;border:0;padding:6px 12px;min-height:34px;cursor:pointer;color:var(--dim);font-size:13px}
.ptabs button.on{background:var(--panel2);color:var(--text);box-shadow:inset 0 -2px 0 var(--ember)}
.st-dock{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.st-dock button{min-height:48px;background:#0f0b22;border:0;box-shadow:0 0 0 2px var(--line);cursor:pointer;font-size:13px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.2;color:var(--text)}
.st-dock button small{font-family:var(--f-px);font-size:10px;color:var(--dim)}
.st-dock button.on{box-shadow:0 0 0 2px var(--ember);background:#2a1a2a}
.selbar{flex:none;display:flex;gap:8px;align-items:center;padding:6px 12px;border-top:1px solid var(--line);font-size:12px;color:var(--dim);min-height:46px}
.selbar .grow{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.selbar b{color:var(--text);font-weight:500}
#studio.adv .selbar{display:none}
#studio.adv .st-dock{display:none}
#studio.adv .st-main{display:grid;grid-template-columns:310px minmax(0,1fr) 320px;grid-template-rows:minmax(0,1fr) minmax(280px,46%);grid-template-areas:"layers view insp" "bottom bottom insp"}
#studio.adv .st-view{grid-area:view}
#studio.adv [data-pane="layers"]{display:flex;grid-area:layers}
#studio.adv [data-pane="insp"]{display:flex;grid-area:insp}
#studio.adv[data-bottom="time"] [data-pane="time"],#studio.adv[data-bottom="graph"] [data-pane="graph"]{display:flex;grid-area:bottom}
#studio.adv .st-acts{grid-template-columns:repeat(4,minmax(110px,max-content));justify-content:end}
.st-sheet{position:absolute;left:max(16px,env(safe-area-inset-left,0px));width:min(420px,calc(100% - 32px));z-index:30;background:var(--panel);box-shadow:0 0 0 2px var(--ember),6px 6px 0 var(--shadow);max-height:62vh;overflow:auto;padding:6px;display:flex;flex-direction:column;gap:2px;overscroll-behavior:contain}
.mi{display:flex;flex-direction:column;align-items:flex-start;text-align:left;background:none;border:0;padding:9px 12px;min-height:46px;cursor:pointer;color:var(--text);gap:1px}
.mi:hover,.mi:focus-visible{background:var(--panel2);outline:none}
.mi small{color:var(--dim);font-size:12px;line-height:1.35}
.mi:disabled{opacity:.4;cursor:not-allowed}
.mi.cur{box-shadow:inset 3px 0 0 var(--rune)}
.ms{font-size:12px;color:var(--rune);padding:8px 12px 2px}
.minfo{font-size:12px;color:var(--ember2);padding:8px 12px;line-height:1.45}
.mdoc{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:6px;align-items:center;padding:6px 8px}
.mdoc span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}
.mdoc small{display:block;color:var(--dim);font-size:11px}
/* layers */
.addrow{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.addrow .chip{display:flex;align-items:center;gap:6px;font-size:13px;min-height:40px}
.addrow .chip i{width:10px;height:10px;flex:none}
.ly-list{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.ly{display:grid;grid-template-columns:minmax(0,1fr) repeat(4,40px);gap:4px;align-items:stretch;padding:4px;background:#0f0b22;box-shadow:0 0 0 1px var(--line)}
.ly.sel{box-shadow:0 0 0 2px var(--rune)}
.ly-main{display:flex;gap:8px;align-items:center;background:none;border:0;text-align:left;cursor:pointer;min-height:44px;padding:2px 6px;min-width:0;color:var(--text)}
.ly-main i{width:12px;height:12px;flex:none;box-shadow:0 0 0 1px #000}
.ly-main span{min-width:0;display:flex;flex-direction:column;line-height:1.3}
.ly-main b{font-weight:500;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ly-main small{font-size:11px;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ly.off .ly-main{opacity:.45}
.ib{min-height:40px;background:none;border:0;box-shadow:0 0 0 1px var(--line);cursor:pointer;display:grid;place-items:center;color:var(--dim);font-size:13px}
.ib[aria-pressed="true"]{color:var(--ember2);box-shadow:0 0 0 1px var(--ember2)}
.ib:disabled{opacity:.3;cursor:not-allowed}
/* timeline */
.tl-bar{display:flex;flex-wrap:nowrap;overflow-x:auto;gap:6px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line);flex:none}.tl-bar>*{flex:none}
.tl-bar .btn{min-height:38px}
.tl-time{font-family:var(--f-px);font-size:12px;color:var(--ember2);font-variant-numeric:tabular-nums;min-width:100px}
.tl{position:relative;--lw:108px}
.tl-r{display:grid;grid-template-columns:var(--lw) minmax(0,1fr);min-height:36px;border-bottom:1px solid #3a306866}
.tl-r.grp{background:#0f0b22}
.tl-lab{font-size:12px;padding:4px 8px;background:none;border:0;text-align:left;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer;min-height:36px}
.tl-r.grp .tl-lab{color:var(--text);font-weight:500}
.tl-r.sel .tl-lab{color:var(--rune);box-shadow:inset 3px 0 0 var(--rune)}
.tl-lane{position:relative;touch-action:pan-y;cursor:pointer}
.tl-in{position:absolute;top:0;bottom:0;left:12px;right:12px}
.tl-ruler{min-height:30px;position:sticky;top:0;z-index:2;background:var(--panel)}
.tl-ruler .tl-lane{touch-action:none;cursor:ew-resize}
.tk{position:absolute;top:0;bottom:0;width:1px;background:#3a3068aa}
.tk.big{background:var(--line)}
.tk b{position:absolute;top:3px;left:3px;font-size:9px;font-family:var(--f-px);color:var(--dim);font-weight:400}
.tl-win{position:absolute;top:13px;height:10px;background:var(--c);opacity:.45}
.kf{position:absolute;top:50%;width:32px;height:32px;margin:-16px 0 0 -16px;background:none;border:0;padding:0;cursor:pointer;display:grid;place-items:center;z-index:1}
.kf::before{content:"";width:11px;height:11px;background:var(--ember2);transform:rotate(45deg);box-shadow:0 0 0 1px #000}
.kf.hold::before{border-radius:0;background:#a79dcf}
.kf.sel::before{background:var(--rune);box-shadow:0 0 0 2px #fff}
.tl-ph{position:absolute;top:0;bottom:0;width:2px;background:var(--bad);pointer-events:none;z-index:3;left:calc(var(--lw) + 12px + (100% - var(--lw) - 24px) * var(--f,0))}
.tl-empty{font-size:12px;color:var(--dim);padding:8px 0;margin:0}
/* node graph */
.g-tools{display:flex;flex-wrap:nowrap;gap:6px;padding:6px 12px;border-bottom:1px solid var(--line);overflow-x:auto;flex:none}.g-tools .btn{flex:none}
.g-tools .btn{min-height:36px;padding:4px 10px;font-size:13px}
.g-stat{font-size:12px;padding:5px 12px;color:var(--dim);border-bottom:1px solid var(--line);line-height:1.4;flex:none;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.g-stat.err{color:var(--bad)}.g-stat.warn{color:var(--ember2)}.g-stat.pend{color:var(--rune);background:#4fe3d614}.g-stat.ok{color:var(--good)}
.gr-wrap{position:relative;flex:1;min-height:110px;overflow:hidden;touch-action:none;background:radial-gradient(#ffffff14 1px,transparent 1.5px) 0 0/20px 20px,#0b0819;cursor:grab}
.gr-world{position:absolute;left:0;top:0;transform-origin:0 0}
.gr-world svg{position:absolute;left:0;top:0;overflow:visible;width:1px;height:1px}
.ge{fill:none;stroke-width:2.5;pointer-events:none}.ge.exec{stroke:#e8e2ff}.ge.num{stroke:#ffd34d;stroke-dasharray:6 4}.ge.sel{stroke:var(--ember);stroke-width:4}
.ge-hit{fill:none;stroke:transparent;stroke-width:18;pointer-events:stroke;cursor:pointer}
.gn{position:absolute;width:156px;background:#1c1638;box-shadow:0 0 0 2px var(--line),4px 4px 0 #0009;font-size:12px;user-select:none;-webkit-user-select:none}
.gn.sel{box-shadow:0 0 0 2px var(--rune),4px 4px 0 #0009}
.gn.bad{box-shadow:0 0 0 2px var(--bad),4px 4px 0 #0009}
.gn.live{box-shadow:0 0 0 3px var(--good),0 0 16px #6dffa8aa}
.gn-h{height:28px;display:flex;align-items:center;gap:6px;padding:0 8px;background:var(--cc);color:#1a0f08;font-weight:600;white-space:nowrap;overflow:hidden;cursor:pointer}
.gn-h small{font-family:var(--f-px);font-weight:400;font-size:10px;opacity:.75}
.gn-r{height:26px;display:flex;justify-content:space-between;align-items:stretch}
.pt{display:flex;align-items:center;gap:6px;padding:0 6px;cursor:pointer;color:var(--dim);flex:1;min-width:0;white-space:nowrap;overflow:visible}
.pt.out{justify-content:flex-end;text-align:right}
.pt::before{content:"";width:11px;height:11px;flex:none;border-radius:50%;background:#0b0819;box-shadow:0 0 0 2px #e8e2ff;margin-left:-12px}
.pt.out::before{order:2;margin-left:0;margin-right:-12px}
.pt.num::before{border-radius:0;box-shadow:0 0 0 2px #ffd34d;transform:rotate(45deg) scale(.85)}
.pt.on::before{background:#e8e2ff}.pt.num.on::before{background:#ffd34d}
.pt.ok{color:var(--rune);background:#4fe3d626}.pt.snap{color:#fff;background:#4fe3d666}.pt.snap::before{transform:scale(1.5)}.pt.num.snap::before{transform:rotate(45deg) scale(1.3)}.ge.tmp{stroke-dasharray:5 5;opacity:.85}.ge.tmp.snap{stroke-dasharray:none;opacity:1}.gn.lift{box-shadow:0 0 0 2px var(--ember2),8px 8px 0 #000a;z-index:2}@media (pointer:coarse){.pt::before{width:13px;height:13px}.pt{padding:0 8px}}.pt.pend{color:var(--ember2);background:#ff8a3d33}
.gn-s{padding:3px 8px;font-size:11px;color:var(--rune);height:22px;line-height:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-top:1px solid #3a306899}
.g-log{flex:none;border-top:1px solid var(--line);font-size:11px;padding:4px 12px;color:var(--dim);max-height:110px;overflow:auto;display:flex;flex-direction:column;gap:2px}
.g-log .lg{display:flex;gap:8px}.g-log .lg i{font-style:normal;font-family:var(--f-px);color:var(--ember2);flex:none}.g-log .lg.bad{color:var(--bad)}
.g-log button{align-self:flex-start;background:none;border:0;color:var(--rune);padding:4px 0;cursor:pointer;font-size:12px}
/* inspector */
.ins{display:flex;flex-direction:column;gap:12px}
.ins h3{margin:0;font-size:16px;font-weight:600;overflow-wrap:anywhere}
.ins .grp{display:grid;gap:10px;padding-top:6px;border-top:1px solid var(--line)}
.ins .gl{font-size:12px;color:var(--rune)}
.ip{display:grid;gap:3px}
.ip>label{font-size:12px;color:var(--dim);display:flex;gap:6px;flex-wrap:wrap}
.ip>label em{font-style:normal;color:var(--ember2)}
.ipr{display:grid;grid-template-columns:minmax(0,1fr) 74px auto;gap:6px;align-items:center}
.ipr input[type=number]{background:#0f0b22;border:0;box-shadow:0 0 0 1px var(--line);padding:6px;min-height:38px;width:100%;color:var(--text);font-variant-numeric:tabular-nums}
.ipr input:disabled,.ins select:disabled,.ins input:disabled{opacity:.45}
.ipc{display:flex;gap:10px;align-items:center}
.kfb{min-width:38px;min-height:38px;background:#0f0b22;border:0;box-shadow:0 0 0 1px var(--line);color:var(--dim);cursor:pointer}
.kfb.on{color:var(--ember2);box-shadow:0 0 0 1px var(--ember2)}
.kfb:disabled{opacity:.3}
.ins .btns{display:flex;flex-wrap:wrap;gap:6px}
.ins .note{font-size:12px;color:var(--dim);margin:0}
.ins .warnp{font-size:12px;color:var(--ember2);margin:0}
.con{display:grid;gap:6px}
.con .cl{font-size:12px;color:var(--text)}
.con .ce{display:flex;justify-content:space-between;gap:8px;align-items:center;background:#0f0b22;padding:4px 4px 4px 8px;font-size:12px;color:var(--dim)}
.con select{min-height:40px;font-size:13px}
.klist{display:flex;flex-wrap:wrap;gap:6px}
.klist .chip{font-family:var(--f-px);font-size:11px}
/* ---------- Help button, tutorial overlay, Learning Center, help panel ---------- */
.top-r{display:flex;align-items:center;gap:10px;min-width:0}
.hbtn{display:flex;align-items:center;gap:6px;background:#0f0b22;border:0;box-shadow:0 0 0 2px var(--line);min-height:36px;padding:0 10px;cursor:pointer;color:var(--text);font-size:13px}
.hbtn b{font-family:var(--f-px);color:var(--ember2);font-size:15px}
.hbtn:focus-visible{outline:2px solid var(--rune);outline-offset:2px}
@media (max-width:420px){.hbtn span{display:none}}
#tut{position:fixed;inset:0;z-index:200;pointer-events:none}
.tut-dim{position:fixed;inset:0;background:#05030cb0;transition:opacity .2s}
#tut.free .tut-dim{background:#05030c33}
.tut-ring{position:fixed;border-radius:4px;box-shadow:0 0 0 3px var(--ember2),0 0 0 200vmax #05030ca8;transition:left .18s,top .18s,width .18s,height .18s;pointer-events:none}
#tut.free .tut-ring{box-shadow:0 0 0 3px var(--ember2),0 0 0 200vmax #05030c30}
.tut-ring::after{content:"";position:absolute;inset:-7px;border:2px solid var(--ember2);border-radius:6px;animation:tutPulse 1.4s ease-out infinite}
@keyframes tutPulse{0%{opacity:.9;transform:scale(1)}100%{opacity:0;transform:scale(1.06)}}
.tut-card{position:fixed;left:16px;top:16px;pointer-events:auto;width:min(360px,calc(100vw - 32px));max-height:min(54vh,440px);overflow:auto;background:var(--panel);box-shadow:0 0 0 2px var(--ember),6px 6px 0 var(--shadow);padding:12px 14px;display:flex;flex-direction:column;gap:7px;animation:tutIn .22s ease-out;overscroll-behavior:contain}
.tut-card.ok{box-shadow:0 0 0 2px var(--good),6px 6px 0 var(--shadow)}
@keyframes tutIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.tut-arrow{position:fixed;width:14px;height:14px;background:var(--panel);transform:rotate(45deg);pointer-events:none}
.tut-arrow.up{box-shadow:-2px -2px 0 var(--ember)}.tut-arrow.down{box-shadow:2px 2px 0 var(--ember)}
.tut-card.ok~.tut-arrow.up{box-shadow:-2px -2px 0 var(--good)}.tut-card.ok~.tut-arrow.down{box-shadow:2px 2px 0 var(--good)}
.tut-top{display:flex;justify-content:space-between;gap:8px;font-size:11px;color:var(--rune);align-items:center}
.tut-top span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tut-top b{font-family:var(--f-px);font-weight:400;color:var(--dim);flex:none}
.tut-bar{height:6px;background:#0f0b22;box-shadow:0 0 0 1px var(--line)}
.tut-bar i{display:block;height:100%;background:var(--ember);transition:width .25s}
.tut-card h3{margin:2px 0 0;font-size:16px;font-weight:600;text-wrap:balance}
.tut-card p{margin:0;font-size:14px;line-height:1.55;color:#ddd6f5}
.tut-task{display:flex;gap:8px;align-items:flex-start;background:#0f0b22;padding:7px 9px;box-shadow:inset 3px 0 0 var(--rune);font-size:13px!important}
.tut-task i{font-style:normal;flex:none;width:16px;height:16px;margin-top:2px;box-shadow:0 0 0 2px var(--rune)}
.tut-card.ok .tut-task{box-shadow:inset 3px 0 0 var(--good);color:var(--good)}
.tut-card.ok .tut-task i{background:var(--good);box-shadow:0 0 0 2px var(--good)}
.tut-hint{color:var(--ember2)!important;font-size:13px!important;animation:tutShake .35s}
@keyframes tutShake{0%,100%{transform:none}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.tut-btns{display:grid;grid-template-columns:auto auto 1fr;gap:6px;margin-top:2px}
.tut-btns .btn{min-height:40px;padding:4px 10px;font-size:14px}
.tut-x{position:absolute;right:8px;top:8px;background:none;border:0;color:var(--dim);font-size:12px;cursor:pointer;padding:4px 6px;min-height:28px}
.tut-card .tut-top{padding-right:36px}
/* Learning Center */
.lc-hero{display:grid;gap:12px;background:linear-gradient(135deg,#221a44,#17122e 60%);box-shadow:0 0 0 2px var(--line),5px 5px 0 var(--shadow);padding:16px}
.lc-hero h1{margin:0;font-size:22px;font-weight:600}
.lc-prog{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.lc-pct{font-family:var(--f-px);font-size:34px;color:var(--ember2);line-height:1;font-variant-numeric:tabular-nums}
.lc-bar{flex:1 1 160px;height:12px;background:#0f0b22;box-shadow:0 0 0 2px var(--line)}
.lc-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--ember),var(--ember2))}
.lc-meta{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--dim)}
.lc-meta b{color:var(--text);font-variant-numeric:tabular-nums}
.lc-resume{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:#0f0b22;padding:10px 12px;box-shadow:inset 3px 0 0 var(--rune)}
.lc-resume span{flex:1 1 180px;font-size:13px;color:var(--dim)}
.lc-resume b{color:var(--text)}
.ach{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.ach div{display:flex;gap:8px;align-items:center;background:var(--panel);box-shadow:0 0 0 2px var(--line);padding:8px 10px;font-size:12px;color:var(--dim);min-width:0}
.ach div i{width:26px;height:26px;flex:none;background:#0f0b22;box-shadow:0 0 0 2px var(--line);display:grid;place-items:center;font-style:normal;font-family:var(--f-px);font-size:11px}
.ach div.on{box-shadow:0 0 0 2px var(--ember2);color:var(--text)}
.ach div.on i{background:var(--ember2);color:#2a1206;box-shadow:0 0 0 2px #ffe3a6}
.ach b{display:block;font-weight:500;font-size:13px}
.lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.lcard{text-align:left;background:var(--panel);border:0;box-shadow:0 0 0 2px var(--line);padding:12px;cursor:pointer;display:flex;flex-direction:column;gap:6px;color:var(--text);min-width:0}
.lcard:hover{box-shadow:0 0 0 2px var(--rune)}
.lcard.done{box-shadow:0 0 0 2px #2e7a52}
.lcard b{font-weight:600;font-size:15px}
.lcard small{color:var(--dim);font-size:12px;line-height:1.45}
.lrow{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.pill{font-size:11px;padding:1px 8px;box-shadow:0 0 0 1px var(--line);color:var(--dim);white-space:nowrap}
.pill.l1{color:var(--good);box-shadow:0 0 0 1px #2e7a52}.pill.l2{color:var(--ember2);box-shadow:0 0 0 1px #8a6020}.pill.l3{color:var(--bad);box-shadow:0 0 0 1px #8a2a40}
.pill.st-done{background:#2e7a52;color:#eafff2;box-shadow:none}.pill.st-doing{background:#123a44;color:#c9fff9;box-shadow:none}
.lmini{height:4px;background:#0f0b22}.lmini i{display:block;height:100%;background:var(--rune)}
.lback{align-self:flex-start}
.lhead{display:grid;gap:8px}
.lhead h1{margin:0;font-size:21px;font-weight:600;text-wrap:balance}
.lhead p{margin:0;color:var(--dim)}
.lsec{display:grid;gap:6px}
.lsec h3{margin:0;font-size:15px;font-weight:600;color:var(--rune)}
.lsec p{margin:0;max-width:65ch}
.ex{background:#0f0b22;box-shadow:inset 3px 0 0 var(--ember);padding:9px 12px;font-size:13px;color:#e6dfff;max-width:65ch}
.ex b{color:var(--ember2);font-weight:500}

/* ================= helpers ================= */

const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const uid=p=>p+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const clone=o=>JSON.parse(JSON.stringify(o));
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shade(hex,f){const n=parseInt(hex.slice(1),16);let r=n>>16,g=n>>8&255,b=n&255;const m=f<0?0:255,k=Math.abs(f);r=Math.round(r+(m-r)*k);g=Math.round(g+(m-g)*k);b=Math.round(b+(m-b)*k);return'#'+((1<<24)|(r<<16)|(g<<8)|b).toString(16).slice(1)}

/* ================= game data definitions ================= */

function charStats(c){const a=ARMORS[c.parts.armor],wp=WEAPONS[c.parts.weapon];return{hp:a.hp,def:a.def,spd:Math.round(92*a.spd),mpr:12+(wp.mpr||0),wp,a}}
function sStats(s){if(s.studio)return studioStats(s.studio.doc);const t=TYPES[s.type],b=BEHAV[s.beh];const pts=s.pow+s.rng+s.cd+t.cost+b.cost;
  const dmg=Math.round((8+s.pow*6)*t.m*(s.elem==='energy'?1.25:1));const cd=Math.round((6.5-s.cd*1.1)*10)/10;
  const mp=Math.round(8+s.pow*4+s.cd*3+b.cost*3+t.cost*2);let range;
  if(s.type==='bolt')range=70+s.rng*35;else if(s.type==='slash')range=20+s.rng*5;else if(s.type==='dash')range=(40+s.rng*20)*(s.beh==='pierce'?1.5:1);else range=30+s.rng*18;
  const rad=s.type==='burst'?Math.round((18+s.rng*3)*(s.beh==='explode'?1.4:1)):0;
  return{pts,dmg,cd,mp,range,rad,reach:range+rad}}

function fortArena(){const W=30,H=12,t=new Array(W*H).fill(0);const set=(x,y,v)=>{t[y*W+x]=v};
  for(let x=0;x<W;x++){set(x,10,1);set(x,11,1)}
  for(let x=5;x<=9;x++)set(x,7,2);for(let x=19;x<=23;x++)set(x,7,2);for(let x=12;x<=16;x++)set(x,4,2);
  set(14,9,4);set(29,9,4);set(29,8,4);
  return{id:'ar_fort',name:'ป้อมผลึก',w:W,h:H,tiles:t.join(''),objs:[{t:'player',x:2,y:9},{t:'slime',x:9,y:9},{t:'drone',x:14,y:2},{t:'knight',x:20,y:9},{t:'slime',x:25,y:9},{t:'dummy',x:17,y:9}]}}

const isStr=(v,m)=>typeof v==='string'&&v.trim().length>0&&v.length<=m;
const int=(v,a,b,d)=>Number.isInteger(v)&&v>=a&&v<=b?v:d;
const isCol=v=>typeof v==='string'&&/^#[0-9a-f]{6}$/i.test(v);
function vSkill(s){if(s&&s.studio)return vStudioSkill(s);if(!s||!isStr(s.id,60)||!TYPES[s.type]||!ELEMS[s.elem]||!BEHAV[s.beh])return null;
  const o={id:s.id,name:isStr(s.name,30)?s.name:'สกิลไร้ชื่อ',type:s.type,elem:s.elem,beh:s.beh,pow:int(s.pow,1,5,3),rng:int(s.rng,1,5,3),cd:int(s.cd,1,5,3)};
  while(sStats(o).pts>BUDGET&&o.pow>1)o.pow--;while(sStats(o).pts>BUDGET&&o.cd>1)o.cd--;return o}
function vChar(c){if(!c||!isStr(c.id,60)||typeof c.parts!=='object'||!c.parts)return null;const p=c.parts,cl=c.colors||{};
  const o={id:c.id,name:isStr(c.name,20)?c.name:'ไร้นาม',parts:{},colors:{},skills:[null,null,null]};
  for(const k in PARTS)o.parts[k]=int(p[k],0,PARTS[k].o.length-1,0);o.parts.armor=int(p.armor,0,2,1);o.parts.weapon=int(p.weapon,0,2,0);
  const def={skin:'#f2c49b',hair:'#2b1d3a',outfit:'#3a47b8',armor:'#9aa5cc',accent:'#ff8a3d'};for(const k in COLS)o.colors[k]=isCol(cl[k])?cl[k].toLowerCase():def[k];
  if(Array.isArray(c.skills))for(let i=0;i<3;i++)o.skills[i]=isStr(c.skills[i],60)?c.skills[i]:null;return o}
function vAI(a){if(!a||!isStr(a.id,60)||!STYLES[a.style]||!Array.isArray(a.rules))return null;
  return{id:a.id,name:isStr(a.name,24)?a.name:'AI ไร้ชื่อ',style:a.style,rules:a.rules.slice(0,8).filter(r=>r&&CONDS[r.cond]&&int(r.slot,0,2,-1)>=0).map(r=>({slot:r.slot,cond:r.cond}))}}
function vArena(a){if(!a||!isStr(a.id,60)||a.w!==30||a.h!==12||typeof a.tiles!=='string'||!/^[0-4]{360}$/.test(a.tiles)||!Array.isArray(a.objs))return null;
  const objs=a.objs.filter(o=>o&&(o.t==='player'||FOES[o.t])&&int(o.x,0,29,-1)>=0&&int(o.y,0,11,-1)>=0).slice(0,40).map(o=>({t:o.t,x:o.x,y:o.y}));
  return{id:a.id,name:isStr(a.name,24)?a.name:'สนามไร้ชื่อ',w:30,h:12,tiles:a.tiles,objs}}
function vData(raw){const d=starter();let bad=0;if(!raw||typeof raw!=='object'||raw.schema!==1)return null;
  const take=(arr,fn)=>{if(!Array.isArray(arr))return null;const out=[];const ids=new Set();for(const x of arr){const v=fn(x);if(v&&!ids.has(v.id)){ids.add(v.id);out.push(v)}else bad++}return out};
  const sk=take(raw.skills,vSkill),ch=take(raw.chars,vChar),ai=take(raw.ais,vAI),ar=take(raw.arenas,vArena);
  if(sk)d.skills=sk;if(ch&&ch.length)d.chars=ch;if(ai&&ai.length)d.ais=ai;if(ar)d.arenas=ar;
  const sids=new Set(d.skills.map(s=>s.id));d.chars.forEach(c=>c.skills=c.skills.map(id=>sids.has(id)?id:null));
  const st=raw.settings||{};d.settings={active:d.chars.some(c=>c.id===st.active)?st.active:d.chars[0].id,nums:st.nums!==false,shake:st.shake!==false};
  if(Array.isArray(raw.unlocks))d.unlocks=raw.unlocks.filter(u=>UNL[u]);
  if(raw.stats&&typeof raw.stats==='object')for(const k in d.stats)d.stats[k]=int(raw.stats[k],0,1e9,0);
  if(Array.isArray(raw.runs))d.runs=raw.runs.filter(r=>r&&typeof r.char==='string'&&typeof r.dealt==='number').slice(0,10);
  d.bad=bad;return d}
let D,STORE_OK=true;
function load(){let raw=null,txt=null;try{txt=localStorage.getItem(KEY)}catch(e){STORE_OK=false}
  if(txt){try{raw=JSON.parse(txt)}catch(e){raw=null}const d=vData(raw);
    if(d){const nb=d.bad;delete d.bad;D=d;if(nb)setTimeout(()=>toast('พบข้อมูลเสีย '+nb+' รายการ ระบบข้ามไปแล้ว','bad'),600);return}
    try{localStorage.setItem(KEY+'.backup',txt)}catch(e){}setTimeout(()=>toast('ไฟล์บันทึกเสีย ระบบเริ่มใหม่และเก็บสำรองไว้แล้ว','bad'),600)}
  D=starter()}

const getChar=id=>D.chars.find(c=>c.id===id),getSkill=id=>D.skills.find(s=>s.id===id),getAI=id=>D.ais.find(a=>a.id===id),getArena=id=>D.arenas.find(a=>a.id===id);
const activeChar=()=>getChar(D.settings.active)||D.chars[0];
const locked=(k,i)=>LOCK[k+':'+i]&&!D.unlocks.includes(LOCK[k+':'+i]);

function drawHero(g,c,X,Y,face,pose,t,flash,sc){
  sc=sc||1;const P=c.parts,C=c.colors,ox=Math.round(X-8*sc),oy=Math.round(Y-20*sc);
  const R=(x,y,w,h,col)=>{g.fillStyle=flash?'#ffffff':col;const lx=face<0?16-x-w:x;g.fillRect(ox+lx*sc,oy+y*sc,w*sc,h*sc)};
  const u=pose==='idle'?(Math.floor(t*2.2)%2):0,wf=pose==='walk'?Math.floor(t*9)%2:0,atk=pose==='attack',air=pose==='jump',hurt=pose==='hurt';
  const sD=shade(C.skin,-.22),hD=shade(C.hair,-.3),oD=shade(C.outfit,-.35),aD=shade(C.armor,-.3),A=C.accent,boot='#1a1428',fl=Math.floor(t*5)%2;
  if(P.acc===1){R(3,9+u,3,7+fl,shade(A,-.15));R(2,11+u,2,6-fl,shade(A,-.4))}
  if(P.acc===3){g.globalAlpha=.85;R(0,6+u,4,2,A);R(1,8+u,4,2,shade(A,.35));R(0,10+u,3,2,A);R(1,12+u+fl,2,2,shade(A,.35));g.globalAlpha=1}
  if(P.hair===1&&P.helmet!==1)R(3,3+u,3,8,hD);
  if(P.hair===3&&P.helmet!==1){R(2,3+u,3,2,C.hair);R(1,5+u,2,4+fl,hD)}
  R(5,10+u,2,4,oD);
  const leg=(x,l)=>{R(x,15,3,4-l,oD);R(x,19-l,3,1,boot)};
  if(air){R(5,15,3,2,oD);R(5,17,3,1,boot);R(9,15,3,3,oD);R(9,18,3,1,boot)}else if(hurt){leg(4,0);leg(9,1)}else{leg(5-wf,wf);leg(9+wf,1-wf)}
  R(4,9+u,8,6,C.outfit);R(4,9+u,1,6,oD);
  if(P.outfit===0){R(3,13+u,10,4,C.outfit);R(3,16+u,10,1,A);R(3,13+u,1,4,oD)}else if(P.outfit===1){R(4,12+u,8,1,A);R(10,9+u,1,3,A)}else{R(4,13+u,8,1,'#5a3a22');R(9,13+u,2,1,A)}
  if(P.armor===1){R(5,9+u,6,3,C.armor);R(4,9+u,3,2,aD);R(10,10+u,1,1,A)}else if(P.armor===2){R(3,8+u,4,3,aD);R(5,10+u,6,4,C.armor);R(7,11+u,2,2,A);R(9,8+u,4,3,C.armor);R(9,8+u,4,1,shade(C.armor,.3))}
  if(P.acc===2){R(5,8+u,7,2,A);R(2,9+u+fl,3,1,A);R(3,10+u,2,1,shade(A,-.3))}
  const hy=2+u,eye='#1a1030';
  R(5,hy,7,7,C.skin);R(5,hy,1,7,sD);R(6,hy+6,6,1,sD);
  if(hurt){R(8,hy+3,1,1,eye);R(10,hy+3,1,1,eye);R(9,hy+5,2,1,eye)}
  else{R(8,hy+3,1,2,eye);R(10,hy+3,1,2,eye);if(P.face===1){R(8,hy+2,1,1,hD);R(10,hy+2,2,1,hD)}if(P.face===2){R(9,hy+5,2,1,sD);R(11,hy+4,1,1,'#ff9aa8')}}
  const H=P.helmet;

    if(f.k==='arc'){g.strokeStyle=f.c;g.globalAlpha=a;g.lineWidth=f.big?3:2;g.beginPath();const s=f.f>0?-1.2:Math.PI-1.2+0;g.arc(f.x,f.y,f.r*(1.15-a*.15),f.f>0?-1.2:Math.PI-1.2,f.f>0?1.2:Math.PI+1.2);g.stroke();if(f.c2){g.strokeStyle=f.c2;g.lineWidth=1;g.stroke()}g.globalAlpha=1}
    else if(f.k==='ring'){const r=f.r*(1-a*.6);g.globalAlpha=a;g.fillStyle=f.c;g.beginPath();g.arc(f.x,f.y,r,0,7);g.fill();g.globalAlpha=a*.9;g.fillStyle=f.c2;g.beginPath();g.arc(f.x,f.y,r*.5,0,7);g.fill();g.globalAlpha=1}
    else if(f.k==='zap'){g.strokeStyle=f.c;g.lineWidth=1;g.beginPath();g.moveTo(f.x,f.y);for(let i=1;i<5;i++)g.lineTo(f.x+(f.x2-f.x)*i/5+(Math.random()-.5)*8,f.y+(f.y2-f.y)*i/5+(Math.random()-.5)*8);g.lineTo(f.x2,f.y2);g.stroke()}
    else if(f.k==='sp'){g.fillStyle=f.c;g.globalAlpha=Math.min(1,a*2);g.fillRect(Math.round(f.x),Math.round(f.y),1,1);g.globalAlpha=1}}
  g.textAlign='center';
  for(const n of w.nums){g.globalAlpha=Math.min(1,n.t*2);g.font=n.txt?'500 9px Mitr, sans-serif':'8px Silkscreen, monospace';g.fillStyle='#000';g.fillText(n.v,Math.round(n.x)+1,Math.round(n.y)+1);g.fillStyle=n.c;g.fillText(n.v,Math.round(n.x),Math.round(n.y));g.globalAlpha=1}
  g.restore()}

  <p class="muted" id="sandInfo">แตะช่องเพื่อวาง · ใช้ "เลือก / ย้าย" แตะวัตถุแล้วแตะช่องว่างเพื่อย้าย · ศัตรู ${nE}/16 ตัว${a.objs.some(o=>o.t==='player')?'':' · ยังไม่มีจุดเกิดผู้เล่น'}</p>
  <div id="selPanel"></div>
  <div class="savebar"><span class="grow">${ED.arenaDirty?'มีการแก้ไขที่ยังไม่บันทึก':''}</span><button class="btn danger sm" data-act="sandClear">ล้างสนาม</button><button class="btn" data-act="sandTest">ทดสอบสนาม</button><button class="btn pri" data-act="sandSave">บันทึกสนาม</button></div>`;

function renderSel(){const el=$('#selPanel');if(!el)return;const o=ED.sel;if(!o||!ED.arena.objs.includes(o)){ED.sel=null;el.innerHTML='';return}
  el.innerHTML=`<div class="card selp"><div class="grow muted" style="flex:1 1 100%">วัตถุที่เลือก: <b style="color:var(--text)">${o.t==='player'?'จุดเกิดผู้เล่น':FOES[o.t].n}</b> ที่ช่อง (${o.x+1}, ${o.y+1}) — แตะช่องว่างในตารางเพื่อย้าย</div>${o.t!=='player'?`<label class="fld"><span>เปลี่ยนเป็น</span><select id="selType">${Object.entries(FOES).map(([k,f])=>opt(k,f.n,o.t===k)).join('')}</select></label>`:''}<button class="btn sm danger" data-act="selDel">ลบวัตถุ</button><button class="btn sm" data-act="selNone">ยกเลิกการเลือก</button></div>`}
function drawEditor(){const cv=$('#sandCv');if(!cv)return;const g=cv.getContext('2d'),a=ED.arena;g.imageSmoothingEnabled=false;
  g.fillStyle='#120d26';g.fillRect(0,0,480,192);g.fillStyle='#4fe3d614';for(let x=0;x<=30;x++)g.fillRect(x*T,0,1,192);for(let y=0;y<=12;y++)g.fillRect(0,y*T,480,1);
  for(let y=0;y<12;y++)for(let x=0;x<30;x++){const t=+a.tiles[y*30+x];if(t)drawTile(g,t,x*T,y*T,y===0||+a.tiles[(y-1)*30+x]!==1)}
  for(const o of a.objs){if(o.t==='player')drawHero(g,activeChar(),o.x*T+8,(o.y+1)*T,1,'idle',0,false);else drawFoe(g,{type:o.t,x:o.x*T+8,y:(o.y+1)*T,face:-1,hurtT:0,st:0,swing:0,onGround:true,t:0,hp:1,maxhp:1,h:FOES[o.t].h,boss:o.t==='boss',dummy:o.t==='dummy'},0)}
  if(ED.sel){g.strokeStyle='#ffc35a';g.lineWidth=1;g.strokeRect(ED.sel.x*T+.5,ED.sel.y*T+.5,T-1,T-1)}}
function setTile(x,y,v){const a=ED.arena,i=y*30+x;a.tiles=a.tiles.slice(0,i)+v+a.tiles.slice(i+1)}
function applyTool(x,y){const a=ED.arena,tool=ED.tool,at=a.objs.find(o=>o.x===x&&o.y===y);
  if(tool[0]==='t'){const v=+tool[1];setTile(x,y,v);if(at&&(v===1||v===4))a.objs.splice(a.objs.indexOf(at),1)}
  else if(tool==='erase'){if(at)a.objs.splice(a.objs.indexOf(at),1);else setTile(x,y,0)}
  else if(tool==='select'){if(at)ED.sel=at;else if(ED.sel){ED.sel.x=x;ED.sel.y=y;if(a.tiles[y*30+x]==='1'||a.tiles[y*30+x]==='4')setTile(x,y,0)}else return}
  else if(tool==='player'){a.objs=a.objs.filter(o=>o.t!=='player'&&o!==at);a.objs.push({t:'player',x,y});if('14'.includes(a.tiles[y*30+x]))setTile(x,y,0)}
  else{if(at&&at.t!=='player')at.t=tool;else{if(at)return toast('ช่องนี้มีจุดเกิดผู้เล่นอยู่แล้ว');if(tool!=='dummy'&&a.objs.filter(o=>FOES[o.t]&&o.t!=='dummy').length>=16)return toast('วางศัตรูได้สูงสุด 16 ตัวต่อสนาม','bad');a.objs.push({t:tool,x,y})}if('14'.includes(a.tiles[y*30+x]))setTile(x,y,0)}
  ED.arenaDirty=true;drawEditor();renderSel();
  const nE=a.objs.filter(o=>FOES[o.t]&&o.t!=='dummy').length;$('#sandInfo').textContent='แตะช่องเพื่อวาง · ใช้ "เลือก / ย้าย" แตะวัตถุแล้วแตะช่องว่างเพื่อย้าย · ศัตรู '+nE+'/16 ตัว'+(a.objs.some(o=>o.t==='player')?'':' · ยังไม่มีจุดเกิดผู้เล่น');
  const sb=$('#s-sand .savebar .grow');if(sb)sb.textContent='มีการแก้ไขที่ยังไม่บันทึก'}
function bindEditor(){const cv=$('#sandCv');let st=null,last='';
  const cell=e=>{const r=cv.getBoundingClientRect();return[clamp(Math.floor((e.clientX-r.left)/r.width*30),0,29),clamp(Math.floor((e.clientY-r.top)/r.height*12),0,11)]};
  cv.addEventListener('pointerdown',e=>{st={x:e.clientX,y:e.clientY,mouse:e.pointerType==='mouse'};last='';if(st.mouse&&ED.tool[0]==='t'){const[x,y]=cell(e);last=x+','+y;applyTool(x,y)}});
  cv.addEventListener('pointermove',e=>{if(!st||!st.mouse||!(e.buttons&1)||(ED.tool[0]!=='t'&&ED.tool!=='erase'))return;const[x,y]=cell(e);if(x+','+y!==last){last=x+','+y;applyTool(x,y)}});
  cv.addEventListener('pointerup',e=>{if(!st)return;const moved=Math.hypot(e.clientX-st.x,e.clientY-st.y);const[x,y]=cell(e);if(moved<10&&x+','+y!==last)applyTool(x,y);st=null});
  cv.addEventListener('pointercancel',()=>{st=null})}

/* =====================================================================
   SKILL STUDIO — Phase 1 editor shell
   Four separate layers, each usable without the ones below it:
   [Document]  SS schema, newLayer/newNode, sampleDoc, vDoc   (pure data)
   [Runtime]   trackVal/layerAt/drawFxLayer, dataIn, GraphRun, scene step (no DOM)
   [Store]     StudioStore — localStorage adapter; IndexedDB can replace it later
               with the same list/load/save/remove/last methods
   [Editor]    ES state, history (undo/redo), commands
   [UI]        panel renderers + pointer/keyboard binding
   The studio keeps its own storage key, so the game save is never touched.
   ===================================================================== */

/* ---------- [Document] schema ---------- */
const SS={

  KP:{burst:['count','speed','spread','angle','life','size','grav','seed'],ring:['radius','thick'],orb:['size','shape','pulse'],trail:['tlen','width']},
  DEF:{anchor:'target',x:0,y:0,scale:1,rot:0,opacity:1,start:0,dur:1,blend:'glow',color:'#ff8a3d',color2:'#ffd34d',count:16,speed:80,spread:360,angle:-90,life:.6,size:4,grav:120,seed:7,radius:20,thick:2,shape:'circle',pulse:.3,tlen:24,width:4},
  CATS:{ev:{n:'เหตุการณ์',c:'#ff8a3d'},flow:{n:'ลำดับ',c:'#4fe3d6'},act:{n:'การกระทำ',c:'#d36bff'},data:{n:'ข้อมูล',c:'#ffd34d'}},
  PORTN:{in:'เข้า',out:'ต่อไป',hit:'เมื่อชน',each:'แต่ละครั้ง',done:'เสร็จ',sec:'วินาที',speed:'ความเร็ว',amount:'ความเสียหาย',value:'ค่า',a:'A',b:'B'},
  NODES:{
    onCast:{n:'เมื่อใช้สกิล',cat:'ev',d:'จุดเริ่มของสกิล ทำงานทันทีเมื่อกดใช้',ins:[],outs:[['out','exec']],p:{}},
    delay:{n:'หน่วงเวลา',cat:'flow',d:'รอตามเวลาที่กำหนดแล้วจึงทำต่อ',ins:[['in','exec'],['sec','num']],outs:[['out','exec']],p:{sec:{n:'วินาที',min:0,max:3,step:.05,d:.2}}},

    playfx:{n:'เล่นเอฟเฟกต์',cat:'act',d:'เล่น Layer ที่เลือกตามจังหวะใน Timeline',ins:[['in','exec']],outs:[['out','exec']],p:{layer:{n:'Layer',t:'layer',d:''},at:{n:'ตำแหน่ง',t:'sel',o:{caster:'ผู้ร่าย',target:'เป้าหมาย'},d:'target'}}},
    damage:{n:'ทำความเสียหาย',cat:'act',d:'ลดพลังชีวิตหุ่นฝึก',ins:[['in','exec'],['amount','num']],outs:[['out','exec']],p:{amount:{n:'ความเสียหาย',min:0,max:500,step:1,d:20}}},
    status:{n:'ใส่สถานะ',cat:'act',d:'ใส่สถานะผิดปกติให้หุ่นฝึก',ins:[['in','exec']],outs:[['out','exec']],p:{kind:{n:'สถานะ',t:'sel',o:{fire:'ติดไฟ',ice:'แช่แข็ง',shock:'มึนงง'},d:'fire'},sec:{n:'ระยะเวลา (วิ)',min:.5,max:6,step:.5,d:3}}},
    number:{n:'ตัวเลข',cat:'data',d:'ส่งค่าคงที่ไปยังพอร์ตตัวเลข',ins:[],outs:[['value','num']],p:{v:{n:'ค่า',min:-999,max:999,step:1,d:10}}},
    add:{n:'บวก',cat:'data',d:'ส่งค่า A + B',ins:[['a','num'],['b','num']],outs:[['value','num']],p:{a:{n:'A',min:-999,max:999,step:1,d:0},b:{n:'B',min:-999,max:999,step:1,d:0}}},
    mul:{n:'คูณ',cat:'data',d:'ส่งค่า A × B',ins:[['a','num'],['b','num']],outs:[['value','num']],p:{a:{n:'A',min:-999,max:999,step:.1,d:1},b:{n:'B',min:-999,max:999,step:.1,d:2}}}}
};
const EASE={linear:f=>f,easeOut:f=>1-(1-f)*(1-f),easeIn:f=>f*f,hold:()=>0};
const EASEN={linear:'เส้นตรง',easeOut:'ช้าลงตอนจบ',easeIn:'เร่งขึ้นตอนจบ',hold:'คงค่าแล้วกระโดด'};
const sid=p=>p+Math.random().toString(36).slice(2,9);
const fmtN=v=>Math.round(v*100)/100;
function portDef(type,name,dir){const d=SS.NODES[type];return d?(dir==='in'?d.ins:d.outs).find(x=>x[0]===name):null}
function newLayer(kind){const p={};for(const k of[...SS.COMMON,...SS.KP[kind]])p[k]=SS.DEF[k];if(kind==='orb'||kind==='trail')p.anchor='projectile';const L={id:sid('L'),name:SS.KINDS[kind].n,kind,visible:true,locked:false,p};if(kind==='art')L.art=newArt();return L}
function newNode(type,x,y){const d=SS.NODES[type],p={};for(const k in d.p)p[k]=d.p[k].d;return{id:sid('N'),type,x:Math.round(x),y:Math.round(y),p}}
function emptyDoc(){return{schema:1,id:sid('D'),name:'สกิลใหม่',duration:1,updated:Date.now(),layers:[],tracks:[],nodes:[newNode('onCast',20,20)],edges:[]}}
function sampleDoc(){
  const L1=newLayer('burst');L1.name='ประกายตอนร่าย';Object.assign(L1.p,{anchor:'caster',count:10,speed:50,spread:120,angle:0,life:.35,size:2,grav:0,dur:.4,color:'#ff8a3d',color2:'#fff3c4'});
  const L2=newLayer('orb');L2.name='แกนลูกไฟ';Object.assign(L2.p,{size:5,color:'#ff7a2e',color2:'#ffe9a8',dur:5,pulse:.5});
  const L3=newLayer('trail');L3.name='หางไฟ';Object.assign(L3.p,{tlen:30,width:5,color:'#ff5c3a',color2:'#ffd34d',dur:5,opacity:.85});
  const L4=newLayer('burst');L4.name='สะเก็ดระเบิด';Object.assign(L4.p,{count:26,speed:110,spread:360,life:.55,size:3,grav:160,dur:.7,color:'#ff7a2e',color2:'#ffe9a8'});
  const L5=newLayer('ring');L5.name='คลื่นกระแทก';Object.assign(L5.p,{radius:4,thick:3,dur:.5,color:'#ffd34d',color2:'#ff7a2e'});
  const doc={schema:1,id:sid('D'),name:'ลูกไฟระเบิด (ตัวอย่าง)',duration:1.2,updated:Date.now(),layers:[L5,L4,L3,L2,L1],tracks:[],nodes:[],edges:[]};
  const tr=(L,prop,keys)=>doc.tracks.push({id:sid('T'),layer:L.id,prop,keys:keys.map(([t,v,e])=>({id:sid('K'),t,v,ease:e||'linear'}))});
  tr(L5,'radius',[[0,4,'easeOut'],[.45,34]]);tr(L5,'opacity',[[0,1],[.2,1],[.5,0]]);tr(L1,'scale',[[0,1.6,'easeOut'],[.35,.6]]);tr(L4,'opacity',[[0,1],[.4,1],[.7,0]]);
  const N=(t,x,y,p)=>{const n=newNode(t,x,y);Object.assign(n.p,p||{});doc.nodes.push(n);return n};
  const a=N('onCast',20,20),b=N('playfx',210,20,{layer:L1.id,at:'caster'}),c=N('delay',400,20,{sec:.15}),d=N('projectile',590,20,{speed:170}),
    e=N('damage',780,20),f=N('status',970,20,{kind:'fire',sec:3}),g=N('playfx',780,170,{layer:L4.id,at:'target'}),h=N('playfx',970,170,{layer:L5.id,at:'target'}),
    i=N('number',400,170,{v:14}),j=N('mul',590,190,{b:2});
  const E=(f1,p1,t1,p2)=>doc.edges.push({id:sid('E'),from:[f1.id,p1],to:[t1.id,p2]});
  E(a,'out',b,'in');E(b,'out',c,'in');E(c,'out',d,'in');E(d,'hit',e,'in');E(e,'out',f,'in');E(d,'hit',g,'in');E(g,'out',h,'in');E(i,'value',j,'a');E(j,'value',e,'amount');
  return doc}
function vNum(v,def,P){const n=typeof v==='number'&&isFinite(v)?v:def;return P?clamp(n,P.min,P.max):n}
function vProp(k,v,def){const P=SS.PROPS[k];if(P.t==='sel')return P.o[v]?v:def;if(P.t==='col')return isCol(v)?v.toLowerCase():def;return vNum(v,def,P)}
function vDoc(d){try{
  if(!d||d.schema!==1||!isStr(d.id,40)||!Array.isArray(d.layers)||!Array.isArray(d.nodes))return null;
  const o={schema:1,id:d.id,name:isStr(d.name,40)?d.name:'สกิลไร้ชื่อ',duration:vNum(d.duration,1.2,{min:.3,max:5}),updated:vNum(d.updated,Date.now()),layers:[],tracks:[],nodes:[],edges:[]};
  for(const L of d.layers.slice(0,40)){if(!L||!SS.KINDS[L.kind]||!isStr(L.id,40))continue;const n=newLayer(L.kind);n.id=L.id;n.name=isStr(L.name,30)?L.name:n.name;n.visible=L.visible!==false;n.locked=!!L.locked;const src=L.p||{};for(const k in n.p)n.p[k]=vProp(k,src[k],n.p[k]);if(n.kind==='art')n.art=vArt(L.art)||n.art;o.layers.push(n)}
  const lids=new Set(o.layers.map(l=>l.id));
  for(const tr of(Array.isArray(d.tracks)?d.tracks:[]).slice(0,200)){const P=tr&&SS.PROPS[tr.prop];if(!P||!P.anim||!lids.has(tr.layer)||!Array.isArray(tr.keys)||o.tracks.some(x=>x.layer===tr.layer&&x.prop===tr.prop))continue;
    const keys=tr.keys.filter(k=>k&&typeof k.t==='number'&&isFinite(k.t)).slice(0,100).map(k=>({id:isStr(k.id,40)?k.id:sid('K'),t:clamp(k.t,0,o.duration),v:vNum(k.v,0,P),ease:EASE[k.ease]?k.ease:'linear'})).sort((a,b)=>a.t-b.t);
    if(keys.length)o.tracks.push({id:isStr(tr.id,40)?tr.id:sid('T'),layer:tr.layer,prop:tr.prop,keys})}
  for(const n of d.nodes.slice(0,80)){if(!n||!SS.NODES[n.type]||!isStr(n.id,40))continue;const m=newNode(n.type,vNum(n.x,0,{min:-5000,max:5000}),vNum(n.y,0,{min:-5000,max:5000}));m.id=n.id;const def=SS.NODES[n.type].p;
    for(const k in def){const P=def[k],v=(n.p||{})[k];if(P.t==='sel')m.p[k]=P.o[v]?v:P.d;else if(P.t==='layer')m.p[k]=typeof v==='string'?v.slice(0,40):'';else m.p[k]=vNum(v,P.d,P)}o.nodes.push(m)}
  const nmap=new Map(o.nodes.map(n=>[n.id,n]));
  for(const e of(Array.isArray(d.edges)?d.edges:[]).slice(0,300)){if(!e||!Array.isArray(e.from)||!Array.isArray(e.to))continue;const a=nmap.get(e.from[0]),b=nmap.get(e.to[0]);if(!a||!b||a===b)continue;
    const pa=portDef(a.type,e.from[1],'out'),pb=portDef(b.type,e.to[1],'in');if(!pa||!pb||pa[1]!==pb[1])continue;
    if(pb[1]==='num'&&o.edges.some(x=>x.to[0]===b.id&&x.to[1]===e.to[1]))continue;
    o.edges.push({id:isStr(e.id,40)?e.id:sid('E'),from:[a.id,e.from[1]],to:[b.id,e.to[1]]})}
  return o}catch(err){return null}}
/* Import/Export contract for the next phase (validated, not yet wired to UI) */
function exportSkillDoc(doc){return JSON.stringify({format:'pixelforge-skill',version:1,doc})}
function importSkillDoc(txt){try{const o=JSON.parse(txt);return o&&o.format==='pixelforge-skill'?vDoc(o.doc):null}catch(e){return null}}

/* ---------- [Runtime] evaluation + drawing (no DOM) ---------- */
function trackVal(tr,t){const k=tr.keys;if(!k.length)return null;if(t<=k[0].t)return k[0].v;const last=k[k.length-1];if(t>=last.t)return last.v;
  for(let i=0;i<k.length-1;i++){const a=k[i],b=k[i+1];if(t>=a.t&&t<=b.t){const f=(t-a.t)/((b.t-a.t)||1);return a.v+(b.v-a.v)*EASE[a.ease](f)}}return last.v}
function layerAt(doc,L,t){const p={...L.p};for(const tr of doc.tracks)if(tr.layer===L.id){const v=trackVal(tr,t);if(v!=null)p[tr.prop]=v}return p}
function shapePath(g,sh,s){g.beginPath();if(sh==='diamond'){g.moveTo(0,-s);g.lineTo(s,0);g.lineTo(0,s);g.lineTo(-s,0);g.closePath()}
  else if(sh==='star'){for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,r=i%2?s*.45:s;g.lineTo(Math.cos(a)*r,Math.sin(a)*r)}g.closePath()}else g.arc(0,0,Math.max(.5,s),0,7)}
function drawFxLayer(g,L,p,t,ax,ay){const age=t-p.start;if(age<0||age>p.dur||p.opacity<=0||p.scale<=0)return;
  const A=clamp(p.opacity,0,1);g.save();g.globalAlpha=A;if(p.blend==='glow')g.globalCompositeOperation='lighter';
  g.translate(Math.round(ax+p.x),Math.round(ay+p.y));if(p.rot)g.rotate(p.rot*Math.PI/180);g.scale(p.scale,p.scale);
  if(L.kind==='burst'){const r=rng(Math.round(p.seed));for(let i=0;i<p.count;i++){const ra=r(),rs=r(),rl=r(),rd=r();const a=(p.angle+(ra-.5)*p.spread)*Math.PI/180,sp=p.speed*(.45+rs*.55),lf=p.life*(.6+rl*.4),pa=age-rd*.06;
    if(pa<0||pa>lf)continue;const f=pa/lf,x=Math.cos(a)*sp*pa,y=Math.sin(a)*sp*pa+.5*p.grav*pa*pa,s=Math.max(1,Math.round(p.size*(1-f*.7)));g.fillStyle=f<.35?p.color2:p.color;g.fillRect(Math.round(x-s/2),Math.round(y-s/2),s,s)}}
  else if(L.kind==='ring'){const R=Math.max(0,p.radius);g.strokeStyle=p.color;g.lineWidth=p.thick;g.beginPath();g.arc(0,0,R,0,7);g.stroke();if(R>p.thick){g.strokeStyle=p.color2;g.lineWidth=1;g.beginPath();g.arc(0,0,R-p.thick,0,7);g.stroke()}}
  else if(L.kind==='orb'){const s=p.size*(1+p.pulse*.25*Math.sin(age*18));g.globalAlpha=A*.35;g.fillStyle=p.color;shapePath(g,p.shape,s*1.7);g.fill();g.globalAlpha=A;shapePath(g,p.shape,s);g.fill();g.fillStyle=p.color2;shapePath(g,p.shape,s*.5);g.fill()}
  else if(L.kind==='art'){drawArt(g,L.art,Math.floor(Math.max(0,age)*p.fps)%L.art.frames.length)}
  else{const n=Math.max(2,Math.round(p.tlen/2));for(let i=0;i<n;i++){const f=i/n,w=Math.max(1,Math.round(p.width*(1-f)));g.globalAlpha=A*(1-f);g.fillStyle=f<.3?p.color2:p.color;g.fillRect(-i*2-2,Math.round(-w/2+Math.sin(age*20+i*.7)*f*2),2,w)}}
  g.restore()}
const SCN={caster:{x:46,y:112},hand:{x:58,y:100},target:{x:196,y:98},dummy:{x:196,y:112}};
function anchorPos(a,prog){if(a==='caster')return SCN.hand;if(a==='target')return SCN.target;return{x:SCN.hand.x+(SCN.target.x-SCN.hand.x)*prog,y:SCN.hand.y+(SCN.target.y-SCN.hand.y)*prog}}
function hitR(L,p){const b=L.kind==='art'?(L.art?L.art.size/2:12):L.kind==='ring'?p.radius+p.thick:L.kind==='trail'?p.tlen*.5:L.kind==='burst'?Math.min(40,p.speed*p.life*.5):p.size*1.6;return Math.max(9,b*p.scale)}
function dataOut(doc,n,depth){if(n.type==='number')return n.p.v;if(n.type==='add')return dataIn(doc,n,'a',depth)+dataIn(doc,n,'b',depth);if(n.type==='mul')return dataIn(doc,n,'a',depth)*dataIn(doc,n,'b',depth);return 0}
function dataIn(doc,n,name,depth=0){const e=doc.edges.find(e=>e.to[0]===n.id&&e.to[1]===name);if(e&&depth<24){const s=doc.nodes.find(x=>x.id===e.from[0]);if(s)return dataOut(doc,s,depth+1)}const v=n.p[name];return typeof v==='number'?v:0}
function nodeTitle(doc,n){return'#'+(doc.nodes.indexOf(n)+1)+' '+SS.NODES[n.type].n}
/* GraphRun executes the node graph: an event queue walks exec edges; number ports are pulled through data edges. */
class GraphRun{
  constructor(doc,host){this.doc=doc;this.h=host;this.t=0;this.q=[];this.steps=0;this.halted='';this.nodes=new Map(doc.nodes.map(n=>[n.id,n]))}
  out(n,port,delay){for(const e of this.doc.edges)if(e.from[0]===n.id&&e.from[1]===port)this.q.push({t:this.t+(delay||0),id:e.to[0],tg:this.cur})}
  start(){const tr=this.doc.nodes.filter(n=>n.type==='onCast');if(!tr.length){this.halted='ไม่มี Node "เมื่อใช้สกิล" กราฟจึงไม่เริ่มทำงาน';return false}
    for(const n of tr){this.h.log(0,n,'เริ่มทำงาน');this.h.pulse(n.id);this.out(n,'out')}return true}
  inp(n,name){return dataIn(this.doc,n,name)}
  exec(n){const h=this.h;if(++this.steps>400){this.halted='หยุดอัตโนมัติ: Node ทำงานเกิน 400 ครั้ง อาจมีการวนไม่รู้จบ';this.q=[];h.log(this.t,null,this.halted,1);return}
    h.pulse(n.id);
    switch(n.type){
      case 'delay':{const s=Math.max(0,this.inp(n,'sec'));h.log(this.t,n,'รอ '+s.toFixed(2)+' วิ');this.out(n,'out',s);break}
      case 'repeat':{const c=clamp(Math.round(n.p.count),1,10);for(let i=0;i<c;i++)this.out(n,'each',i*n.p.gap);this.out(n,'done',c*n.p.gap);h.log(this.t,n,'ทำซ้ำ '+c+' ครั้ง');break}
      case 'projectile':{const sp=clamp(this.inp(n,'speed'),20,600);h.log(this.t,n,'ยิงกระสุน ความเร็ว '+Math.round(sp));h.projectile(sp,tg=>{h.log(this.t,n,'กระสุนชนเป้าหมาย');const c=this.cur;this.cur=tg;this.out(n,'hit');this.cur=c});this.out(n,'out');break}
      case 'playfx':{const L=this.doc.layers.find(l=>l.id===n.p.layer);if(L){h.fx(L,n.p.at);h.log(this.t,n,'เล่น Layer "'+L.name+'"')}else h.log(this.t,n,'ข้าม: ไม่พบ Layer ที่เลือก',1);this.out(n,'out');break}
      case 'damage':{const a=Math.max(0,Math.round(this.inp(n,'amount')));h.damage(a);h.log(this.t,n,'ความเสียหาย '+a);this.out(n,'out');break}
      case 'status':{h.status(n.p.kind,n.p.sec);h.log(this.t,n,SS.NODES.status.p.kind.o[n.p.kind]+' '+n.p.sec+' วิ');this.out(n,'out');break}
      case 'onCast':this.out(n,'out');break}}

  for(const p of S.proj){p.x+=p.sp*dt;p.y=SCN.hand.y+(SCN.target.y-SCN.hand.y)*clamp((p.x-SCN.hand.x)/(SCN.target.x-SCN.hand.x),0,1);if(p.x>=SCN.target.x-4){p.dead=1;p.hit()}}
  S.proj=S.proj.filter(p=>!p.dead);

function validateGraph(doc){const out=[],trig=doc.nodes.filter(n=>n.type==='onCast');

  while(st.length){const id=st.pop();if(reach.has(id))continue;reach.add(id);const n=doc.nodes.find(x=>x.id===id);for(const e of doc.edges)if(e.from[0]===id){const pd=portDef(n.type,e.from[1],'out');if(pd&&pd[1]==='exec')st.push(e.to[0])}}
  for(const n of doc.nodes){const d=SS.NODES[n.type];
    if(n.type==='playfx'&&!doc.layers.some(l=>l.id===n.p.layer))out.push({lv:'err',node:n.id,msg:nodeTitle(doc,n)+' ยังไม่ได้เลือก Layer'});
    if(d.cat!=='data'&&n.type!=='onCast'&&!reach.has(n.id))out.push({lv:'warn',node:n.id,msg:nodeTitle(doc,n)+' ไม่ได้ต่อจาก "เมื่อใช้สกิล" จะไม่ถูกเรียก'});
    if(d.cat==='data'&&!doc.edges.some(e=>e.from[0]===n.id))out.push({lv:'warn',node:n.id,msg:nodeTitle(doc,n)+' ยังไม่ได้ส่งค่าไปที่ใด'})}

  for(const e of doc.edges)if(e.from[0]===id){const pd=portDef(n.type,e.from[1],'out');if(pd&&pd[1]==='num')st.push(e.to[0])}}return false}

  const pa=portDef(a.type,from[1],'out'),pb=portDef(b.type,to[1],'in');if(!pa||!pb)return'พอร์ตไม่ถูกต้อง';
  if(pa[1]!==pb[1])return pa[1]==='exec'?'พอร์ตลำดับการทำงานต่อเข้าพอร์ตตัวเลขไม่ได้':'พอร์ตตัวเลขต่อเข้าพอร์ตลำดับการทำงานไม่ได้';
  if(doc.edges.some(e=>e.from[0]===from[0]&&e.from[1]===from[1]&&e.to[0]===to[0]&&e.to[1]===to[1]))return'มีเส้นนี้อยู่แล้ว';
  if(pa[1]==='num'&&dataReach(doc,b.id,a.id))return'เชื่อมแล้วจะเกิดวงวนของข้อมูล';return''}

const NW=156,NHH=28,NR=26;
const nodeH=n=>{const d=SS.NODES[n.type];return NHH+Math.max(d.ins.length,d.outs.length,1)*NR+22};
function portXY(n,name,dir){const d=SS.NODES[n.type],arr=dir==='in'?d.ins:d.outs,i=arr.findIndex(p=>p[0]===name);return{x:n.x+(dir==='in'?0:NW),y:n.y+NHH+i*NR+NR/2}}
function nodeSummary(doc,n){const v=k=>fmtN(dataIn(doc,n,k));switch(n.type){case 'delay':return'รอ '+v('sec')+' วิ';case 'repeat':return n.p.count+' ครั้ง ห่าง '+n.p.gap+' วิ';case 'projectile':return'ความเร็ว '+v('speed');
  case 'playfx':{const L=doc.layers.find(l=>l.id===n.p.layer);return(L?L.name:'ยังไม่เลือก Layer')+' · '+SS.NODES.playfx.p.at.o[n.p.at]}case 'damage':return'ความเสียหาย '+v('amount');
  case 'status':return SS.NODES.status.p.kind.o[n.p.kind]+' '+n.p.sec+' วิ';case 'number':return'ค่า '+n.p.v;case 'add':case 'mul':return'ผลลัพธ์ '+fmtN(dataOut(doc,n,0));default:return SS.NODES[n.type].d}}
function edgesSVG(){const d=ES.doc;return d.edges.map(e=>{const a=d.nodes.find(n=>n.id===e.from[0]),b=d.nodes.find(n=>n.id===e.to[0]);if(!a||!b)return'';const p1=portXY(a,e.from[1],'out'),p2=portXY(b,e.to[1],'in'),ty=portDef(a.type,e.from[1],'out')[1],dx=Math.max(40,Math.abs(p2.x-p1.x)*.5);
  const dp=`M${p1.x} ${p1.y} C${p1.x+dx} ${p1.y},${p2.x-dx} ${p2.y},${p2.x} ${p2.y}`;return`<path d="${dp}" class="ge ${ty}${ES.sel&&ES.sel.k==='edge'&&ES.sel.id===e.id?' sel':''}"/><path d="${dp}" class="ge-hit" data-edge="${e.id}"/>`}).join('')}
function renderGraphPane(){const d=ES.doc,g=ES.gv,pend=ES.pending,bad=new Set(ES.issues.filter(i=>i.lv==='err'&&i.node).map(i=>i.node));
  const linked=(id,name,dir)=>d.edges.some(e=>dir==='in'?e.to[0]===id&&e.to[1]===name:e.from[0]===id&&e.from[1]===name);
  const nodes=d.nodes.map(n=>{const def=SS.NODES[n.type],rows=Math.max(def.ins.length,def.outs.length,1);let r='';
    for(let i=0;i<rows;i++){const a=def.ins[i],b=def.outs[i];
      const okIn=a&&pend&&pend.node!==n.id&&a[1]===pend.type;
      r+=`<div class="gn-r">${a?`<span class="pt in ${a[1]}${linked(n.id,a[0],'in')?' on':''}${okIn?' ok':''}" data-port="${n.id}|${a[0]}|in">${SS.PORTN[a[0]]}</span>`:'<span class="pt" style="visibility:hidden"></span>'}${b?`<span class="pt out ${b[1]}${linked(n.id,b[0],'out')?' on':''}${pend&&pend.node===n.id&&pend.port===b[0]?' pend':''}" data-port="${n.id}|${b[0]}|out">${SS.PORTN[b[0]]}</span>`:''}</div>`}
    return`<div class="gn${ES.sel&&ES.sel.k==='node'&&ES.sel.id===n.id?' sel':''}${bad.has(n.id)?' bad':''}${ES.run&&ES.run.S.pulse[n.id]?' live':''}" data-node="${n.id}" style="left:${n.x}px;top:${n.y}px"><div class="gn-h" style="--cc:${SS.CATS[def.cat].c}">${def.n}<small>#${d.nodes.indexOf(n)+1}</small></div>${r}<div class="gn-s">${esc(nodeSummary(d,n))}</div></div>`}).join('');
  const errs=ES.issues.filter(i=>i.lv==='err'),warns=ES.issues.filter(i=>i.lv==='warn');
  let stat,cls;if(pend){stat='เลือกพอร์ตขาออก "'+SS.PORTN[pend.port]+'" แล้ว แตะพอร์ตขาเข้าที่เรืองแสงเพื่อเชื่อม หรือแตะพื้นที่ว่างเพื่อยกเลิก';cls='pend'}
  else if(errs.length){stat='ข้อผิดพลาด '+errs.length+': '+errs[0].msg;cls='err'}else if(warns.length){stat='คำเตือน '+warns.length+': '+warns[0].msg;cls='warn'}else{stat='กราฟพร้อมทำงาน · ลากจากพอร์ตไปปล่อยบนพอร์ตที่เรืองแสงเพื่อเชื่อม · กดหัว Node ค้างเพื่อย้าย';cls='ok'}
  $('#paneGraph').innerHTML=paneHead('graph','Node Graph')+`<div class="g-tools"><button class="btn sm" data-sa="menu" data-v="logic">+ เพิ่ม Node</button><button class="btn sm" data-sa="gLayout">จัดเรียง</button><button class="btn sm" data-sa="gFit">พอดีจอ</button><button class="btn sm" data-sa="gZoom" data-v="-1" aria-label="ซูมออก">−</button><button class="btn sm" data-sa="gZoom" data-v="1" aria-label="ซูมเข้า">+</button><button class="btn sm${ES.arrange?' pri':''}" data-sa="gArrange" aria-pressed="${ES.arrange}">ลาก Node: ${ES.arrange?'เปิด':'ปิด'}</button></div>
  <div class="g-stat ${cls}">${esc(stat)}</div><div class="gr-wrap" id="grWrap"><div class="gr-world" id="grWorld" style="transform:translate(${g.x}px,${g.y}px) scale(${g.z})"><svg id="grSvg">${edgesSVG()}</svg>${nodes}</div></div>
  <div class="g-log" id="gLog"></div>`+selBar();ES.logShown=-1;renderLog()}
function renderLog(){const el=$('#gLog');if(!el)return;ES.logShown=ES.log.length;const L=ES.log;
  if(!L.length){el.innerHTML='<span>บันทึกการทำงาน: กดพรีวิวเพื่อรันกราฟจริงแล้วดูลำดับเหตุการณ์ที่นี่</span>';return}
  const show=ES.logOpen?L:L.slice(-1);el.innerHTML=show.map(x=>`<div class="lg${x.bad?' bad':''}"><i>${x.t.toFixed(2)}</i><span>${esc((x.n?x.n+' · ':'')+x.msg)}</span></div>`).join('')+(L.length>1?`<button data-sa="logToggle">${ES.logOpen?'ย่อบันทึก':'ดูบันทึกทั้งหมด ('+L.length+')'}</button>`:'');if(ES.logOpen)el.scrollTop=el.scrollHeight}
function fitGraph(){const w=$('#grWrap');if(!w||!w.clientWidth||!ES.doc.nodes.length)return;let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;for(const n of ES.doc.nodes){x0=Math.min(x0,n.x);y0=Math.min(y0,n.y);x1=Math.max(x1,n.x+NW);y1=Math.max(y1,n.y+nodeH(n))}
  let z=clamp(Math.min((w.clientWidth-40)/(x1-x0),(w.clientHeight-30)/(y1-y0)),.35,1.1);if(z<.6){z=innerWidth<760?.95:.75;ES.gv={z,x:16-x0*z,y:12-y0*z}}else ES.gv={z,x:(w.clientWidth-(x1-x0)*z)/2-x0*z,y:Math.max(10,(w.clientHeight-(y1-y0)*z)/2)-y0*z};ES.gvFit=true;const wd=$('#grWorld');if(wd)wd.style.transform=`translate(${ES.gv.x}px,${ES.gv.y}px) scale(${z})`}

function numField(si,k,P,val,extra,dis,tag){const v=fmtN(+val),d=dis?' disabled':'';return`<div class="ip${tag?' anim':''}"><label for="si_${si}_${k}">${P.n}${tag?` <em>${tag}</em>`:''}</label><div class="ipr"><input type="range" min="${P.min}" max="${P.max}" step="${P.step}" value="${v}" data-si="${si}" data-k="${k}" aria-label="${P.n}"${d}><input type="number" id="si_${si}_${k}" min="${P.min}" max="${P.max}" step="${P.step}" value="${v}" data-si="${si}" data-k="${k}"${d}>${extra||''}</div></div>`}

  else if(s.k==='layer'){const L=curLayer(),p=layerAt(d,L,ES.time),lk=L.locked;
    const row=k=>{const P=SS.PROPS[k],tr=d.tracks.find(t=>t.layer===L.id&&t.prop===k),v=p[k];
      if(P.t==='sel')return`<label class="fld"><span>${P.n}</span><select data-si="lp" data-k="${k}"${lk?' disabled':''}>${Object.entries(P.o).map(([o,n])=>opt(o,n,v===o)).join('')}</select></label>`;
      if(P.t==='col')return`<div class="ip"><label>${P.n}</label><div class="ipc"><input type="color" data-si="lp" data-k="${k}" value="${v}"${lk?' disabled':''} aria-label="${P.n}"><span class="note">${v}</span></div></div>`;
      const on=tr&&tr.keys.some(x=>Math.abs(x.t-ES.time)<.015);

    b=`<h3>${esc(L.name)}</h3><p class="note">${SS.KINDS[L.kind].n} · ค่าที่แสดงคือค่า ณ ${ES.time.toFixed(2)} วิ</p><label class="fld"><span>ชื่อ Layer</span><input type="text" data-si="lname" maxlength="30" value="${esc(L.name)}"${lk?' disabled':''}></label>
    <div class="btns"><button class="btn sm" data-sa="lyVis" data-id="${L.id}">${L.visible?'ซ่อน':'แสดง'}</button><button class="btn sm" data-sa="lyLock" data-id="${L.id}">${lk?'ปลดล็อก':'ล็อก'}</button><button class="btn sm" data-sa="lyDup">ทำสำเนา</button><button class="btn sm danger" data-sa="del"${lk?' disabled':''}>ลบ</button></div>
    ${L.kind==='art'?`<div class="grp"><div class="gl">ภาพวาด · ${L.art.frames.length} เฟรม · ${L.art.shapes.length} รูปทรง · ${L.art.size}×${L.art.size}</div><button class="btn pri big" data-sa="artOpen"${lk?' disabled':''}>เปิดหน้าวาด</button></div>`:''}${lk?'<p class="warnp">Layer นี้ถูกล็อก กดปลดล็อกเพื่อแก้ไข</p>':''}<div class="grp"><div class="gl">ตำแหน่งและการแสดงผล</div>${SS.COMMON.map(row).join('')}</div><div class="grp"><div class="gl">เฉพาะ${SS.KINDS[L.kind].n}</div>${SS.KP[L.kind].map(row).join('')}</div>
    <p class="note">ปุ่ม ◆ ใส่ Keyframe ที่ตำแหน่ง Playhead เมื่อค่าใดมี Keyframe แล้ว การแก้ค่าจะแก้ Keyframe ที่เวลานั้นแทน</p>`}
  else if(s.k==='track'||s.k==='key'){const tr=d.tracks.find(t=>t.id===(s.k==='key'?s.track:s.id)),L=d.layers.find(l=>l.id===tr.layer),P=SS.PROPS[tr.prop],lk=L.locked;
    const kl=`<div class="klist">${tr.keys.map(k=>`<button class="chip${s.k==='key'&&s.id===k.id?' on':''}" data-sa="selKey" data-tr="${tr.id}" data-id="${k.id}">${k.t.toFixed(2)} วิ = ${fmtN(k.v)}</button>`).join('')}</div>`;
    if(s.k==='key'){const k=tr.keys.find(x=>x.id===s.id);b=`<h3>Keyframe</h3><p class="note">${esc(L.name)} › ${P.n}</p>${lk?'<p class="warnp">Layer นี้ถูกล็อก</p>':''}${numField('kt','t',{n:'เวลา (วิ)',min:0,max:d.duration,step:.01},k.t,'',lk)}${numField('kv','v',P,k.v,'',lk)}
      <label class="fld"><span>การเปลี่ยนค่าไปยัง Keyframe ถัดไป</span><select data-si="ke"${lk?' disabled':''}>${Object.entries(EASEN).map(([e,n])=>opt(e,n,k.ease===e)).join('')}</select></label>

    else b=`<h3>Track: ${P.n}</h3><p class="note">ของ Layer "${esc(L.name)}" · ${tr.keys.length} Keyframe</p>${kl}<div class="btns"><button class="btn sm" data-sa="kfAdd"${lk?' disabled':''}>◆ เพิ่ม Keyframe ที่ ${ES.time.toFixed(2)} วิ</button><button class="btn sm danger" data-sa="del"${lk?' disabled':''}>ลบ Track</button></div>`}
  else if(s.k==='node'){const n=curNode(),def=SS.NODES[n.type];
    const params=Object.entries(def.p).map(([k,P])=>{const e=d.edges.find(e=>e.to[0]===n.id&&e.to[1]===k);
      if(P.t==='sel')return`<label class="fld"><span>${P.n}</span><select data-si="np" data-k="${k}">${Object.entries(P.o).map(([o,nm])=>opt(o,nm,n.p[k]===o)).join('')}</select></label>`;

      return numField('np',k,P,e?dataIn(d,n,k):n.p[k],'',!!e,e?'ค่ามาจากเส้นเชื่อม':'')}).join('');
    const outsOf=(type,exceptId,toPort)=>{let o='';for(const m of d.nodes){if(m.id===exceptId)continue;for(const[pn,pt]of SS.NODES[m.type].outs)if(pt===type&&!canConnect(d,[m.id,pn],toPort))o+=opt(m.id+'|'+pn,nodeTitle(d,m)+' › '+SS.PORTN[pn],false)}return o};
